<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NESI</title>
<!--
  THE DAILY SURFACE. One page. You open it and you write.

  Kevin's brief, 2026-08-14: "I want a game that holds my writing... I want to
  use the game rather then claude to process my dailly writing of 750 to 1500
  words a day, but useful and shareable for anyone that journals or writes."

  Serves NESI_VISION_as_it_stands.md:22 — "A day has a felt end that no gate
  enforces… The page falling quiet is the mechanic. Tomorrow opens on still
  water; the day begins when your hand does."

  ─────────────────────────────────────────────────────────────────────────────
  TWO MECHANICS PORTED 2026-08-14 FROM WHERE THEY WERE ALREADY BUILT, on Kevin's
  instruction. Neither was invented here; both are carried from the source.

  1 · THE WATERMARK — from nesi/game2d/world.html:471-513, which carries the
      band cut character-for-character from nesi.html:342-358.

        "A .!?… completes a sentence and the trailing cluster leaves with it; a
         period between two digits is inside a number; bare punctuation is not a
         sentence. THE PAGE IS NEVER CLEARED AND DELETION NEVER UN-BANKS.
         Nothing here looks at meaning."

      A sentence banks LIVE, at the keystroke, the moment it completes. What has
      banked reads dimmer on the page — that is the world having taken it. The
      band cut is a punctuation scan and nothing else; it never opens a word.

      WHY IT MATTERS HERE: before this, a day was one blob and a select-all-
      delete lost it. Now the stones are append-only — deleting the page removes
      nothing that has banked. This is the safety property the surface lacked.

      ITS OWN OPEN QUESTION, carried with it rather than smoothed:
      BUILD_RECORD.md:2334 names the watermark "the only irreversible transfer
      in the game" and flags it as a floor breach — a cost that must be visible
      at the moment of the choice. Here the dimming IS that disclosure, and
      whether that is enough is not settled by this port.

  2 · THE HELD ARRIVAL — from nesi/world2d/scripts/writing_store.gd:140-169.

        "An edit made on one face does not silently become the sentence
         everywhere. It is held on the stone as an offer — the face it was made
         on shows it as its reading; every other face shows the standing text
         with the arrival highlighted and attached. TAKING it is his click, and
         only that click settles the body. No timer, no auto-accept, no machine
         acknowledgement — an arrival that is never taken simply stays held,
         BECAUSE HELD IS LAWFUL."

      Here the second face is the line. Drop it, a sentence comes back, and you
      may write over it — but the stone does not change. Your rewrite rides
      attached beneath the standing text until you click it. Never click it and
      it simply stays, forever, and nothing asks.
  ─────────────────────────────────────────────────────────────────────────────

  NOTHING READS WHAT YOU WROTE. The operations performed on your text are: count
  its words to move the water, scan it for sentence-ending punctuation, and store
  it. There is no other. No sentiment, no theme, no sorting, no model call, and
  no network request — the file makes none.

  NO NUMBER REACHES YOU. NOTHING IS CAPPED. NOTHING NAGS. QUITTING LOSES NOTHING.
-->
<style>
  :root{ --sky:#dfe3e0; --ink:#14161a; --taken:#8d9298; --paper:#f4f2ec;
         --water:#6f93a4; --deep:#40606f; --ground:#9d9384; --shoot:#4f6a3d; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--sky)}
  body{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif}
  #c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  /* The page is drawn twice: the backdrop carries the words and shows which of
     them the world has taken; the field carries the caret and is invisible. */
  #bg,#page{position:fixed;inset:0;font:inherit;font-size:19px;line-height:1.85;
    padding:8vh max(6vw,24px) 42vh;white-space:pre-wrap;word-wrap:break-word;
    overflow-y:auto;overflow-x:hidden}
  #bg{color:var(--ink);pointer-events:none}
  #bg .taken{color:var(--taken)}            /* what the world already has */
  #page{border:none;outline:none;resize:none;background:transparent;
    color:transparent;caret-color:var(--ink)}
  /* what the line brought up. Your words only — the machine's never appear. */
  #up{position:fixed;left:50%;top:12vh;transform:translateX(-50%);
    width:min(680px,86vw);background:var(--paper);border:1px solid rgba(90,84,74,.45);
    padding:18px 20px;font-size:17px;line-height:1.62;display:none;
    box-shadow:0 16px 44px rgba(0,0,0,.18);max-height:64vh;overflow-y:auto}
  #up .stand{outline:none;white-space:pre-wrap}
  /* the arrival rides attached beneath the standing text, and taking it is a click */
  #up .arr{margin-top:14px;padding:12px 14px;background:#e8eef1;
    border-left:3px solid var(--water);white-space:pre-wrap;cursor:pointer}
  #up .arr:hover{background:#dfe8ec}
  /* TILES on THE TABLE. Each sentence its own tile, in written order, where your
     hand left it. A merged tile carries its seams; a tile with an arrival is
     ringed. No colour carries a distinction on its own. */
  #table{position:fixed;inset:0;background:#cfc9bd;display:none;overflow:auto}
  #table .tile{position:absolute;width:230px;background:#faf8f2;border:1px solid rgba(90,84,74,.5);
    padding:9px 11px;font-size:12.5px;line-height:1.5;cursor:grab;white-space:pre-wrap;
    box-shadow:0 2px 6px rgba(0,0,0,.07)}
  #table .tile.drag{cursor:grabbing;box-shadow:0 12px 28px rgba(0,0,0,.20);z-index:9}
  #table .tile.over{border-color:#40606f;border-width:2px}
  #table .tile.arr{border-left:3px solid #6f93a4}
  #table .tile.seamed{border-style:double;border-width:3px}
  #table .src{display:block;margin-top:6px;font-size:10px;color:#7d766a;letter-spacing:.04em}
  #seams{position:fixed;left:50%;top:10vh;transform:translateX(-50%);width:min(620px,86vw);
    background:var(--paper);border:1px solid rgba(90,84,74,.5);padding:18px 20px;display:none;
    max-height:70vh;overflow-y:auto;font-size:13.5px;line-height:1.6;
    box-shadow:0 16px 44px rgba(0,0,0,.2)}
  #seams .part{padding:8px 0;border-top:1px solid rgba(90,84,74,.22);white-space:pre-wrap}
  #seams .part:first-child{border-top:none}
  @media (max-width:640px){ #bg,#page{font-size:17px;padding:6vh 20px 46vh} }
</style>

<canvas id="c"></canvas>
<div id="bg" aria-hidden="true"></div>
<textarea id="page" spellcheck="false" autocomplete="off" autocorrect="off"></textarea>
<div id="up"></div>
<div id="table"></div>
<div id="seams"></div>

<script>
"use strict";

/* ═══ the store — one, and it adopts the others ═════════════════════════════ */
const KEY="nesi.water", SCHEMA="water.2";     /* .2 — the watermark and the stones */
let S={ schema:SCHEMA, today:"", text:"", mark:0, stones:[], past:[], returns:0, n:1 };

const dayStamp=()=>{ const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

function load(){
  try{ const r=localStorage.getItem(KEY);
    if(r){ const d=JSON.parse(r);
      if(d && (d.schema===SCHEMA || d.schema==="water.1")){
        S.today=d.today||""; S.text=typeof d.text==="string"?d.text:"";
        S.past=Array.isArray(d.past)?d.past:[]; S.returns=d.returns|0;
        S.mark=d.mark|0; S.stones=Array.isArray(d.stones)?d.stones:[]; S.n=d.n||1;
        /* water.1 kept whole days and no stones. Cut its days into stones ONCE,
           so nothing written before the watermark existed is stranded. */
        if(d.schema==="water.1" && !S.stones.length){
          S.past.forEach(b=> cut(b.text).forEach(t=> S.stones.push({n:S.n++, t, d:b.d}) ));
          cut(S.text).forEach(t=> S.stones.push({n:S.n++, t, d:S.today}) );
          S.mark=S.text.length;
        }
      }
      return;
    }
  }catch(e){}
  adopt();
}

/* ADOPT — the join, done without deleting anything. Reads whatever
   nesi.level_one and nesi.ascent kept and lays it down as ground. NEITHER OLD
   KEY IS WRITTEN OR DELETED. */
function adopt(){
  const gather=k=>{ try{ const r=localStorage.getItem(k); if(!r) return [];
      const d=JSON.parse(r); return Array.isArray(d && d.kept) ? d.kept.filter(x=>typeof x==="string") : [];
    }catch(e){ return []; } };
  gather("nesi.level_one").concat(gather("nesi.ascent"))
    .forEach(t=> S.stones.push({n:S.n++, t, d:"earlier"}) );
  if(S.stones.length) S.past.push({d:"earlier", text:S.stones.map(s=>s.t).join(" ")});
}

/* pad → read back → commit. A bad write never destroys a good record. */
function save(){
  try{ const j=JSON.stringify(S);
    localStorage.setItem(KEY+".pad", j);
    if(localStorage.getItem(KEY+".pad")===j){ localStorage.setItem(KEY,j); localStorage.removeItem(KEY+".pad"); }
  }catch(e){}
}

/* ═══ THE BAND CUT ══════════════════════════════════════════════════════════
   Carried from world.html:472-496, which carries it from nesi.html:342-358.
   A .!?… completes a sentence and the trailing cluster leaves with it; a period
   between two digits is inside a number; bare punctuation is not a sentence.
   Nothing here looks at meaning. */
const isEnd=c=> ".!?…".indexOf(c)>=0;
function cut(v){                     /* the same rule, over a whole string */
  const out=[]; let i=0, start=0;
  while(i<v.length){
    if(isEnd(v[i])){
      if(v[i]==="."&&/\d/.test(v[i-1]||"")&&/\d/.test(v[i+1]||"")){ i++; continue; }
      let j=i; while(j+1<v.length&&isEnd(v[j+1])) j++;
      const seg=v.slice(start,j+1).trim();
      if(seg.length>1&&/[A-Za-z0-9]/.test(seg)) out.push(seg);
      start=j+1; i=j+1;
    } else i++;
  }
  return out;
}

load();

/* the day rolls over. Yesterday's whole text goes down as its own band; its
   stones are already banked and are not re-cut. */
const stamp=dayStamp();
if(S.today && S.today!==stamp){
  if(S.text.trim()) S.past.push({ d:S.today, text:S.text });
  S.text=""; S.mark=0; S.today=stamp; S.returns++; save();
} else if(!S.today){ S.today=stamp; save(); }

/* ═══ the page ══════════════════════════════════════════════════════════════ */
const page=document.getElementById("page"), bg=document.getElementById("bg");
page.value=S.text;
if(S.mark>page.value.length) S.mark=page.value.length;
page.focus(); page.setSelectionRange(page.value.length, page.value.length);
page.addEventListener("scroll", ()=>{ bg.scrollTop=page.scrollTop; });

let quiet=0, stirred=0, level=0, target=0, still=true, dirty=false;

const words = t => t.trim() ? t.trim().split(/\s+/).length : 0;
/* The water's height. A curve, never a threshold — it never reaches the top, so
   there is no line to cross and nothing to complete.

   AND IT NEVER DRAINS. The walk of 2026-08-14 found the flaw: with the height
   taken only from today's page, an empty page meant no water at all — so on a
   fresh morning, and after clearing the page, there was nothing to drop a line
   into and the return was unreachable. The lake does not empty overnight. There
   is a resting level, and the day's writing rises above it. */
const REST = 0.28;
const heightFor = n => REST + (1-REST)*(1 - Math.exp(-n/620));

/* THE PAGE IS DRAWN, and what has banked reads dimmer. That dimming is the
   whole of the disclosure that a transfer has happened. */
function paint(){
  const v=page.value, w=Math.max(0,Math.min(S.mark|0,v.length));
  bg.textContent="";
  const gone=document.createElement("span"); gone.className="taken";
  gone.appendChild(document.createTextNode(v.slice(0,w)));
  bg.appendChild(gone);
  bg.appendChild(document.createTextNode(v.slice(w)));
  bg.scrollTop=page.scrollTop;
}

/* THE WATERMARK. A sentence banks live, at the keystroke, and never un-banks.
   Deleting the page pulls the watermark back — and removes no stone, because
   the stones are append-only. That is the whole of "deletion never un-banks". */
function bandCut(){
  const v=page.value;
  S.text=v; quiet=0; still=false;
  if(S.mark>v.length) S.mark=v.length;
  let i=S.mark, start=S.mark;
  while(i<v.length){
    if(isEnd(v[i])){
      if(v[i]==="."&&/\d/.test(v[i-1]||"")&&/\d/.test(v[i+1]||"")){ i++; continue; }
      let j=i; while(j+1<v.length&&isEnd(v[j+1])) j++;
      const seg=v.slice(start,j+1).trim();
      if(seg.length>1&&/[A-Za-z0-9]/.test(seg)) S.stones.push({n:S.n++, t:seg, d:S.today});
      start=j+1; S.mark=j+1; i=j+1;
    } else i++;
  }
  target=heightFor(words(v));
  dirty=true; paint();
}
page.addEventListener("input", bandCut);

/* THE NEWLINE LANDS, and banks what is held — carried from world.html:498-513.
   The break goes in first, because a record with no line breaks is not a
   record. */
page.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;
  const seg=page.value.slice(S.mark).trim();
  setTimeout(()=>{
    if(seg.length>1&&/[A-Za-z0-9]/.test(seg)) S.stones.push({n:S.n++, t:seg, d:S.today});
    S.mark=page.value.length; S.text=page.value; dirty=true; paint(); save();
  },0);
});

setInterval(()=>{ if(dirty){ save(); dirty=false; } }, 1500);
addEventListener("beforeunload", ()=>{ S.text=page.value; save(); });
addEventListener("visibilitychange", ()=>{ if(document.hidden){ S.text=page.value; save(); } });

/* ═══ THE LINE, AND THE HELD ARRIVAL ════════════════════════════════════════
   Drop a line in the water and one of your own sentences comes back — chosen by
   WHERE you dropped it, never by what it says. You may write over what comes
   up. The stone does not change: your rewrite is held against it as an arrival
   and rides attached beneath the standing text until you click it. Never click
   it and it stays held, and nothing asks. */
const up=document.getElementById("up");
let line=null, openStone=-1;

/* The bed, where the settled stones lie. Derived from how many days have
   settled — never displayed as a figure. */
function bedY(){
  const bands=new Set(held().map(s=>s.d)).size;
  return innerHeight - Math.min(innerHeight*0.30, 26+bands*13);
}
/* A merged part does not double: its words live in the merged stone now, so the
   line reaches what is held and not what was absorbed. */
function soundAt(x){
  const h=held(); if(!h.length) return -1;
  const i=Math.floor((x/innerWidth)*h.length);
  if(i<0||i>=h.length) return -1;
  return S.stones.indexOf(h[i]);
}
function paintUp(){
  up.textContent="";
  if(openStone<0){ up.style.display="none"; return; }
  const st=S.stones[openStone];
  const stand=document.createElement("div");
  stand.className="stand"; stand.contentEditable="true"; stand.spellcheck=false;
  stand.textContent=st.t;
  /* AN EDIT DOES NOT SETTLE ANYTHING. It is held on the stone as an offer. */
  stand.addEventListener("input", ()=>{
    const t=stand.textContent;
    if(t===st.t){ delete st.arrival; } else { st.arrival={t}; }
    dirty=true;
  });
  up.appendChild(stand);
  if(st.arrival && st.arrival.t!==st.t){
    const a=document.createElement("div");
    a.className="arr"; a.textContent=st.arrival.t;
    /* TAKING IT IS HIS CLICK, and only that click settles the body. */
    a.addEventListener("click", ()=>{ st.t=st.arrival.t; delete st.arrival; dirty=true; save(); paintUp(); });
    up.appendChild(a);
  }
  up.style.display="block";
}
addEventListener("pointerdown", e=>{
  /* working in what came up. The Node test is not decoration: contains() throws
     on anything that is not a Node, and a pointer event can carry one. */
  if(e.target instanceof Node && (up.contains(e.target) || tableEl.contains(e.target)
     || seamsEl.contains(e.target))) return;
  if(tableOpen) return;
  if(!still) return;                                /* your hand is still writing */
  const wy=innerHeight*(1-level*0.42);
  if(e.clientY < wy){ return; }
  /* THE BED IS WHERE THE STONES LIE, so that is where the table opens. Above it,
     in the open water, the line goes down. The two acts are the two depths — no
     button names either one. */
  if(e.clientY >= bedY()){ openTable(); return; }
  const i=soundAt(e.clientX);
  line={x:e.clientX, y:wy, d:0, max:innerHeight-wy, found:i>=0};
  openStone=i; paintUp();                            /* nothing found shows nothing */
  if(i>=0) save();
});
addEventListener("keydown", e=>{
  if(e.key==="Escape"){
    if(seamsEl.style.display==="block"){ seamsEl.style.display="none"; return; }
    if(tableOpen){ closeTable(); return; }
    openStone=-1; paintUp(); page.focus(); return;
  }
  if(tableOpen) return;
  if(document.activeElement!==page && !up.contains(document.activeElement)
     && !e.ctrlKey && !e.metaKey && !e.altKey){ page.focus(); still=false; quiet=0; }
});

/* ═══ TILES AND THE TABLE ═══════════════════════════════════════════════════
   Ported 2026-08-14 from nesi/world2d/scripts/writing_table.gd and
   writing_store.gd:232-290. Names are the corpus's own — THE_MAP_2026-08-11.md:
   "Four faces, the intake's own: THE TABLE (centre — it touches all three) ·
   BLIND · TILES · SEQUENTIAL."

   TILES — "each sentence its own tile, in written order" (writing_field.gd:58).
   THE TABLE — "every source together, source legible on every tile. Drag a tile
   and it stays; drop it onto another and they merge, in written order, seams
   kept." (writing_table.gd:2,156)

   THE MERGE, carried exactly:
     "Two or more stones become one, verbatim, IN WRITTEN ORDER — by their
      numbers, NEVER by the order they were picked. THE SEAMS ARE KEPT IN THE
      DATA: every part is snapshotted on the merged stone AND stays in the bank,
      staged 'merged', so a merge could be taken apart later. NO UNMERGE CONTROL
      EXISTS — whether a merge can be undone is unmarked and is Kevin's;
      preserving the option costs nothing, deciding it is not this file's."
     "Source: differing sources are ALL carried, visibly — never one picked,
      never blanked."

   THE SEAMS PANE: "shows them, in written order, verbatim, and closes again.
   READING ONLY: opening changes nothing, records nothing, says nothing."

   AND THE FORK THAT IS NOT ENTERED: "No machine ever decides which sentences are
   attempts at the same sentence — that fork is not entered and not defaulted."
   Nothing here suggests a merge, groups tiles, or orders them by anything but
   the number they were written in. The hand carries a tile onto another or
   nothing happens. */
const tableEl=document.getElementById("table"), seamsEl=document.getElementById("seams");
let tableOpen=false, carried=null, grabDX=0, grabDY=0;

const held = () => S.stones.filter(s=>s.stage!=="merged");

function layout(){
  /* Tiles begin where they fall, in WRITTEN ORDER, and never move again unless a
     hand moves them. Nothing sorts, groups, or re-flows them. */
  const cols=Math.max(1,Math.floor((innerWidth-40)/250));
  held().forEach((s,i)=>{ if(typeof s.x!=="number"){
    s.x=20+(i%cols)*250; s.y=20+Math.floor(i/cols)*116; } });
}
function openTable(){ tableOpen=true; layout(); paintTable(); tableEl.style.display="block"; }
function closeTable(){ tableOpen=false; tableEl.style.display="none"; seamsEl.style.display="none"; page.focus(); }

function paintTable(){
  tableEl.textContent="";
  held().forEach(s=>{
    const el=document.createElement("div");
    el.className="tile" + (s.arrival?" arr":"") + (s.seams?" seamed":"");
    el.style.left=s.x+"px"; el.style.top=s.y+"px";
    el.appendChild(document.createTextNode(s.t));
    /* source legible on every tile — all of them, joined, never one picked */
    const src=document.createElement("span"); src.className="src";
    src.textContent=s.d; el.appendChild(src);
    el.addEventListener("pointerdown", e=>{
      e.stopPropagation();
      /* a merged tile opens its seams — reading only */
      if(s.seams && e.detail>1){ showSeams(s); return; }
      carried=s; grabDX=e.clientX-s.x; grabDY=e.clientY-s.y;
      el.classList.add("drag"); el.setPointerCapture(e.pointerId);
    });
    el.addEventListener("pointermove", e=>{
      if(carried!==s) return;
      s.x=e.clientX-grabDX; s.y=e.clientY-grabDY;
      el.style.left=s.x+"px"; el.style.top=s.y+"px";
      markTarget(s);
    });
    el.addEventListener("pointerup", e=>{
      if(carried!==s) return;
      el.classList.remove("drag");
      const t=targetUnder(s);
      carried=null;
      if(t) merge(s,t); else { dirty=true; save(); paintTable(); }
    });
    tableEl.appendChild(el);
  });
}
/* CENTRE-IN IS THE GUARD AGAINST A GRAZE (writing_table.gd:96). A tile merges
   only when its own centre is inside another — brushing past does nothing. */
function centreOf(s){ return {x:s.x+115, y:s.y+50}; }
function targetUnder(s){
  const c=centreOf(s);
  return held().find(o=> o!==s && c.x>=o.x && c.x<=o.x+230 && c.y>=o.y && c.y<=o.y+100 ) || null;
}
function markTarget(s){
  const t=targetUnder(s);
  [...tableEl.children].forEach((el,i)=>{ el.classList.toggle("over", held()[i]===t && !!t); });
}

/* THE MERGE. Written order by number, never by which tile was carried. */
function merge(a,b){
  const parts=[a,b].sort((x,y)=> x.n-y.n);
  const body=parts.map(p=>p.t).join("\n");                  /* VERBATIM, joined only */
  const days=[...new Set(parts.map(p=>p.d))].join(" · ");   /* ALL sources carried */
  const seams=parts.map(p=>({n:p.n, t:p.t, d:p.d}));        /* every part snapshotted */
  parts.forEach(p=>{ p.stage="merged"; });                  /* and each stays in the bank */
  S.stones.push({ n:S.n++, t:body, d:days, seams,
                  x:Math.min(a.x,b.x), y:Math.min(a.y,b.y) });
  dirty=true; save(); paintTable();
}

/* READING ONLY. Opening changes nothing, records nothing, says nothing. */
function showSeams(s){
  seamsEl.textContent="";
  (s.seams||[]).slice().sort((x,y)=>x.n-y.n).forEach(p=>{
    const d=document.createElement("div"); d.className="part";
    d.appendChild(document.createTextNode(p.t));
    seamsEl.appendChild(d);
  });
  seamsEl.style.display="block";
}
tableEl.addEventListener("pointerdown", ()=>{ seamsEl.style.display="none"; });

/* ═══ the surface ═══════════════════════════════════════════════════════════ */
const cv=document.getElementById("c"), g=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize); resize();

target=heightFor(words(S.text)); level=target;
paint();

let t=0, last=performance.now();
function frame(dt){
  t+=dt; quiet+=dt;
  if(quiet>6000) still=true;                 /* the page falling quiet is the mechanic */
  stirred += ((still?0:1)-stirred)*0.04;
  level += (target-level)*0.035;
  page.style.pointerEvents = still ? "none" : "auto";
  if(line) line.d=Math.min(line.max, line.d+14);
  draw();
}
function draw(){
  const wy=H*(1-level*0.42);
  const sky=g.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#e6e9e6"); sky.addColorStop(1,"#c6cfcc");
  g.fillStyle=sky; g.fillRect(0,0,W,H);

  const bands=new Set(held().map(s=>s.d)).size;
  const gy=bedY();
  g.fillStyle="#9d9384"; g.fillRect(0,gy,W,H-gy);
  for(let i=0;i<bands;i++){ const y=gy+10+i*13; if(y>H-6) break;
    g.strokeStyle= i%2 ? "rgba(120,112,100,.40)" : "rgba(140,132,120,.32)";
    g.lineWidth=1.5; g.beginPath();
    for(let x=0;x<=W;x+=26) g.lineTo(x, y+Math.sin(x*0.008+i*1.3)*2.4);
    g.stroke(); }

  const wg=g.createLinearGradient(0,wy,0,H);
  wg.addColorStop(0,"rgba(111,147,164,.50)"); wg.addColorStop(1,"rgba(64,96,111,.72)");
  g.fillStyle=wg; g.fillRect(0,wy,W,H-wy);

  g.strokeStyle="rgba(240,244,246,.55)"; g.lineWidth=1.5; g.beginPath();
  for(let x=0;x<=W;x+=8){ const a=stirred*3.2;
    g.lineTo(x, wy + Math.sin(x*0.021+t*0.0026)*a + Math.sin(x*0.009-t*0.0017)*a*0.7); }
  g.stroke();

  for(let i=0;i<Math.min(S.returns,40);i++){
    const x=W*0.06 + i*Math.max(16,(W*0.88)/40);
    g.strokeStyle="#4f6a3d"; g.lineWidth=2;
    g.beginPath(); g.moveTo(x,gy+4); g.lineTo(x,gy-11); g.stroke();
    g.fillStyle="#4f6a3d"; g.beginPath(); g.arc(x,gy-13,2.6,0,7); g.fill(); }

  if(line){
    g.strokeStyle="rgba(240,244,246,.8)"; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(line.x,line.y); g.lineTo(line.x,line.y+line.d); g.stroke();
    if(line.found && line.d>=line.max*0.6){ g.fillStyle="rgba(240,244,246,.92)";
      g.beginPath(); g.arc(line.x,line.y+line.d,3.4,0,7); g.fill(); } }
}
(function tick(now){ const dt=Math.min(48,now-last); last=now; frame(dt); requestAnimationFrame(tick); })(performance.now());
</script>
