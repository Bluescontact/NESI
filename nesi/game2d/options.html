<!--
  THE OPTION SPACES, 2026-08-16, on Kevin's ask: "show me the option spaces...
  and offer me an interactive html to navigate my decisions."

  WHY THIS IS A SECOND SURFACE AND NOT AN EDIT OF decisions.html: that page is
  the 2026-08-14 offer and its convention is that a closed fork LEAVES the page.
  Its forks are about levels, palette and gestures. These are at a different
  altitude — the physics, the count, and what the two deposits of 2026-08-16 do
  to both. Its marks live in nesi.marks and are not touched by anything here.
  This page stores under nesi.options.

  BUILT TO THE SAME CHASSIS LAWS, and they are not decoration:
  · A MARK COPIES. Nothing is sent, nothing submitted, no path leaves this page.
    No fetch, no font, no script, no image from anywhere. The file is the whole
    of it.
  · READING IS NEVER GATED BEHIND THE ACT. Every fork's object — what it is,
    where it is live in the code, what each branch costs — renders above its own
    control, before any mark is asked for.
  · PRE-AUTHORED EXITS. Every fork carries "hold — not tonight", written at
    authoring time. Nothing here requires typing in order to leave.
  · DEPTH ZERO. All of them on one surface, at once. The map at the top is a
    view of that surface, never a gate on it — no fork is unreachable until
    another is marked, and marking nothing still shows everything.
  · NOTHING IS DEFAULTED. No fork opens with an option chosen. Where I have a
    read it is printed as MY READ, in its own mark, attached to no button.
  · WHAT IS MEASURED IS NOT OFFERED. The four facts at the top were computed
    today against solid.js and carry no control, because a marked opinion about
    arithmetic is not a decision.

  Nothing on this page directs a body, a day, or a schedule. No score, no
  progress bar, no streak, no nag to return.
-->

/* ══ storage. Yours, kept in this browser, never sent. ═════════════════════ */
const KEY = "nesi.options";
let M = {};
try { M = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { M = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(M)); } catch (e) {} };

const list = document.getElementById("list");
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
const ALL = SETTLED.concat(FORKS);
const byKey = k => ALL.find(f => f.k === k);

/* ══ the map. Drawn from `gates`, so it cannot drift from the cards. ═══════
   It is a VIEW of the surface below and never a gate on it: clicking a node
   scrolls, and nothing here is required before anything down there is legible. */
function renderMap(){
  const COLS = [["F1","F3"],["F2","F5","F4"],["F6","F7"],
                ["F8","F9","F10"],["F11","F12","F13","F14"]];
  const W = 840, colw = 168, top = 34, rowh = 30, pad = 16;
  const rows = Math.max(...COLS.map(c => c.length));
  const H = top + rows * rowh + 18;
  const pos = {};
  COLS.forEach((col, ci) => col.forEach((k, ri) => {
    pos[k] = { x: pad + ci * colw + 8, y: top + ri * rowh };
  }));

  let edges = "", nodes = "", heads = "";
  ["gates it","and these","then these","","" ].forEach((t, i) => {
    if (t) heads += '<text class="lbl" x="' + (pad + i * colw + 8) + '" y="20">' + t + '</text>';
  });
  heads = '<text class="lbl" x="' + (pad + 8) + '" y="20">ROOT FORKS</text>' +
          '<text class="lbl" x="' + (pad + colw + 8) + '" y="20">WHAT THEY GATE</text>' +
          '<text class="lbl" x="' + (pad + 3 * colw + 8) + '" y="20">INDEPENDENT</text>';

  for (const f of FORKS) for (const g of (f.gates || [])) {
    if (!pos[f.k] || !pos[g]) continue;
    const a = pos[f.k], b = pos[g];
    const x1 = a.x + 138, y1 = a.y - 4, x2 = b.x - 4, y2 = b.y - 4;
    edges += '<path d="M' + x1 + ' ' + y1 + ' C' + (x1 + 14) + ' ' + y1 + ' ' +
             (x2 - 14) + ' ' + y2 + ' ' + x2 + ' ' + y2 +
             '" fill="none" stroke="var(--bdr)" stroke-width="1.5"/>';
  }
  for (const f of FORKS) {
    const p = pos[f.k]; if (!p) continue;
    const on = !!M[f.k];
    nodes += '<g class="nd" tabindex="0" role="link" data-k="' + f.k + '">' +
      '<title>' + esc(f.n) + '</title>' +
      '<rect x="' + (p.x - 4) + '" y="' + (p.y - 15) + '" width="142" height="22" rx="2" ' +
        'fill="' + (on ? "var(--mk)" : "var(--sf2)") + '" stroke="' +
        (on ? "var(--mk)" : "var(--bdr)") + '"/>' +
      '<text x="' + (p.x + 3) + '" y="' + p.y + '" fill="' + (on ? "#fffdf8" : "var(--gd)") + '">' +
        f.k + ' · ' + esc(f.n.slice(0, 17)) + (f.n.length > 17 ? "…" : "") + '</text></g>';
  }

  const box = document.createElement("div");
  box.className = "map";
  box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
    '" role="img" aria-label="the fourteen forks and which gate which">' +
    heads + edges + nodes + '</svg>';
  box.querySelectorAll(".nd").forEach(g => {
    const go = () => { const el = document.getElementById("c-" + g.dataset.k);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); };
    g.addEventListener("click", go);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
  list.appendChild(box);
  const note = document.createElement("div");
  note.className = "mapnote";
  note.textContent = "A line means the fork on the left changes what the one on the right is asking — " +
    "not that it locks it. Every fork below reads whole whether or not anything is marked.";
  list.appendChild(note);
}

function card(f, isSettled){
  const d = document.createElement("div");
  d.className = "f " + (M[f.k] ? "marked" : "open");
  d.id = "c-" + f.k;
  let h = '<div class="n">' + f.k + (isSettled ? " · settled by both deposits" :
      (f.gates && f.gates.length ? " · gates " + f.gates.join(", ") : " · independent")) + '</div>' +
    '<h3>' + esc(f.n) + '</h3>' +
    '<p>' + esc(f.q) + '</p>' +
    '<span class="cite">' + esc(f.cite) + '</span>';

  /* what it now reads against — printed only when the upstream fork is marked,
     and it reports his mark back, never a consequence I inferred from it. */
  if (f.up) for (const u of f.up) if (M[u]) {
    h += '<div class="up">' + u + ' is marked: “' + esc(M[u]) + '” — this fork reads against that.</div>';
  }
  /* WHAT THE MARK DID IN CODE — only once it is marked, and only what was
     actually built. Not what the mark means; that is yours. */
  if (M[f.k] && f.landed)
    h += '<div class="landed"><b>what this mark did in the build</b>' + esc(f.landed) + '</div>';
  /* the mirror: his words when he answered somewhere other than here. Renders
     only while the fork is open, and it is NOT a mark — the tally still counts
     this fork as standing, because only his click marks. */
  if (!M[f.k] && f.said)
    h += '<div class="said"><b>you answered this off the page — the click is still yours</b>' + esc(f.said) + '</div>';

  /* A FORK WHOSE GATES ARE NOW MARKED. Computed from your marks, never from my
     memory of them — clear the marks and this line goes with them. */
  if (f.readyWhen && f.readyWhen.every(k => M[k]) && !M[f.k]) {
    d.className += " ready";
    h += '<div class="ready-line">Both gates on this fork are marked now — ' +
      f.readyWhen.join(" and ") + '. It was waiting on them and it is not waiting any more. ' +
      'Nothing has been built on it either way.</div>';
  }
  if (f.cost) h += '<div class="cost">' + esc(f.cost) + '</div>';
  if (f.read) h += '<div class="read"><b>my read, attached to no button</b>' + esc(f.read) + '</div>';
  d.innerHTML = h;

  const box = document.createElement("div");
  box.className = "opts";
  f.o.concat(["hold — not tonight"]).forEach(o => {
    const b = document.createElement("button");
    b.className = "opt" + (o.indexOf("hold —") === 0 ? " hold" : "") + (M[f.k] === o ? " on" : "");
    b.textContent = o;
    b.addEventListener("click", () => {
      if (M[f.k] === o) { delete M[f.k]; save(); render(); status("unmarked"); return; }
      M[f.k] = o; save(); render();
      copy("NESI · MARK · " + f.k + "\n" + f.n + "\n→ " + o + "\n");
    });
    box.appendChild(b);
  });
  d.appendChild(box);
  return d;
}

function render(){
  list.textContent = "";
  renderMap();

  /* WHERE THE SPACE STANDS — read off your marks every render, never stored and
     never remembered by me. Clear the marks and this disappears with them. It
     names what is BUILT separately from what is RULED, because a ruling that
     changed no code is not a smaller decision, it is a different kind. */
  const marked = ALL.filter(f => M[f.k]);
  /* THREE STATES, AND THEY ARE NOT DEGREES OF THE SAME THING. `inCode` is set
     on the fork when the mark actually changed a file; a hold is read off your
     own words, not guessed at; everything else is a ruling that cost no code
     today and still governs what comes after. An earlier pass sniffed the text
     of `landed` for the word "Built" and put F1 in the wrong band — it changed
     day_one.html's seam labels and said so in a sentence that did not begin
     with that word. A flag cannot make that mistake. */
  const held   = marked.filter(f => String(M[f.k]).indexOf("hold —") === 0);
  const built  = marked.filter(f => f.inCode);
  const ruled  = marked.filter(f => !f.inCode && held.indexOf(f) < 0);
  const ready  = FORKS.filter(f => f.readyWhen && f.readyWhen.every(k => M[k]) && !M[f.k]);
  if (marked.length) {
    const s = document.createElement("div");
    s.className = "mk";
    let t = '<div class="n">where the space stands · read off your marks</div>' +
      '<h3>' + marked.length + ' marked · ' + (ALL.length - marked.length) + ' still standing</h3>';
    if (built.length)
      t += '<p><b>In the build:</b> ' + built.map(f => f.k).join(", ") +
           ' — these changed code, and each card says what.</p>';
    if (ruled.length)
      t += '<p><b>Ruled, no code:</b> ' + ruled.map(f => f.k).join(", ") +
           ' — a ruling that costs nothing today still governs everything after it.</p>';
    if (held.length)
      t += '<p><b>Held:</b> ' + held.map(f => f.k).join(", ") +
           ' — nothing built, and nothing foreclosed.</p>';
    if (ready.length)
      t += '<p><b>Waiting on nothing now:</b> ' + ready.map(f => f.k).join(", ") +
           ' — the forks these were gated on are marked.</p>';
    s.innerHTML = t;
    list.appendChild(s);
  }

  const h1 = document.createElement("h2");
  h1.textContent = "measured today — no control, because these are arithmetic";
  list.appendChild(h1);
  for (const m of MEASURED) {
    const d = document.createElement("div");
    d.className = "mk";
    d.innerHTML = '<div class="n">computed against solid.js in this session</div>' +
      '<h3>' + esc(m.n) + '</h3><p>' + esc(m.p) + '</p><span class="cite">' + esc(m.c) + '</span>';
    list.appendChild(d);
  }

  const h2 = document.createElement("h2");
  h2.textContent = "closed by the deposits — confirm or overturn";
  list.appendChild(h2);
  for (const s of SETTLED) list.appendChild(card(s, true));

  let group = "";
  for (const f of FORKS) {
    if (f.g !== group) {
      group = f.g;
      const h = document.createElement("h2");
      h.textContent = group.toLowerCase();
      list.appendChild(h);
    }
    list.appendChild(card(f, false));
  }

  const n = ALL.filter(f => M[f.k]).length;
  document.getElementById("count").textContent =
    ALL.length + " on the surface · " + n + " marked · " + (ALL.length - n) + " still standing";
}

/* ══ a mark copies. Nothing is sent. Three fallbacks, no path outward. ═════ */

let stT = 0;
function status(s){ stEl.textContent = s; clearTimeout(stT);

  const manual = () => {
    const fb = document.getElementById("fallback");
    fb.style.display = "block"; fb.value = text; fb.select();
    status("select and copy by hand");
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => status("marked · copied"))
      .catch(() => { try {
        const t = document.createElement("textarea"); t.value = text;
        document.body.appendChild(t); t.select();
        const okd = document.execCommand("copy"); document.body.removeChild(t);
        okd ? status("marked · copied") : manual();
      } catch (e) { manual(); } });
  } else manual();
}

document.getElementById("copyall").addEventListener("click", () => {
  const lines = ALL.filter(f => M[f.k])
    .map(f => f.k + " · " + f.n + "\n  → " + M[f.k]);
  if (!lines.length) { status("nothing marked yet"); return; }
  copy("NESI · THE OPTION SPACES · marks\n\n" + lines.join("\n\n") + "\n");
});

document.getElementById("clear").addEventListener("click", () => {
  M = {}; save(); render();
  document.getElementById("fallback").style.display = "none";
  status("cleared");
});

render();
</script>
