<!DOCTYPE html>
<meta charset="utf-8">
<title>NESI · level one · the writing tetra</title>
<!--
  LEVEL ONE — THE TETRAHEDRON OF CONTROLLED WRITING SURFACES.
  Four sub-levels. One HTML file, no server needed, no network, no model call.

  ─────────────────────────────────────────────────────────────────────────────
  KEVIN'S SPECIFICATION, 2026-08-14, verbatim and built as written:

    "level one... the tertrahedron controlled writing surfaces.
     4 sub levels.... 100 words on blind surface, unlocks, the 100 word
     sequential face. that unlucks the scatter board where i user sees every
     sentence ever typed, and cant auto sort, auto arrange, and autp highlight
     different things. group and tile sentences to build paragraphs left
     unformed and incomplete. Once the full tetra writing surface is unlocked..
     you have x number of words, and it unlocks the first lens making board."

    "I'm thinking of the tetra, and how one board seeds, the next, and returning
     to the first doesn't undo anything. sloppy writing doesnt hurt anything.
     emotional writing doesnt trigger a response. no one's emotions are being
     read and diagnosed, or asserted.. no judgement on any of the context.."

  ─────────────────────────────────────────────────────────────────────────────
  THE FOUR GUARANTEES, and they are enforced by construction rather than by care

  1 · ONE BOARD SEEDS THE NEXT. Face 2 holds face 1's words. Face 3 holds every
      sentence from 1 and 2. Face 4 stands on all three. Nothing is re-entered.

  2 · RETURNING TO THE FIRST UNDOES NOTHING. Unlocks are monotonic — `open` only
      ever grows, and no path in this file removes a face, clears a sentence, or
      lowers a threshold. Come back to BLIND on any day and write again; the
      scatter keeps every tile where your hand left it.

  3 · SLOPPY WRITING COSTS NOTHING. There is no spellcheck, no minimum sentence,
      no wellformedness test, no length-per-sentence rule, and no path that
      rejects text. A stream of one-word fragments advances the tetra exactly as
      far as polished prose does.

  4 · NOTHING READS WHAT YOU WROTE. Not one branch in this file tests the CONTENT
      of a word. Text is counted for the cap, split on punctuation for tiles, and
      stored — and that is the complete list of operations performed on it. No
      sentiment, no classification, no theme, no highlight-by-meaning, no sort.
      THE FALSIFIER, the corpus's own: "would the response be identical for a
      thousand words of grief and a thousand words of grocery lists?" It is, and
      that is checkable by feeding both and diffing the world.

  LAW 5, THE HAND RUNS EVERYTHING. The scatter board has NO auto-sort, no
  auto-arrange, no auto-highlight. Tiles begin where they fall and move only when
  a hand moves them. Paragraphs are built by putting things near each other, are
  never validated, and are LEFT UNFORMED AND INCOMPLETE on purpose — there is no
  finished state to reach and nothing marks one.

  X IS NOT NAMED, AND IS NOT INVENTED. "you have x number of words" — Kevin did
  not say what x is, so WORDS_FOR_LENS is null and the fourth face opens on the
  three faces being worked. When he names x it is one line, below.
-->
<style>
  html,body{margin:0;height:100%;background:#b6ae9f;overflow:hidden;
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;color:#17171a;}
  canvas{display:block;width:100vw;height:100vh;}
  .panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(720px,88vw);background:#f2efe8;border:1px solid #a49b8c;
    padding:26px 26px 20px;display:none;box-shadow:0 18px 48px rgba(0,0,0,.22);}
  .panel textarea{width:100%;height:210px;border:none;outline:none;resize:none;
    background:transparent;font:inherit;font-size:17px;line-height:1.6;color:#17171a;}
  /* THE BLIND FACE. The words are in the field and are never shown while you
     type — "you type and the words don't perform for you." The caret is hidden
     too, so there is nothing on the surface to watch or to correct against. */
  .panel.blind textarea{color:transparent;caret-color:transparent;text-shadow:none;}
  /* Room, never a number. The unfilled strip is what is left. */
  .room{height:2px;background:#a49b8c;margin-top:14px;}
  .room i{display:block;height:2px;background:#17171a;width:100%;transition:width .12s linear}
</style>

<canvas id="c"></canvas>
<div class="panel" id="wp">
  <textarea id="wt" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  <div class="room"><i id="wr"></i></div>
</div>

<script>
"use strict";

/* ═══ the four faces ═══════════════════════════════════════════════════════ */
const FACES = [
  {k:"blind",      name:"BLIND",       note:"the words don't perform for you", cap:100},
  {k:"sequential", name:"SEQUENTIAL",  note:"the whole keylog, held immutable", cap:100},
  {k:"scatter",    name:"THE SCATTER", note:"your hand groups; nothing sorts"},
  {k:"tetra",      name:"THE TETRA",   note:"three faces standing"}
];

/* Kevin's "x number of words" — UNNAMED, so not invented. While this is null the
   fourth face opens on the three faces having been worked. Name x here and it
   becomes an additional condition; it can never become a *replacement* for the
   three, because that would let volume substitute for the work. */
const WORDS_FOR_LENS = null;

const SCHEMA="l1.1", KEY="nesi.level_one";
let S = {
  open:1,            // how many faces stand. MONOTONIC — nothing in this file lowers it.
  kept:[],           // every sentence ever typed, in the order it came. Append only.
  tiles:[],          // {i, x, y} — where your hand left each tile. Never auto-placed.
  lens:false         // the first lens-making board, opened by the whole tetra
};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(Object.assign({schema:SCHEMA},S))); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(KEY); if(!r) return; const d=JSON.parse(r);
  if(!d||d.schema!==SCHEMA) return;
  // MONOTONIC ON LOAD TOO: take the greater of what is stored and what is held.
  S.open=Math.max(S.open, d.open|0);
  if(Array.isArray(d.kept)) S.kept=d.kept.slice();
  if(Array.isArray(d.tiles)) S.tiles=d.tiles.slice();
  S.lens = S.lens || !!d.lens;
}catch(e){} }
load();

/* THE ONLY OPERATIONS EVER PERFORMED ON YOUR TEXT: count it for the cap, cut it
   into sentences for tiles, and store it. There is no fourth. */
const words = s => s.trim().split(/\s+/).filter(Boolean);
function sentences(t){
  // Split on punctuation, keep everything, drop nothing. A fragment with no
  // full stop is a sentence — sloppy writing costs nothing.
  return String(t).split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
}

/* ADVANCE IS MONOTONIC AND IS THE ONLY WAY `open` CHANGES. */
function advance(to){ if(to>S.open){ S.open=to; save(); } }

/* ═══ the writing panel ════════════════════════════════════════════════════ */
const wp=document.getElementById("wp"), wt=document.getElementById("wt"), wr=document.getElementById("wr");
let typing=false, cap=100, onCommit=null, accepted="";
wt.addEventListener("beforeinput",e=>{
  if(e.inputType&&e.inputType.indexOf("delete")===0) return;
  let d=e.data||""; if(!d&&e.dataTransfer) d=e.dataTransfer.getData("text")||"";
  const nx=wt.value.slice(0,wt.selectionStart)+d+wt.value.slice(wt.selectionEnd);
  if(words(nx).length>cap) e.preventDefault();
});
wt.addEventListener("input",()=>{
  if(words(wt.value).length>cap){ wt.value=accepted; const e=wt.value.length; wt.setSelectionRange(e,e); }
  else accepted=wt.value;
  wr.style.width=(100*Math.max(0,1-words(wt.value).length/cap))+"%";
});
function openWrite(c, blind, cb){
  cap=c; onCommit=cb; typing=true;
  wp.className = "panel" + (blind?" blind":"");
  wp.style.display="block"; wt.value=""; accepted=""; wr.style.width="100%"; wt.focus();
}
function commit(){
  const t=wt.value; if(words(t).length<1) return;
  typing=false; wp.style.display="none"; wt.blur();
  // KEPT VERBATIM. Not trimmed of anything but surrounding whitespace, not
  // corrected, not normalised, not judged.
  const s=sentences(t);
  S.kept=S.kept.concat(s);
  save();
  if(onCommit) onCommit(s);
}

/* ═══ input ════════════════════════════════════════════════════════════════ */
const keys=Object.create(null);
let mouse={x:0,y:0,down:false,clicked:false};
addEventListener("keydown",e=>{
  if(typing){
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); commit(); return; }
    // THE DOOR OUT. Escape leaves the writing surface WITHOUT committing.
    // Until this line, every key but Ctrl+Enter was swallowed and the panel had
    // no close control at all — a first hand was trapped in the game's opening
    // gesture with no exit but the browser tab. Nothing is kept on the way out:
    // leaving is not a failed commit, it is a complete state.
    if(e.key==="Escape"){ e.preventDefault(); typing=false; wp.style.display="none";
      wt.blur(); onCommit=null; face=-1; return; }
    return;
  }
  keys[e.key.toLowerCase()]=true;
  if(e.key===" ") e.preventDefault();
  if(e.key==="Escape") face=-1;
});
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
const cv=document.getElementById("c"), g=cv.getContext("2d");
cv.addEventListener("mousemove",e=>{ const r=cv.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
cv.addEventListener("mousedown",()=>{ mouse.down=true; });
addEventListener("mouseup",()=>{ if(mouse.down) mouse.clicked=true; mouse.down=false; });

let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize); resize();

/* ═══ the tetra, vertex down, you at the point ═════════════════════════════ */
let face=-1, grab=null, L={};

function faceTri(){
  const cx=W/2, cy=H*0.46, R=Math.min(W,H)*0.30;
  const P=[0,120,240].map(d=>{ const a=(d-90)*Math.PI/180;
    return {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)}; });
  return {P, cx, cy, R, point:{x:cx, y:cy+R*1.02}};   // the point, below — you
}
function faceSpot(i){
  const t=faceTri();
  if(i<3){ const a=t.P[i], b=t.P[(i+1)%3];
    return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
  return {x:t.cx, y:t.cy};                            // the whole surface
}

function enter(i){
  if(i>=S.open) return;                               // a face that does not stand yet
  face=i; L={t:0};
  const f=FACES[i];
  if(f.k==="blind"){
    openWrite(f.cap, true, ()=>{ advance(2); face=-1; });
  } else if(f.k==="sequential"){
    openWrite(f.cap, false, ()=>{ advance(3); face=-1; });
  } else if(f.k==="scatter"){
    // Tiles begin where they FALL — a fixed lay-down by index, never a sort.
    // Nothing is grouped, ranked, coloured, or highlighted for you.
    S.kept.forEach((s,k)=>{ if(!S.tiles.some(t=>t.i===k)){
      S.tiles.push({i:k, x: 90 + (k%4)*Math.max(150,(W-220)/4), y: 130 + Math.floor(k/4)*74 }); } });
    save();
  } else if(f.k==="tetra"){
    if(!S.lens && (WORDS_FOR_LENS===null || S.kept.join(" ").split(/\s+/).filter(Boolean).length>=WORDS_FOR_LENS)){
      S.lens=true; save();
    }
  }
}

/* ═══ loop ═════════════════════════════════════════════════════════════════ */
let last=performance.now();
function frame(now){ const dt=Math.min(48,now-last); last=now; step(dt); draw(); requestAnimationFrame(frame); }

function step(){
  if(typing) return;
  if(face===2){                                        // THE SCATTER — the hand only
    if(mouse.down && !grab){
      for(let k=S.tiles.length-1;k>=0;k--){ const t=S.tiles[k];
        if(mouse.x>t.x-8 && mouse.x<t.x+142 && mouse.y>t.y-8 && mouse.y<t.y+34){
          grab=t; S.tiles.push(S.tiles.splice(k,1)[0]); break; } }
    }
    if(grab){ grab.x=mouse.x-66; grab.y=mouse.y-12; }
    if(!mouse.down && grab){ grab=null; save(); advance(4); }
    if(mouse.clicked) mouse.clicked=false;
    return;
  }
  if(face<0 && mouse.clicked){                         // the tetra: pick a face
    mouse.clicked=false;
    for(let i=0;i<4;i++){ const s=faceSpot(i);
      if(Math.hypot(mouse.x-s.x, mouse.y-s.y) < (i<3?46:34)){ enter(i); break; } }
  }
  mouse.clicked=false;
}

function draw(){
  const gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,"#e3e4dc"); gr.addColorStop(1,"#b6ae9f");
  g.fillStyle=gr; g.fillRect(0,0,W,H);
  if(face===1) return drawSequential();
  if(face===2) return drawScatter();
  drawTetra();
}

function drawTetra(){
  const t=faceTri();
  // the three edges of the writing surface
  g.strokeStyle="rgba(60,54,44,.45)"; g.lineWidth=2;
  g.beginPath(); g.moveTo(t.P[0].x,t.P[0].y); g.lineTo(t.P[1].x,t.P[1].y);
  g.lineTo(t.P[2].x,t.P[2].y); g.closePath(); g.stroke();
  // vertex down: the struts running to the point, where you are
  g.strokeStyle="rgba(60,54,44,.28)"; g.lineWidth=1.5;
  t.P.forEach(p=>{ g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(t.point.x,t.point.y); g.stroke(); });
  g.fillStyle="rgba(40,40,44,.75)"; g.beginPath(); g.arc(t.point.x,t.point.y,6,0,7); g.fill();

  for(let i=0;i<4;i++){
    const s=faceSpot(i), stands=i<S.open, f=FACES[i];
    g.beginPath(); g.arc(s.x, s.y, i<3?15:11, 0, 7);
    if(stands){ g.fillStyle= i===3 ? "#c8b98a" : "#8d8578"; g.fill(); }
    g.strokeStyle= stands ? "rgba(40,40,44,.75)" : "rgba(90,84,74,.26)"; g.lineWidth=2; g.stroke();
    if(stands){
      const out = s.y < t.cy ? -26 : 30;
      g.fillStyle="rgba(30,30,34,.88)"; g.font="12px Georgia,serif"; g.textAlign="center";
      g.fillText(f.name, s.x, s.y+out);
      g.fillStyle="rgba(90,84,74,.8)"; g.font="10px Georgia,serif";
      g.fillText(f.note, s.x, s.y+out+(out<0?-13:13));
    }
  }
  // the first lens-making board, once the tetra stands whole
  if(S.lens){
    g.strokeStyle="rgba(150,132,74,.85)"; g.lineWidth=2;
    g.beginPath(); g.arc(W/2, H*0.09, 13, 0, 7); g.stroke();
    g.fillStyle="rgba(200,185,138,.55)"; g.fill();
  }
}

/* SEQUENTIAL — the whole keylog, in the order it came, never rewritten. Not one
   character, not one space. Nothing is highlighted and nothing is grouped. */
function drawSequential(){
  g.fillStyle="#efece4"; g.fillRect(0,0,W,H);
  g.fillStyle="#17171a"; g.font="13px Georgia,serif"; g.textAlign="left";
  let y=54; const x=Math.max(40,(W-760)/2), wid=Math.min(760,W-80);
  for(const s of S.kept){
    for(const line of wrapTo(s, wid, "13px Georgia,serif")){
      if(y>H-40) return; g.fillText(line, x, y); y+=19; }
    y+=8;
  }
}

/* THE SCATTER — every sentence ever typed. Nothing sorts it, nothing arranges
   it, nothing highlights it. Your hand puts things beside other things, and what
   that means is yours. Paragraphs stay unformed and incomplete; nothing here has
   a finished state and nothing marks one. */
function drawScatter(){
  g.fillStyle="#dcd8cd"; g.fillRect(0,0,W,H);
  g.strokeStyle="rgba(140,132,120,.18)"; g.lineWidth=1;
  for(let x=0;x<W;x+=54){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  for(let y=0;y<H;y+=54){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  S.tiles.forEach(t=>{
    const s=S.kept[t.i]; if(s===undefined) return;
    g.fillStyle="rgba(250,248,242,.97)"; g.fillRect(t.x, t.y, 134, 26);
    g.strokeStyle="rgba(90,84,74,.45)"; g.lineWidth=1; g.strokeRect(t.x, t.y, 134, 26);
    g.fillStyle="#17171a"; g.font="10px Georgia,serif"; g.textAlign="left";
    g.fillText(clipTo(s, 124, "10px Georgia,serif"), t.x+6, t.y+17);
  });
}

function wrapTo(text, wid, font){
  g.font=font; const out=[]; let line="";
  for(const w of String(text).split(/\s+/)){
    const t=line?line+" "+w:w;
    if(g.measureText(t).width>wid && line){ out.push(line); line=w; } else line=t;
  }
  if(line) out.push(line); return out;
}
function clipTo(text, wid, font){
  g.font=font; let s=String(text);
  if(g.measureText(s).width<=wid) return s;
  while(s.length>1 && g.measureText(s+"…").width>wid) s=s.slice(0,-1);
  return s+"…";
}

requestAnimationFrame(frame);
</script>
