<!--
  THE ASCENT — twelve levels, each introducing exactly one mechanic.
  One HTML file. No server needed, no network, no model call, no build step.

  ─────────────────────────────────────────────────────────────────────────────
  WHY TWELVE (SEAM S3 — the articulation this serves, cited before building)

  Twelve is not a round number picked for a menu. It is the corpus's own count.

  counsel/reference/NESI_VISION_as_it_stands.md:26 —
    "Twelve lenses seat by layer on the vector equilibrium — four on the axes
     light one tetra, eight on the faces light the star, and all twelve on the
     vertices light not a third solid but the equilibrium itself: twelve vectors
     summing to zero around an empty centre."

  nesi/spec/THE_APEX_AND_THE_SPIRES_2026-08-06.md:73 —
    "I'm thinking about the heliostat as 12 individual mirrors around the
     perimeter of the lake."

  So the twelve levels ARE the twelve seatings, and the layering is the shape of
  the ascent: LEVELS 1–4 light one tetra. LEVELS 5–12 light the star. The twelfth
  closes the equilibrium and opens the only door out.

  Kevin's own words for the first three, verbatim (2026-08-13):
    "you type a hundred words, and you see the water flow into the dam."
    "the second level 250 word, and it gets worked by the user into a lens."
    (third: 500 words, two lenses — 2026-08-13, filed to inbox/)

  And the spine every level sits on, NESI_VISION_as_it_stands.md:20 —
    "write → stone → work → descend → settle → return → green → fruit → leaves."
  ─────────────────────────────────────────────────────────────────────────────

  WHAT IS NOT DECIDED HERE, AND IS NOT DEFAULTED
  The word requirement rises 100 → 250 → 500 across the first three because Kevin
  named those three numbers. It does NOT keep doubling: by level twelve that
  would be 204,800 words, which is a volume gate, and volume gates are the thing
  this game refuses. After level three the escalating thing is the MECHANIC, not
  the word count. If the ladder was meant to keep climbing, that is one constant.

  THE LAWS, held throughout
  No score, rank, XP, percentage, streak, or word count reaches the player — the
  caps are seen as ROOM, never digits. No model call. No network. Words are never
  rewritten, summarised, or interpreted. The hand runs every filter. Set-it-down
  has no feedback. Held is lawful. Nothing prompts, nags, or asks you back.
  Colour is never the only carrier of a distinction. Quitting loses nothing.
-->

<script>
"use strict";

/* ── his water, poured by tools/pour.js, his store never opened for writing ── */
const WATER  = window.WATER || {faces:[[],[],[]], stones:0};
const STONES = (WATER.faces||[[],[],[]]).flat();
const FACES  = WATER.faces || [[],[],[]];

/* ═══ THE TWELVE ═══════════════════════════════════════════════════════════
   Each level introduces exactly one mechanic and introduces it by making you
   do it. `mech` is the mechanic's name; nothing in the game ever displays a
   tutorial for it. */
/* TWO DIRECTIONS, NOT ONE LADDER. Kevin's correction, 2026-08-13, verbatim:

     "the ascent is light and lens and heliostat...
      the descent is the water and filters and nesi"

   Which is the world's own physics, already stated in the governing brief:
   "Light rises. Water and deposit fall. The heliostat shines up from the world
   below." And the two tetrahedra of THE_FOUR_RULINGS_2026-08-07.md:44, RULED:
   "the two tetras meet face to face — one shared triangle. The interface IS
   that triangle: three sediment corners, three rivers inward, the lake on the
   vertical axis, the rim as its boundary."

   So: SIX FALL and SIX RISE, and they meet at the lake. The descent carries the
   water down through the filters to NESI in the deep. The ascent carries light
   up through the lens and the heliostat to the equilibrium and out.

   The turn is not a level. It is the shared face, and you cross it by having
   reached the bottom. */
/* ═══ THE TWELVE ARE ALL WATER, AND THEY ARE EDGES ══════════════════════════
   Kevin's correction, 2026-08-14, verbatim:

     "Each edge is a game level... each game level, affects all other levels.
      12 levels through water mechanics, that seeds the information needed for
      the lens and light mechanics to develop into the final 12 lens heliostat."

   THREE THINGS CHANGED, and they are structural, not cosmetic.

   1 · A LEVEL IS AN EDGE, NOT A SEAT. The lenses take the VERTICES — already
       ruled, 2026-08-07: "the lenses take the vertices — the organs are
       executables, not content." So the levels cannot also be vertices. They are
       the edges: the runs BETWEEN things, which is what water does. A vertex is
       where something comes to rest; an edge is where it travels.

   2 · ALL TWELVE ARE WATER. The lens and the light are no longer six levels
       standing beside six others. They are what the water SEEDS. The twelve run
       the whole water mechanic from the first sentence to the still page, and
       the ascent is what that makes possible — not a parallel ladder.

   3 · EVERY LEVEL AFFECTS EVERY OTHER, and it does so THROUGH THE WATER rather
       than through a rule that says so. There is one WATER below, every level
       both reads and writes it, and no level owns it. Hold at the dam and the
       filter sees a different load. Cut a channel and the ground settles
       elsewhere. Let something go in the deep and the tank opens on a changed
       surface. The coupling is not a feature bolted on; it is the single shared
       body they all stand in.

   WHICH SOLID'S TWELVE EDGES — NOT FIXED, AND DELIBERATELY NOT INVENTED.
   Twelve edges is an octahedron or a cube; the cuboctahedron carries twelve
   VERTICES and twenty-four edges. The corpus has refused this exact class of
   tie-break before — "leave it unfixed, the four are interchangeable" — and a
   build that needs a specific solid has to say so out loud rather than pick one
   to be convenient. So the twelve are ordered and adjacent, each sharing its
   ends with its neighbours, and WHICH polyhedron's edge-set they are is Kevin's
   and is open. Nothing below depends on the answer. */
const LEVELS = [
  {n:1,  key:"tank",     name:"THE TANK",          mech:"writing becomes water",                  cap:100},
  {n:2,  key:"rain",     name:"THE RAIN",          mech:"the world receives without reading"},
  {n:3,  key:"dam",      name:"THE DAM",           mech:"power comes at the release"},
  {n:4,  key:"channel",  name:"THE CHANNEL",       mech:"water cuts where the grain already runs"},
  {n:5,  key:"filter",   name:"THE FILTER",        mech:"separation by behaviour, by hand"},
  {n:6,  key:"stations", name:"THE STATIONS",      mech:"three outputs, always"},
  {n:7,  key:"ground",   name:"THE GROUND",        mech:"what it sets down is the ground"},
  {n:8,  key:"shoal",    name:"THE SHOAL",         mech:"arrangement, never a verdict"},
  {n:9,  key:"sounding", name:"THE SOUNDING",      mech:"the line is yours"},
  {n:10, key:"deep",     name:"THE DEEP",          mech:"what you release comes back as ground"},
  {n:11, key:"stilling", name:"THE STILLING",      mech:"the page falling quiet is the mechanic"},
  {n:12, key:"winter",   name:"THE OVERWINTERING", mech:"time cannot be counterfeited"}
];

/* THE ASCENT is no longer levels. It is what the twelve seed, reached from the
   water once the water has something to give it.

   THE DOOR — built 2026-08-14 on Kevin's mark, "build the door into the ascent."
   Until then this array was declared and read by NOTHING: enter(n) took
   LEVELS[n-1] and there was no node, no click and no path to any of the three.
   They were reachable only from a console, which by the slice rule means they
   were not in the world at all.

   Each run carries its own id as `n`, a string. S.done then holds numbers for
   the twelve and these three names for the ascent, in one map — finish() needs
   no branch and no second registry is created. */
const ASCENT = [
  {n:"lens",      key:"lens",      name:"THE LENS",      mech:"the hand works the material", cap:250},
  {n:"seating",   key:"seating",   name:"THE SEATING",   mech:"the frame is fed, never filled", cap:500},
  {n:"heliostat", key:"heliostat", name:"THE HELIOSTAT", mech:"twelve mirrors, twelve lenses"}
];
const isAscent = n => typeof n === "string";
const runOf = n => isAscent(n) ? ASCENT.find(a=>a.n===n) : LEVELS[n-1];

/* ── state ────────────────────────────────────────────────────────────────── */
const SCHEMA="ascent.2", KEY="nesi.ascent";   // .2 — water became a body, not a number
let S = {
  done:{}, at:1, lenses:[], water:null, released:false, ground:[], caught:[],
  // THE WORLD KEEPS WHAT IT TAKES. Every sentence committed at the tank, held
  // verbatim, appended, never trimmed, never reordered, never read for content,
  // never counted at any door. It does not leave in the cast.
  kept:[],
  routed:{spire:0,lake:0,set:0}, shoots:[], soundings:[], sank:[], rooted:0,
  lastDay:"", cast:false,
  // THE JOIN. Seat indices that have been fed a lens. Mirror i is lit iff i is
  // in here. One list, two places — there is no second registry.
  seated:[],
  // THE GIFT SHOP. What casting made, kept in NESI, never pushed anywhere.
  // Declared here because load() only restores keys that already stand in S.
  shop:[],
  // CONSTRAINTS HE HAS SWITCHED OFF. His, kept with everything else of his, and
  // read before every refusal in the file. Declared here so it survives the night.
  off:[],
  // WHICH FACES OF A LEVEL HAVE BEEN WORKED. Declared here because load() only
  // restores keys that already stand in S — a field invented at runtime is saved
  // and then silently dropped on the next morning, which would have made every
  // level one you had finished open again unworked.
  faces:{},
  // WATER THAT ARRIVED FROM THE DAILY SURFACE and has not yet been reached for.
  // Written only by daily.html's internal open loop; emptied only by a hand at
  // the head of THE TANK. Never read for content, never counted at any door.
  arrived:[],
  // ═══ THE LAND. THE LAND IS THE SAVE FILE. ═══════════════════════════════
  // A packed bed from hand.js — one small integer per column, the height of the
  // ground there. Built 2026-08-16 on Kevin's mark "build the hand".
  //
  // THIS IS THE ONLY KEY IN S THAT IS A RECORD OF WHAT HE DID RATHER THAN OF
  // WHAT HE FINISHED. Everything else here is progress — what is done, what is
  // seated, which faces were worked. This is the shape of the world itself, and
  // it carries no marks, no order, and no account of how it got that way. Two
  // hands that cut the same valley by different routes leave the same land.
  //
  // Declared here because load() only restores keys that already stand in S —
  // a field invented at runtime is saved once and silently dropped the next
  // morning, which for this key would mean the land quietly reverting while
  // every level stayed finished.
  //
  // WATER AND SILT ARE NOT HERE, and that is law 8: the world runs while you
  // are in it and stops when you leave. What the water was doing is not kept;
  // what it had already made of the land is.
  bed:null
};
/* ═══ THE WATER — one body, twelve edges, no owner ══════════════════════════
   "each game level, affects all other levels."

   This is how. There is ONE water. Every level reads it on entry and writes it
   on the act, and no level holds a private copy. The coupling is therefore not a
   rule the code obeys — it is the fact that there is nothing else for a level to
   act on.

   NONE OF THIS REACHES THE PLAYER AS A NUMBER. Every field is read on screen as
   FORM: how high the water stands, how much it carries, whether it is clear or
   turbid, where the bed is cut, whether the surface is moving. Law 2 is not
   strained by a model having numbers in it; it is broken by putting one in front
   of the player, and nothing here is ever printed.

   WHAT SEEDS THE ASCENT. `readings` is the information the twelve produce — one
   entry per level actually played, recording what the water DID there. It is not
   a score and cannot be raised by playing better; it is a trace. The lens and
   the light develop out of it, which is the whole shape Kevin named: twelve
   water levels seeding the twelve-lens heliostat. */
const WATER0 = {
  level:0,        // how high it stands — rises with what was written, falls when released
  load:0,         // what it carries in suspension — raised by cutting, dropped by settling
  clarity:1,      // 1 clear, 0 turbid — falls when disturbed, recovers only in stillness
  cut:[],         // where the bed has been carved; a channel persists and steers later water
  held:0,         // what the dam is holding right now
  released:0,     // what has ever been let go
  still:1,        // 1 the surface is at rest, 0 it is moving
  /* FOG — quarried 2026-08-17 from nesi.html, the closed lineage, on Kevin's
     order "take the quarry into the live build". There it was produced by a
     COUPLING (spin + warm → the spiral) whose output was explicitly "not in the
     basin — fog only", and it thinned whenever the spiral stopped turning.
     Both halves carried: it accumulates only while a coupling runs, and it
     decays whenever that coupling stops.

     IT IS NOT `clarity`, and merging them would lose the mechanic. Clarity
     recovers ONLY IN STILLNESS; fog thins whenever the coupling ends, stillness
     or not. Two different laws, so two fields.

     It changes what can be seen and nothing that is there — which is the
     constitutional law "changed conditions are not changed content" made
     mechanical rather than asserted. Never rendered as a number (law 2). */
  fog:0,          // 0 clear air, 1 fully veiled — rises only under an over-held beam
  readings:[]     // {edge, what} — the trace the twelve leave for the lens and the light
};
/* QUARRIED CONSTANTS — carried at their original values from nesi.html
   (BURN_AT=3400, WT_FOG_RATE=0.34, WT_FOG_FADE=0.045). Not retuned: a quarried
   mechanism that arrives with new numbers is a different mechanism wearing the
   same name. The fog rates are per-second there and are divided by 1000 at the
   call site, because this step() is handed dt in milliseconds. */
const HELIO_FOG_RATE=0.34, HELIO_FOG_FADE=0.045;   /* HELIO_BURN removed with scorch, 2026-08-17 */

function W_(){ if(!S.water || typeof S.water!=="object") S.water=JSON.parse(JSON.stringify(WATER0));
               for(const k in WATER0) if(!(k in S.water)) S.water[k]=WATER0[k];
               return S.water; }
/* ═══ THE PALETTE — one world, one set of materials ═════════════════════════
   Built 2026-08-14 on Kevin's order, from THE_KIT.md's second gap: there are no
   assets in this game at all — no image, no audio, no webfont, no network call,
   everything is drawn — so THE PALETTE IS THE ASSET LIBRARY. And there were two
   of them, one per file, thirty colours against fifteen, unshared.

   This block is the canonical set. IT IS BYTE-IDENTICAL IN daily.html and
   palette_check.js fails if the two ever drift, because "one palette" that
   depends on someone remembering is two palettes with a delay.

   Named by MATERIAL, never by use: a colour called `water` can be a lake, a
   drop, a bead or a stain, and stays true. Nothing here encodes a state, a
   judgement or a rank — colour is never the only carrier of a distinction
   (law 10), so these are the world's substances and nothing else.

   THE WATER HAS TWO DEPTHS AND THAT IS NOT A FUDGE. `water` is the body seen
   deep — pooled, held, in the tank and the lake. `shallow` is the same body at
   the surface, where the writing sits. They were the two blues the count found
   in the two files; keeping both as named depths ends the duplication without
   repainting the surface he writes on every morning. If he wants one flat
   colour it is one token, changed once, in both files at once. */
const PAL = {
  ink:      "#17171a",   // his words, and only his words
  paper:    "#f2efe8",   // anything his words are set on
  water:    "#4a6c7a",   // the body, deep — pooled, held, carried
  shallow:  "#6f93a4",   // the same body at the surface, where writing sits
  deep:     "#40606f",   // what the deep would be, if the deep rendered
  ground:   "#a89f8e",   // what the water sets down
  stone:    "#6f675a",   // gate, wall, dam, anything built
  sky:      "#cdd5d2",   // above, near
  horizon:  "#b6ae9f",   // above, far
  shoot:    "#4f6a3d",   // what grows
  taken:    "#8d9298",   // what the world already has
  edge:     "rgba(40,40,44,.45)",   // every outline in the world
  quiet:    "rgba(90,84,74,.25)"    // every division that must not shout
};
/* RESTORED 2026-08-17, minutes after being wrongly removed. hand.js:124 does
   declare an identical clamp01 — but hand.js:87 wraps its whole body in an IIFE
   precisely so that name stays private, and its own comment at :78 names THIS
   collision as the reason. So clamp01 never collided; only facesOf did. Removing
   this would have broken eighteen call sites on a page that had just been
   brought back to life. */
function clamp01(v){ return Math.max(0, Math.min(1, v)); }

/* A level records what the water did on its edge. One per edge, replaced rather
   than accumulated, so returning to a level revises its trace instead of
   inflating it — there is nothing here to farm. */
function reading(edge, what){
  const w=W_(); const i=w.readings.findIndex(r=>r.edge===edge);
  const r={edge, what};
  if(i>=0) w.readings[i]=r; else w.readings.push(r);
}
/* What the ascent has to work with. A lens becomes available per THREE distinct
   edges that have left a trace — so the twelve seed four, and the full twelve
   lenses are an arc across many returns, not one sitting. */
function seeded(){ return Math.floor(W_().readings.length/3); }

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(Object.assign({schema:SCHEMA},S))); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(KEY); if(!r) return; const d=JSON.parse(r);
  if(!d||d.schema!==SCHEMA) return; Object.keys(S).forEach(k=>{ if(k in d) S[k]=d[k]; });
  /* levels used to be numbered 1 and 2, which collided with the mechanisms.
     A morning's finished levels are not lost to the renumbering. */
  if(S.done[1]&&!S.done[101]){ S.done[101]=true; delete S.done[1]; }
  if(S.done[2]&&!S.done[102]){ S.done[102]=true; delete S.done[2]; }
  }catch(e){} }
load();
const today = () => new Date().toISOString().slice(0,10);
/* THE THREE OPEN TOGETHER, on the condition this file already stated for them
   and on no other: "what the twelve seed, REACHED FROM THE WATER ONCE THE WATER
   HAS SOMETHING TO GIVE IT" (the ASCENT comment above). That is seeded()>=1 —
   the water has produced a first lens's worth of trace.

   No progression is invented among the three. Nothing in the corpus orders them,
   and the heliostat's own note says a mirror may be aimed by hand with no seat
   fed at all — "held is lawful; permanence is earned by seating, never by
   holding harder." Gating it behind THE SEATING would have contradicted that.
   So: one condition, three runs, and which you walk first is yours. */
/* Level one is the way in and is always open. The loose mechanisms open once the
   LEVEL is complete — not once a face of it is — and then in their own order.
   Faces inside a level are never gated against each other: "returning to the
   first doesn't undo anything," and nor does entering the third first. */
/* THE ORDER IS THE RING'S OWN ORDER, not a hand-kept list of special cases. It
   used to say "n===5 opens on level one", which was true only while the map had
   exactly one level on it — gathering two more silently broke the chain. Each
   run on the circuit opens when the run before it on the circuit is done, and
   the first is always open. Derived, so gathering another level cannot break it. */
const unlocked = n => {
  if(isAscent(n)) return !bound("order") || seeded()>=1;
  if(!bound("order")) return true;
  const i = MAPRUNS.findIndex(r=>r.n===n);
  if(i<=0) return i===0;
  return !!S.done[MAPRUNS[i-1].n];
};

/* ── canvas ───────────────────────────────────────────────────────────────── */
const cv=document.getElementById("c"), g=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){ DPR=Math.min(2,devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
addEventListener("resize",resize); resize();

/* ── input ────────────────────────────────────────────────────────────────── */
const keys=Object.create(null);
let mouse={x:0,y:0,down:false,clicked:false,drag:false};

/* ═══ THE FOUR GESTURES ═════════════════════════════════════════════════════
   Built 2026-08-14 on Kevin's order, from THE_KIT.md's first gap: four gestures
   existed in the build and NONE of them had a verb, so every stage hand-rolled
   its own out of `mouse.clicked`, `mouse.down` and a bare key. The dam proved
   what that costs — its act was a key nobody named, with no affordance at all,
   and it was found by a hand rather than by a check.

   These are the four, and there is no fifth. A stage DECLARES which one it uses
   (`g:` on its body) and then uses that verb, so a check can ask all twenty-four
   the same question instead of reading twenty-four hand-rolled hit tests.

     REACH — a hand on a thing, and that thing answers
     HOLD  — gather while held; the LETTING GO is the act
     DRAW  — a course dragged across a surface, which persists
     WAIT  — the stage where doing nothing is the mechanic

   None of them prompts, labels, counts or nags. They are how a hand asks; what
   answers is the stage's own business. */
const GESTURES = ["reach","hold","draw","wait"];

/* ═══ THE CONSTRAINTS — every negative assertion in this world, on the glass ══
   Kevin's law, 2026-08-14, verbatim:

     "A constraint acts as a lint, it's an upstream boundary and should be
      announced at each gate. A negative assertion that isn't user visible and
      modifiable is a failure. the user controls all negative assertions and
      contraints."

   So every "you cannot", "not yet", "only when", "never" that this build
   enforces is REGISTERED HERE, shown in the clear case at the gate where it
   actually binds, and switched off by a hand. Nothing refuses silently.

   `mine` says who put it there: MINE are boundaries this build introduced and
   he never asked for — those are the dangerous ones, because they accumulate
   invisibly. HIS are ones he set. Both are switchable, because he controls all
   of them; the flag is so he can tell at a glance which he never agreed to.

   `where` is the gate it binds at — the case shows only what binds HERE, so a
   boundary is announced where it is met rather than filed in a list.

   THE LINT: tools/constraint_lint.js fails if any refusal in the code is not
   registered here, and if any registered constraint is not actually reached by
   the code. An unannounced boundary is a build failure, not a style note. */
const CONSTRAINTS = [
 { id:"order",     mine:true,  where:"map",
   says:"A run on the circuit opens only after the one before it is finished.",
   keeps:"each run opens on the water the one before it left" },
 { id:"level-done",mine:true,  where:"room",
   says:"A level hands you back to the map only when all four of its faces are worked.",
   keeps:"a level's four faces are one act, so closing it means something" },
 { id:"tank-asks", mine:true,  where:"tank",
   says:"The tank does not ask you to write when water has already arrived from the daily surface.",
   keeps:"a morning is poured once, in the place you actually write" },
 { id:"no-offer",  mine:false, where:"tank",
   says:"Nothing falls on its own. The world never offers; the reach is always yours.",
   keeps:"the reach stays yours — the world waits however long you take" },
 { id:"once",      mine:false, where:"tank",
   says:"A sentence that has been poured is not poured again.",
   keeps:"your sentence stands in the water once, however often you return" },
 { id:"fifth",     mine:true,  where:"*",
   says:"A stage may use only reach, hold, draw or wait. There is no fifth gesture.",
   keeps:"four verbs is what lets every act be asked the same question" },
 { id:"no-number", mine:false, where:"*",
   says:"No number reaches you. No score, count, rank, percentage or progress bar.",
   keeps:"what you see is form — how high, how clear, how far down" },
 /* REGISTERED 2026-08-17 on Kevin's F4 mark. Laws 4 and 5 were enforced by
    nothing anywhere in the build until that mark; this is the boundary they
    became, stated where a hand can see and lift it. */
 { id:"no-machine-sort", mine:false, where:"*",
   says:"No machine decides a category. An origin may say a thing was inferred; nothing computes which fraction it is. Outside the core loop a surface may lift this by declaring itself, in code, with a reason.",

/* switched off by his hand, kept in his own store, and read before every refusal */
function bound(id){
  if(S.off && S.off.indexOf(id)>=0) return false;   /* he turned this one off */
  return true;
}
function boundsHere(){
  const at = view==="level" && cur ? cur.key : view;
  return CONSTRAINTS.filter(c=> c.where==="*" || c.where===at );
}
function unbind(id){
  S.off = S.off || [];
  const i=S.off.indexOf(id);
  if(i>=0) S.off.splice(i,1); else S.off.push(id);
  save();
}

/* REACH. True on the frame a hand comes down on the thing. `near()` is the same
   test without the click, so a stage can show the thing answering BEFORE it is
   taken — which is the whole of having an affordance. */
function near(x,y,r){ return Math.hypot(mouse.x-x, mouse.y-y) < (r||26); }
function reach(x,y,r){ return mouse.clicked && near(x,y,r); }

/* HOLD. Mouse or E or space — a hand that has only ever used a mouse is still a
   hand. `held` is the fraction gathered, 0–1, at the rate the stage sets; it is
   FORM for the stage to draw, never a figure. `let_go` fires once, on release,
   and only if something was actually gathered: a stray click releases nothing. */
function holding(){ return mouse.down || keys["e"] || keys[" "]; }
function hold(dt, secs){
  L._h = L._h || {v:0, was:false, went:false};
  const h=L._h, on=holding();
  if(on && !h.went) h.v = Math.min(1, h.v + dt/((secs||2.6)*1000));
  h.went = (!on && h.was && h.v>0.12) || h.went;
  h.was = on;
  return { held:h.v, letting_go:h.went };
}
/* DRAW. A course, in the stage's own coordinates, that only grows while the hand
   is down and only lands when it lets go with enough of a line to be a line. */
function draw(min){
  L._d = L._d || {path:[], drawing:false, started:false};
  const d=L._d;
  if(mouse.down){ const p=d.path[d.path.length-1];
    if(!p || Math.hypot(mouse.x-p.x, mouse.y-p.y)>18){ d.path.push({x:mouse.x,y:mouse.y}); }
    d.started=true; }
  /* `drawing` MEANS A HAND IS DOWN RIGHT NOW. It used to mean "a hand has been
     down at some point in this room", because it was set true and never cleared
     — so it stayed true after the release forever. Two stages read it as the
     live state and were wrong for it: THE SHOAL never registered a let-go, so
     its level could not be finished by any hand, and THE RAIN's pan went on
     following a pointer that was not held. `started` carries the old meaning for
     the landing test, under a name that says what it is. */
  d.drawing = mouse.down && d.started;
  const landed = !mouse.down && d.started && d.path.length>=(min||8);
  return { path:d.path, drawing:d.drawing, started:d.started, landed };
}
/* WAIT. Doing nothing is the mechanic, so ANY input resets it — and nothing on
   screen ever says so, asks for it, or counts it down. */
function wait(dt, ms){
  L._w = (L._w||0);
  if(mouse.down || mouse.clicked || Object.keys(keys).some(k=>keys[k])) L._w = 0;
  else L._w += dt;
  return { quiet:L._w, still:L._w >= (ms||6000) };
}
addEventListener("keydown",e=>{
  if(typing){
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault(); commitWrite();}
    else if(e.key==="Escape"){e.preventDefault(); closeWrite();}
    return; }
  keys[e.key.toLowerCase()]=true;
  if(e.key===" ")e.preventDefault();
  // TAB opens and closes the case. It is a view of the machine, never of you,
  // so it costs nothing to leave open and nothing to close.
  if(e.key==="Tab"){ e.preventDefault(); CASE.open=!CASE.open; }
  /* ESCAPE STEPS OUT BY ONE, never all the way. Inside a face of a level it puts
     you back in the level — leaving the face unworked and re-enterable, losing
     nothing. Standing in the level it puts you on the map. This is what makes
     the level a place you are inside rather than four doors in a row. */
  if(e.key==="Escape"){
    if(view==="level" && room && room.faces.indexOf(cur&&cur.key)>=0){ view="room"; }
    else if(view==="room"){ room=null; view="map"; }
    else if(view!=="map"){ view="map"; }
  }
});
addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });
cv.addEventListener("mousemove",e=>{ const r=cv.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
cv.addEventListener("mousedown",()=>{ mouse.down=true; mouse.drag=true; });
addEventListener("mouseup",()=>{ if(mouse.down) mouse.clicked=true; mouse.down=false; mouse.drag=false; });

/* ── the writing panel — the one piece of UI, shared by levels 1–3 ────────── */
const wp=document.getElementById("wp"), wt=document.getElementById("wt"), wr=document.getElementById("wr");
let typing=false, writeCap=100, onCommit=null, accepted="";
const words = s => s.trim().split(/\s+/).filter(Boolean);
/* The cap REFUSES the keystroke; it never edits what is already there. */
wt.addEventListener("beforeinput",e=>{
  if(e.inputType&&e.inputType.indexOf("delete")===0) return;
  let d=e.data||""; if(!d&&e.dataTransfer) d=e.dataTransfer.getData("text")||"";
  const nx=wt.value.slice(0,wt.selectionStart)+d+wt.value.slice(wt.selectionEnd);
  if(words(nx).length>writeCap) e.preventDefault();
});
wt.addEventListener("input",()=>{
  if(words(wt.value).length>writeCap){ wt.value=accepted; const e=wt.value.length; wt.setSelectionRange(e,e); }
  else accepted=wt.value;
  wr.style.width=(100*Math.max(0,1-words(wt.value).length/writeCap))+"%";
});
function openWrite(cap,cb){ writeCap=cap; onCommit=cb; typing=true; wp.style.display="block";
  wt.value=""; accepted=""; wr.style.width="100%"; wt.focus(); }
function commitWrite(){ const w=words(wt.value); if(w.length<1) return;
  typing=false; wp.style.display="none"; wt.blur(); if(onCommit) onCommit(w.join(" "), w.length); }
/* THE DOOR OUT OF THE FIRST ROOM. Escape lays the panel aside without
   committing: nothing is kept, nothing is said, and the level is left
   unfinished and re-enterable. Quitting mid-sentence loses nothing and
   nothing on screen says so. */
function closeWrite(){ typing=false; wp.style.display="none"; wt.blur();
  onCommit=null; if(L) L.opened=false; view="map"; }

/* ── view ─────────────────────────────────────────────────────────────────── */
let view="map", cur=null, L={};   // L = the running face's scratch
let room=null;                    // the level you are standing inside, if any

/* ═══ A LEVEL IS NOT A MECHANISM ════════════════════════════════════════════
   Kevin's correction, 2026-08-14, on being shown four "levels" walked:

     "those arent full levels. those are all 4 mechanisms inside the first level."

   He is right, and the map was the evidence: THE TANK, THE RAIN, THE DAM and
   THE CHANNEL each had their own node, their own door and their own way out to
   the map. Four doors is four levels; they were never four levels.

   A LEVEL IS A TETRA WITH FOUR FACES. You enter the level once. Inside it you
   move between its four faces WITHOUT LEAVING — his own shape from the writing
   tetra, 2026-08-13: "one board seeds the next, and returning to the first
   doesn't undo anything." The level is complete when its four faces have been
   worked, and only then does it hand you back to the map.

   LEVEL ONE is built. THE NAME OF LEVEL ONE IS NOT INVENTED HERE — it is
   numbered on screen and its four faces carry their own names, which are his.
   THE OTHER EIGHT MECHANISMS ARE STILL LOOSE on the map. 24 levels of four
   faces is 96 faces and there are twelve mechanisms; the grouping is an open
   question with several workable answers — by circuit, by what the water is
   doing, by what the hand is doing — and it is on the decision surface with
   those options rather than settled here. */
/* ═══ THE LEVELS ════════════════════════════════════════════════════════════
   Gathered BY GESTURE, on Kevin's mark, 2026-08-14, from the loose mechanisms
   and their declared verbs. The gather was a count, not a choice — every stage
   already declared which of the four it is, so the grouping fell out of what was
   already written down:

     reach  7   tank · lens · filter · stations · sounding · deep · seating
     wait   4   ground · winter · stilling · garden
     hold   3   dam · heliostat · cast
     draw   3   rain · channel · shoal

   TWO COMPLETE LEVELS FELL OUT AT ONCE:

     THE REACH — filter · stations · sounding · deep. All four came from the
       eight loose mechanisms. Nothing borrowed, nothing left over.
     THE WAIT  — ground · winter · stilling · garden. Three from the loose eight
       and one from the ascent side, which is the only borrow in the gather.

   AND ONE CONFLICT, WHICH IS THE REAL FINDING. LEVEL ONE as built is
   tank(reach) · rain(draw) · dam(hold) · channel(draw) — a mixed level. Under
   the gesture rule it is not a level at all. It is left standing and marked,
   because the answer to that is his and the two clean levels do not depend on it.

   `hold` has three and `draw` has three, so neither closes yet. 17 mechanisms
   do not divide into fours; what fills those two levels is open. */
/* ═══ LEVEL ONE, REBUILT ════════════════════════════════════════════════════
   Kevin's order, 2026-08-14, after choosing the gesture rule: "rebuild level
   one."

   The old level one was tank(reach) · rain(draw) · dam(hold) · channel(draw) —
   grouped by the water's opening sequence, which is a different rule from the
   one he chose, so under gesture it was not a level at all.

   THE TANK IS A REACH, so level one is the reach level and keeps the entry. Its
   other three come from the four reaches that were gathered a moment ago; DEEP
   goes loose, because it reads what THE SOUNDING leaves and cannot be the level
   that teaches the reach.

   WHAT THE FOUR ACTUALLY MAKE, which was not designed and is why this is the
   right four: writing becomes water · your hand separates it · your hand routes
   it three ways · you drop a line and one of your own sentences comes back.
   That is the whole give-and-return circuit, and every step of it is one hand
   on one thing. A first level that teaches the reach teaches the world.

   AND IT IS NAMED BY ITS GESTURE, not by a name invented for it. Grouping by
   gesture makes the naming fall out the same way the grouping did. */
/* LEVEL IDS LIVE ABOVE THE MECHANISM IDS AND CANNOT COLLIDE WITH THEM.
   They were 1 and 2, and the mechanisms are numbered 1..12 — so THE WAIT and
   THE RAIN both answered to 2, `enter(2)` resolved to the level, and THE RAIN
   was on the ring and unreachable. Found by counting ids before building on
   them. A level's id is now 100 + its place, which no mechanism can reach. */
const ROOMS = [
  { n:101, name:"THE REACH", mech:"a hand on a thing, and it answers",
    faces:["tank","filter","stations","sounding"] },
  { n:102, name:"THE WAIT",  mech:"doing nothing is the mechanic",
    faces:["ground","winter","stilling","garden"] },
  { n:103, name:"THE HOLD",  mech:"gather, then let go",
    faces:["dam","heliostat","membrane","cast"] },
  { n:104, name:"THE DRAW",  mech:"a course across a surface, which persists",
    faces:["rain","channel","shoal","table"] },
  /* AND THE FIFTH FELL OUT OF THE OTHER FOUR. With the three built, exactly four
     mechanisms were left over and all four are a reach — spring, lens, deep,
     seating. Nothing was arranged to make that happen; it is what 20 = 5 × 4
     looks like when every mechanism already declares its verb.

     Named THE RETURN because that is what its four do: what went down comes back
     up · the hand works what came back · what you release returns as ground · the
     frame is fed by what rose. The word is the corpus's own — "the world must
     return what it takes". */
  { n:105, name:"THE RETURN", mech:"what comes back, and what the hand does with it",
    faces:["spring","lens","deep","seating"] }
];
const roomOf = n => ROOMS.find(r=>r.n===n);

/* THE GARDEN AND THE CAST HAVE BODIES AND NO NAMES. Both are built, both are
   walked, and neither appears in LEVELS or ASCENT — so nothing in the file could
   say what they were called, and the first level to contain one crashed on
   drawing its own face. Their names and mechanics are the ones already written
   at THE_ASCENT.md:11-12, not new ones. */
const UNLISTED = [
  {n:"garden",   key:"garden",   name:"THE GARDEN",      mech:"it fills only from play"},
  {n:"cast",     key:"cast",     name:"THE CAST",        mech:"the world loses what it gives"},
  {n:"membrane", key:"membrane", name:"THE MEMBRANE",    mech:"the shape separates, flow is the readout"},
  {n:"spring",   key:"spring",   name:"THE SPRING",      mech:"what went down comes back up"},
  {n:"table",    key:"table",    name:"THE WATER TABLE", mech:"you draw where the water goes"}
];
const faceOf = k => LEVELS.find(l=>l.key===k) || ASCENT.find(l=>l.key===k)
                 || UNLISTED.find(l=>l.key===k);
const worked = k => !!(S.faces&&S.faces[k]);
const levelDone = (r) => (r||room||ROOMS[0]).faces.every(worked);

function enter(n){
  if(!unlocked(n)) return;
  const r=roomOf(n);
  if(r){ view="room"; room=r; S.at=n; save(); return; }            /* the level, not a face */
  cur=runOf(n); if(!cur) return;
  view="level"; L={t:0}; S.at=n; save();
  const f=SET[cur.key]; if(f&&f.enter) f.enter();
}
/* going into one of the level's own faces — no map in between */
function enterFace(k){
  cur=faceOf(k); if(!cur) return;
  view="level"; L={t:0}; save();
  const f=SET[cur.key]; if(f&&f.enter) f.enter();
}
/* THE ONE WAY OUT of a face is back into the level it belongs to. Only the
   level's completion reaches the map. */
function finish(){
  if(room && room.faces.indexOf(cur.key)>=0){
    S.faces=S.faces||{}; S.faces[cur.key]=true;
    if(levelDone(room) || !bound("level-done")){ S.done[room.n]=true; save(); room=null; view="map"; return; }
    save(); view="room"; return;
  }
  S.done[cur.n]=true; save(); view="map";
}

/* ═══ THE TWELVE MECHANICS ═════════════════════════════════════════════════ */
const SET = {

/* 1 · THE TANK — "you type a hundred words, and you see the water flow into the
   dam." Writing becomes water. Every sentence you completed falls as a drop and
   pools behind the gate. Nothing reads it. */
tank:{ g:"reach", cost:"the morning is poured once; what falls here is not in the daily surface any more", enter(){ const w=W_();
    // READS THE ONE WATER: you open on the surface the other eleven left.
    L.drops=[]; L.pool=w.level*90; L.sent=[]; L.fed=0;
    /* WATER THAT ALREADY ARRIVED — built 2026-08-14, "build the first 4 levels
       playable."

       Level one asked him to write a hundred words. He had already written that
       morning, in the daily surface, and dropped sentences to the lake — which
       under the internal open loop LEAVE nesi.water and ARRIVE here. The tank
       was making him write the same day twice, which is the level named for
       holding the writing failing to hold the writing he had.

       So what arrived is IN THE ROOM, held at the head of the tank. It is not
       offered, announced, or counted: "the world never offers; the reach is
       always yours" (Kevin's mark, 2026-08-14). It hangs there, and a hand that
       reaches for one lets it fall. Nothing falls on its own and nothing asks.

       Arrivals are consumed the moment they fall, so the same sentence is never
       poured twice; it moves from `arrived` into `kept`, where the world keeps
       what it takes. */
    L.held=(S.arrived||[]).slice(0,9).map((t,i)=>({ t, x:W*0.5-200+i*46, y:96+ (i%3)*22 }));
    L.hadHeld=L.held.length;
    if(L.hadHeld && bound("tank-asks")) return;   /* there is water here; do not ask for more */
    if(!L.opened){ L.opened=true;
    openWrite(100,(text,n)=>{ L.sent=text.split(/(?<=[.!?])\s+/).filter(Boolean);
      if(!L.sent.length) L.sent=[text]; L.fed=0;
      /* THE WORLD MUST RETURN WHAT IT TAKES. Until 2026-08-14 the hundred words
         became a pool height and nothing else — the level named for holding the
         writing did not hold it. They are now kept, verbatim, in the store.
         Kept is not shown. It is not counted. It waits in the ground. */
      S.kept=(S.kept||[]).concat(L.sent); save(); }); } },
  step(dt){ if(typing) return;
    /* the reach: a hand on a held arrival lets that one fall, and only that one */
    if(L.held&&L.held.length){
      const i=L.held.findIndex(h=>reach(h.x,h.y));
      if(i>=0){ const h=L.held.splice(i,1)[0];
        L.drops.push({x:h.x,y:h.y,v:0,s:h.t});
        S.kept=(S.kept||[]).concat([h.t]);
        if(bound("once")) S.arrived=(S.arrived||[]).filter(t=>t!==h.t);
        save(); } }
    if(L.sent&&L.fed<L.sent.length){ L.t+=dt; if(L.t>240){ L.t=0;
      L.drops.push({x:W*0.5+(Math.random()-0.5)*180,y:120,v:0,s:L.sent[L.fed]}); L.fed++; } }
    L.drops.forEach(d=>{ d.v+=0.5; d.y+=d.v; });
    const floor=H-190;
    L.drops=L.drops.filter(d=>{ if(d.y>=floor-L.pool*1.6){ L.pool=Math.min(90,L.pool+3);
      /* PER DROP, NOT PER FRAME. This lives here and not in the step body below
         because step() runs every frame: at 0.02 a frame the load reached its
         ceiling in a second and a half and the lake went black. A sentence
         landing brings what a sentence brings, once. */
      { const w=W_(); w.load=clamp01(w.load+0.05); w.clarity=clamp01(w.clarity-0.04); }
      return false; } return true; });
    /* WRITES THE ONE WATER: writing raises the level, stirs the surface, and
       ARRIVES CARRYING SOMETHING.

       The load was the gap the rebuilt level one exposed. Grouped by gesture,
       the reach level is tank · filter · stations · sounding, and it is FIRST —
       so on a cold morning nothing has stirred the bed yet. The filter had
       nothing suspended to separate and its whole effect clamped to zero; the
       stations had nothing to route. Under the old grouping the dam sat between
       them and did this job, and the dam is a hold, so it is not in this level.

       Writing arrives carrying material, which is the world's own physics —
       water carries fractions — and it makes the reach level self-contained:
       write, separate by hand, route three ways, drop a line and get one back.
       Small, because the dam's release is still what really stirs the bed. */
    const w=W_(); w.level=clamp01(L.pool/90); w.still=0;
    /* it is done when nothing is left waiting and nothing is left falling —
       whether the water was written here or arrived from the daily surface */
    /* BOTH OF THESE MUST ASK WHETHER THERE WAS ANYTHING TO DO. `L.sent` is an
       empty array before the panel commits, and an empty array is truthy — so
       `L.sent && L.fed>=L.sent.length` was TRUE in an untouched room and the
       level finished itself the instant it opened, on nobody's act. */
    const written = L.sent && L.sent.length>0 && L.fed>=L.sent.length;
    const reached = L.hadHeld>0 && L.held && L.held.length===0;
    if((written||reached)&&!L.drops.length&&L.pool>0){ L.settle=(L.settle||0)+dt;
      if(L.settle>1200){ reading(1,"raised"); save(); finish(); } } },
  draw(){ sky(); const floor=H-190;
    // the gate — a dam wall the water pools behind
    g.fillStyle="#6f675a"; g.fillRect(W*0.5+200, floor-120, 26, 140);
    g.fillStyle="rgba(74,108,122,.75)"; g.fillRect(W*0.5-260, floor-L.pool*1.6, 460, L.pool*1.6+22);
    g.strokeStyle="rgba(40,40,44,.4)"; g.strokeRect(W*0.5-260, floor-L.pool*1.6, 460, L.pool*1.6+22);
    g.fillStyle="#4a6c7a"; L.drops.forEach(d=>{ g.beginPath(); g.arc(d.x,d.y,6,0,7); g.fill(); });
    /* what arrived, held at the head of the tank. Drawn as water, not as a list:
       each one a bead that swells under a hand and falls when reached for. No
       label, no order shown, nothing counted, and none of them says a word. */
    if(L.held) L.held.forEach(h=>{
      const on=near(h.x,h.y);
      g.fillStyle= on ? "rgba(74,108,122,.95)" : "rgba(74,108,122,.62)";
      g.beginPath(); g.arc(h.x,h.y,on?11:8,0,7); g.fill();
      g.strokeStyle="rgba(40,40,44,.35)"; g.lineWidth=1; g.stroke();
      if(on){ g.strokeStyle="rgba(40,40,44,.30)"; g.beginPath();
        g.moveTo(h.x,h.y+13); g.lineTo(h.x,h.y+30); g.stroke(); } });
    ground(floor+22);
    // THE WRITING TETRA, vertex down, standing behind an aperture in this wall.
    // "Four faces of one writing tetra, vertex down, you at the point."
    windowDrag(window3d(20, 20, Math.min(210,W*0.22), Math.min(180,H*0.24),
                        "tetra", Math.min(58,W*0.06))); }
},

/* ═══ THREE MECHANISMS, ONE PER GESTURE ══════════════════════════════════════
   Kevin, 2026-08-14: "do it." The count said each remaining gesture was exactly
   one short of a level — reach 3, hold 3, draw 3 — and 17 + 3 = 20 = five fours.
   These are the three, and every one of their names is the corpus's own:

     THE MEMBRANE   ~/.claude/CLAUDE.md:103 — one of the control room's four
                    stations, named there and built nowhere.
     THE SPRING     :106 — "each spire has a dam, a SPRING AT ITS BASE, a
                    triangular ground deposit, and a river."
     THE WATER TABLE :103 — the first of the four stations, likewise unbuilt.

   Nothing here is a new noun. Three named places that had no mechanic. */

/* ↓ THE MEMBRANE — the hold that completes THE HOLD.
   "nothing classifies, the shape separates, flow is the readout."
   You press the water against a shaped screen. What passes is decided by the
   SHAPE — fine matter goes through, coarse does not — and no part of this reads
   what anything is. Flow is the only readout: the harder you press, the more
   moves, and the coarse never moves however hard you press. */
membrane:{ g:"hold", enter(){ const w=W_();
    L.cap=Math.max(0.12, w.load);           // there is only as much to press as is carried
    L.through=0; L.done=false;
    // what stands against the screen: fine passes, coarse cannot, and the
    // difference is a behaviour, not a label. Colour carries nothing here.
    L.stuff=Array.from({length:14},(_,i)=>({ y:100+((i*37)%220), x:0,
      fine:i%3!==0, ph:i*0.7 })); },
  step(dt){ const h=hold(dt, 2.2), w=W_();
    L.press=h.held;
    L.stuff.forEach(b=>{ b.ph+=dt*0.003;
      if(b.fine) b.x=Math.min(1, b.x + h.held*dt/900);    // fine matter crosses
      else       b.x=Math.min(0.46, b.x + h.held*dt/1400); });  // coarse stops at the screen
    L.through=L.stuff.filter(b=>b.x>=1).length;
    if(h.letting_go && !L.done){ L.done=true;
      // WRITES: what crossed is out of suspension. The coarse is still carried.
      const passed=L.through/L.stuff.length;
      w.load=clamp01(w.load - passed*L.cap*0.7);
      w.clarity=clamp01(w.clarity + passed*0.4); w.still=0;
      reading(13,"passed"); save(); finish(); } },
  draw(){ sky(); const fy=H-150, sx=W*0.5;
    // the screen itself, drawn as a screen
    g.strokeStyle=PAL.edge; g.lineWidth=2;
    for(let y=90;y<fy;y+=9){ g.beginPath(); g.moveTo(sx,y); g.lineTo(sx,y+5); g.stroke(); }
    L.stuff.forEach(b=>{ const x=90+(sx-90)*Math.min(b.x,0.46)/0.46 + (b.x>0.46?(b.x-0.46)/0.54*(W-sx-90):0);
      g.fillStyle=b.fine?"rgba(74,108,122,.72)":"rgba(90,84,74,.85)";
      g.beginPath();
      if(b.fine) g.arc(x, b.y+Math.sin(b.ph)*3, 4, 0, 7);
      else g.rect(x-6, b.y-5, 12, 10);
      g.fill(); });
    // the press, drawn as a plate that advances — form, never a figure
    g.fillStyle="rgba(90,84,74,.55)"; g.fillRect(60, 80, 16+(L.press||0)*40, fy-80);
    ground(fy); }
},

/* ↑ THE SPRING — the reach that completes THE REACH's rise-side twin.
   "each spire has a spring at its base." What went down comes back up here,
   and only what the ground has finished with. It hangs at the mouth; a hand
   takes it or leaves it. Nothing rises on its own and nothing is offered. */
spring:{ g:"reach", enter(){ const w=W_();
    // READS: what was released and what sank is what the spring has to give.
    const n=Math.max(1, Math.min(5, (S.sank||[]).length || Math.round(w.released*4)+1));
    L.up=Array.from({length:n},(_,i)=>({ x:W*0.5-((n-1)*54)/2+i*54, y:H*0.55, t:0, took:false }));
    L.took=0; },
  step(dt){ L.up.forEach(u=>{ u.t+=dt; });
    const u=L.up.find(u=>!u.took && reach(u.x,u.y));
    if(u){ u.took=true; L.took++;
      (S.ground=S.ground||[]).push("risen");           // it comes back as ground
    }
    if(L.took>=L.up.length && !L.done){ L.done=true; const w=W_();
      w.level=clamp01(w.level+0.06*L.up.length); w.still=0;
      reading(14,"risen"); save(); finish(); } },
  draw(){ sky(); const fy=H-150; ground(fy);
    g.fillStyle="rgba(74,108,122,.35)";
    g.beginPath(); g.ellipse(W*0.5, H*0.62, 150, 34, 0, 0, 7); g.fill();
    L.up.forEach(u=>{ if(u.took) return;
      const on=near(u.x,u.y), r=on?12:9, b=Math.sin(u.t*0.003)*4;
      g.fillStyle= on?"rgba(74,108,122,.95)":"rgba(74,108,122,.62)";
      g.beginPath(); g.arc(u.x, u.y+b, r, 0, 7); g.fill();
      g.strokeStyle=PAL.edge; g.lineWidth=1; g.stroke();
      if(on){ g.strokeStyle="rgba(40,40,44,.30)"; g.beginPath();
        g.moveTo(u.x,u.y+b-r-4); g.lineTo(u.x,u.y+b-r-20); g.stroke(); } }); }
},

/* ↓ THE WATER TABLE — the draw that completes THE DRAW.
   The first of the control room's four stations. Three spires stand on it and
   you draw where the water goes. The course PERSISTS in the one water, exactly
   as the channel's does — this is the same act one level up, on the table
   rather than in the bed. Nothing compares the three spires to each other. */
table:{ g:"draw", enter(){ const w=W_();
    L._d={path:[], drawing:false};
    L.spires=[0,1,2].map(i=>({ x:W*0.5+(i-1)*Math.min(200,W*0.2), y:H*0.34 }));
    L.fed=[false,false,false]; },
  step(){ const w=W_();
    const d=draw(10);
    // a course reaching a spire feeds it; which ones is the hand's business
    L.spires.forEach((sp,i)=>{ if(d.path.some(p=>Math.hypot(p.x-sp.x,p.y-sp.y)<40)) L.fed[i]=true; });
    if(d.landed && !L.done){ L.done=true;
      // WRITES: the course stands in the water, and what it fed is carried.
      w.cut=d.path.slice(0,240);
      w.level=clamp01(w.level-0.04); w.still=0;
      reading(15,"tabled"); save(); finish(); } },
  draw(){ sky();
    g.fillStyle="#b8b0a0"; g.fillRect(0,0,W,H);
    g.strokeStyle="rgba(140,132,120,.28)"; g.lineWidth=1;
    for(let x=0;x<W;x+=52){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
    L.spires.forEach((sp,i)=>{ g.strokeStyle=PAL.edge; g.lineWidth=L.fed[i]?3.5:1.5;
      g.beginPath(); g.moveTo(sp.x, sp.y-30); g.lineTo(sp.x-26, sp.y+26); g.lineTo(sp.x+26, sp.y+26);
      g.closePath();
      g.fillStyle= L.fed[i] ? "rgba(74,108,122,.34)" : "rgba(242,239,232,.30)"; g.fill(); g.stroke(); });
    const p=(L._d&&L._d.path)||[];
    if(p.length>1){ g.strokeStyle="rgba(74,108,122,.85)"; g.lineWidth=9;
      g.lineCap="round"; g.lineJoin="round"; g.beginPath();
      p.forEach((q,i)=> i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)); g.stroke(); }
    ring(mouse.x,mouse.y,14); }
},

/* 2 · THE LENS — "250 word, and it gets worked by the user into a lens."
   Your own sentences stand on three faces. Read each by holding. When a thing
   can be held across all three, that is the lens. */
lens:{ g:"reach", cost:"reading across all three is what costs — the lens is time, not material", enter(){ L.read=[false,false,false]; L.hold=-1; L.hm=0; L.p={x:W/2,y:H-120}; },
  step(dt){ if(typing) return;
    /* THE REACH, in the shared verb — and this seat is why the check had to ask
       every stage. It DECLARED a reach and ran on WASD: a walking idiom that is
       not one of the four gestures, hiding inside a stage that said it was a
       reach. No act a walk could produce ever finished it.

       It also declared `let near`, which SHADOWED the verb `near()` across this
       whole body — so the verb could not have been used here even by accident.

       Reading a face is a reach on that face: the hand goes where it reaches
       rather than being steered a pixel at a time. The holding that reads is
       unchanged; it is the STEERING that was the undeclared fifth gesture. */
    const V=facePts(); let on=-1;
    for(let i=0;i<3;i++){ if(L.read[i]) continue; if(i>0&&!L.read[i-1]) continue;
      if(near(V[i].x,V[i].y,70)){ on=i; break; } }
    if(on>=0){ L.p.x += (V[on].x-L.p.x)*0.25; L.p.y += (V[on].y-L.p.y)*0.25; }

    /* AND THE READ IS TWO REACHES, not a timed hold. Holding for a second was
       the last timed act in the world and it made this seat a HOLD wearing a
       reach's label — which would have made THE RETURN a mixed level, the same
       conflict level one had. The honest fix is not to relabel it: it is to give
       this seat the held form every other reach now has. The first reach brings
       the face up; the second takes it. A face brought up and left simply stays
       up, and nothing is on a clock. */
    if(on>=0 && reach(V[on].x, V[on].y, 70)){ mouse.clicked=false;
      if(L.hold!==on){ L.hold=on; }        /* first reach: it stands up, held */
      else { L.read[on]=true; L.hold=-1; } /* second reach on the same face: read */
    }
    if(on<0) L.hold=-1;
    L.hm = (L.hold>=0) ? 1000 : 0;         /* the panel reads fully open when held */
    if(L.read[0]&&L.read[1]&&L.read[2]&&!L.asked){ L.asked=true;
      openWrite(250,(text)=>{ S.lenses.push(text); save(); finish(); }); } },
  draw(){ sky(); const V=facePts();
    if(L.read[0]&&L.read[1]&&L.read[2]){ g.strokeStyle="rgba(40,40,44,.4)"; g.lineWidth=2;
      g.beginPath(); g.moveTo(V[0].x,V[0].y); g.lineTo(V[1].x,V[1].y); g.lineTo(V[2].x,V[2].y); g.closePath(); g.stroke(); }
    g.strokeStyle="rgba(90,84,74,.6)"; g.lineWidth=2; g.beginPath(); g.arc(W/2,H*0.46,44,0,7); g.stroke();
    for(let i=0;i<3;i++){ const v=V[i];
      g.fillStyle="#8d8578"; g.fillRect(v.x-46,v.y-11,92,22);
      g.strokeStyle="rgba(40,40,44,.5)"; g.lineWidth=1.5; g.strokeRect(v.x-46,v.y-11,92,22);
      if(L.read[i]) sheetAt(v,FACES[i]||[]);
      else if((i===0||L.read[i-1])&&near(v.x,v.y,70)){
        g.fillStyle="rgba(30,30,34,"+(L.hold===i?(0.35+0.65*L.hm/1000):0.35).toFixed(2)+")";
        g.font="26px Georgia,serif"; g.textAlign="center"; g.fillText("·",v.x,v.y-24); } }
    dot(L.p.x,L.p.y); }
},

/* 3 · THE DAM — "A dam restricts flow, accumulates head, and generates power at
   the moment of release — never at the moment of restriction." Hold, then let
   go. Holding is not producing. */
dam:{ g:"hold", cost:"held head is not power — nothing downstream moves for as long as you hold", enter(){ const w=W_();
    // READS: there is only as much head to gather as the tank actually raised.
    L.cap=Math.max(0.15, w.level); L.head=0; L.open=0; L.spun=0; L.done=false;
    /* THE GATE HAS A HANDLE NOW — built 2026-08-14, "build the first 4 levels
       playable." The act here is hold-then-let-go, on E or space, and NOTHING
       ON SCREEN SAID SO. A hand that entered saw a wall and a still wheel and
       could stand in the room forever. reach_check's own law: an act with no
       affordance is not in the world.

       So the handle is a body, not a caption. It sits on the gate, it moves
       down while you hold, it rides back up when you let go, and it is the only
       thing in the room that answers a hand. No number, no label, no prompt to
       press anything, and it never nags: it simply is the part that moves. */
    L.handle=0; },
  step(dt){ if(typing) return;
    /* the mouse works it too — a hand that has only ever used a mouse is still
       a hand, and the handle is a thing you can push */
    /* THE HOLD, in the shared verb. The stage says how much there is to gather
       (its cap) and how long a full gather takes; the verb owns mouse-or-key,
       the fraction, and the once-only letting go. */
    const h=hold(dt, 2.6), w=W_();
    L.handle += ((holding()&&!L.released ? 1 : 0) - L.handle) * 0.18;
    if(!L.released){ L.head=Math.min(L.cap, h.held*L.cap); w.held=L.head; if(holding()) w.still=1; }
    if(h.letting_go && !L.released){ L.released=true; }
    if(L.released){ L.open=Math.min(1,L.open+dt/700);
      L.spun+=L.head*L.open*dt*0.02; L.head=Math.max(0,L.head-dt/1400);
      // WRITES: the release spends the level, stirs it, and puts the held load
      // into suspension — which is exactly what THE FILTER will have to sort.
      w.held=L.head; w.still=0;
      // The dam asks for no writing. It is a hand act — hold, then let go — and
      // the whole of it is that the wheel turns only on the drop.
      if(L.open>=1&&L.head<=0&&!L.done){ L.done=true; S.released=true;
        w.released=clamp01(w.released+L.cap); w.level=clamp01(w.level-L.cap*0.55);
        w.load=clamp01(w.load+L.cap*0.8); w.clarity=clamp01(w.clarity-L.cap*0.5);
        reading(3,"released"); save(); finish(); } } },
  draw(){ sky(); const fy=H-170;
    g.fillStyle="rgba(74,108,122,.75)"; const hh=40+L.head*180;
    g.fillRect(W*0.5-300,fy-hh,300,hh); // the head, accumulating behind
    g.fillStyle="#6f675a"; g.fillRect(W*0.5,fy-230,28,230-L.open*150);
    if(L.released){ g.fillStyle="rgba(74,108,122,.6)"; g.fillRect(W*0.5,fy-80,120,80); }
    /* THE HANDLE. Rest is up; held is down. It is the one moving part in the
       room before anything else moves, so it is what a hand finds. */
    if(!L.released){
      const hx=W*0.5+44, top=fy-214, travel=54, hy=top+(L.handle||0)*travel;
      g.strokeStyle="rgba(60,56,48,.75)"; g.lineWidth=5;
      g.beginPath(); g.moveTo(hx,top-14); g.lineTo(hx,hy+16); g.stroke();
      g.fillStyle="#8b8474"; g.fillRect(hx-17,hy,34,17);
      g.strokeStyle="rgba(40,38,34,.6)"; g.lineWidth=1.5; g.strokeRect(hx-17,hy,34,17);
      /* and the head it is gathering, drawn as a rising mark on the wall — form,
         never a figure */
      if(L.head>0){ g.fillStyle="rgba(74,108,122,.5)";
        g.fillRect(W*0.5-6,fy-40-L.head*180,10,4); }
    }
    // the wheel: it turns ONLY on the drop
    g.save(); g.translate(W*0.5+170,fy-52); g.rotate(L.spun);
    g.strokeStyle="#5a5348"; g.lineWidth=4;
    for(let i=0;i<8;i++){ g.beginPath(); g.moveTo(0,0);
      g.lineTo(Math.cos(i*Math.PI/4)*46,Math.sin(i*Math.PI/4)*46); g.stroke(); }
    g.beginPath(); g.arc(0,0,46,0,7); g.stroke(); g.restore();
    ground(fy); }
},

/* 4 · THE GROUND — "what it sets down IS the ground; there is no other ground."
   The released water carries your sentences down and they settle. You do not
   place them. */
ground:{ g:"wait", cost:"a stone set is ground now; the shape you make is the shape that stays", enter(){ L.blocks=STONES.slice(0,14).map((s,i)=>({s,x:60+i*Math.max(60,(W-160)/14),y:-40-i*70,v:0,set:false})); },
  /* THE WAIT, in the shared verb. You do not place them; the correct act here is
     not to act, and the verb is what says so. */
  step(dt){ let all=true;
    /* the verb, said out loud: the correct act at this seat is not to act */
    wait(dt, 1200);
    L.blocks.forEach(b=>{ if(b.set) return; all=false; b.v+=0.42; b.y+=b.v;
      const fy=H-150-Math.sin(b.x*0.01)*14;
      if(b.y>=fy){ b.y=fy; b.v*=-0.22; if(Math.abs(b.v)<0.6){ b.set=true; } } });
    if(all&&!L.k){ L.k=(L.k||0)+dt; }
    if(L.k){ L.k+=dt; if(L.k>1400){ const w=W_();
      // WRITES: settling takes the load out of the water and leaves it clearer.
      S.ground=L.blocks.map(b=>b.s);
      w.load=clamp01(w.load-0.45); w.clarity=clamp01(w.clarity+0.30); w.still=1;
      reading(7,"settled"); save(); finish(); } } },
  draw(){ sky();
    // A settled block and a falling one are the same block. Settling is a fact
    // about where it is, not a state the world congratulates.
    L.blocks.forEach(b=>{ g.fillStyle="#9d9384";
      g.fillRect(b.x-26,b.y-9,52,18); g.strokeStyle="rgba(40,40,44,.45)"; g.lineWidth=1;
      g.strokeRect(b.x-26,b.y-9,52,18); });
    ground(H-130); }
},

/* 5 · THE FILTER — four fractions, told apart by BEHAVIOUR, never by colour
   alone: bedload sinks fast, suspended hangs, dissolved is invisible, film
   clings to the top. The hand catches them. No computed pass. */
filter:{ g:"reach", cost:"a fraction you catch is out of the water; the separation cannot be walked back", enter(){ const w=W_();
    // READS: the load the dam put into suspension is what there is to sort. Let
    // nothing go and there is almost nothing here — which is a fact about the
    // water, not a judgement about you.
    L.need=Math.max(2, Math.round(2+w.load*6));
    L.rate=Math.max(180, 620-w.load*420);
    L.bits=[]; L.caught=0; L.spawn=0;
    L.kinds=[{k:"bedload",v:2.6,w:0},{k:"suspended",v:0.7,w:1.4},{k:"film",v:0.12,w:0.2}]; },
  step(dt){ L.spawn+=dt;
    if(L.spawn>L.rate&&L.bits.length<18){ L.spawn=0; const t=L.kinds[(Math.random()*3)|0];
      L.bits.push({x:120+Math.random()*(W-240),y:90,ph:Math.random()*7,t}); }
    L.bits.forEach(b=>{ b.ph+=dt*0.004; b.y+=b.t.v; b.x+=Math.sin(b.ph)*b.t.w; });
    /* THE HELD FORM, built 2026-08-14. THE_WORK_SURFACES named this seat as one
       of the two with none: a reach settled on contact, so a separation could
       not be walked around or set back down.

       A lifted bit now RIDES AT THE TOP OF THE ROOM, held, and a second reach on
       it settles it into the bank. A reach on the water below puts it back where
       it came from, still falling. Nothing settles on one touch and nothing
       expires — a bit left riding simply rides. */
    if(mouse.clicked){
      const h=L.hand;
      if(h && reach(h.x,h.y,26)){ mouse.clicked=false; S.caught.push(h.t.k); L.caught++; L.hand=null; }
      else if(h && reach(mouse.x,mouse.y,1e9)){ mouse.clicked=false;
        L.bits.push({x:mouse.x,y:Math.max(90,mouse.y-40),ph:h.ph,t:h.t}); L.hand=null; }
      else for(let i=0;i<L.bits.length;i++){ const b=L.bits[i];
        if(reach(b.x,b.y,26)){ mouse.clicked=false;
          L.hand={t:b.t, ph:b.ph, x:W*0.5, y:56}; L.bits.splice(i,1); break; } } }
    L.bits=L.bits.filter(b=>b.y<H-90);
    // WRITES: what the hand takes out of suspension leaves the water clearer.
    if(L.caught>=L.need){ const w=W_();
      w.load=clamp01(w.load-0.10*L.caught); w.clarity=clamp01(w.clarity+0.09*L.caught);
      reading(5,"sorted"); save(); finish(); } },
  draw(){ sky();
    /* what is held rides at the head of the room, and answers a hand */
    if(L.hand){ const h=L.hand, on=near(h.x,h.y,26);
      g.strokeStyle="rgba(40,40,44,.22)"; g.lineWidth=1;
      g.beginPath(); g.moveTo(h.x,h.y+16); g.lineTo(h.x,h.y+34); g.stroke();
      g.fillStyle= on?"rgba(93,111,120,.98)":"rgba(93,111,120,.78)";
      g.beginPath();
      if(h.t.k==="bedload") g.arc(h.x,h.y,on?11:9,0,7);
      else if(h.t.k==="suspended"){ g.ellipse(h.x,h.y,on?13:11,on?8:6,0,0,7); }
      else g.rect(h.x-12,h.y-3,24,6);
      g.fill(); g.strokeStyle=PAL.edge; g.lineWidth=1; g.stroke(); }
    L.bits.forEach(b=>{ g.fillStyle="#5d6f78"; g.beginPath();
      if(b.t.k==="bedload"){ g.arc(b.x,b.y,8,0,7); }
      else if(b.t.k==="suspended"){ g.arc(b.x,b.y,5,0,7); }
      else { g.ellipse(b.x,b.y,13,3,0,0,7); }
      g.fill(); });
    g.strokeStyle="rgba(60,54,44,.5)"; g.lineWidth=2; g.beginPath();
    g.moveTo(90,H-90); g.lineTo(W-90,H-90); g.stroke();
    ring(mouse.x,mouse.y,24); }
},

/* 6 · THE STATIONS — "three outputs at every station: sent to a spire, dropped
   to the lake, set down with no feedback at all." The third is the one that
   matters, and it does nothing on purpose. */
stations:{ g:"reach", cost:"a route spends the water on one destination, and the other two do not get it", enter(){ L.queue=S.caught.slice(0,6); L.i=0; },
  step(){ if(reach(mouse.x, mouse.y, 1e9)){ mouse.clicked=false;
      /* NOTHING TO ROUTE IS NOT A FINISHED LEVEL. Grouping by gesture put this
         face beside the tank and the filter, and a hand can enter it first —
         at which point the queue is empty. It used to finish on the first click,
         because `L.i >= L.queue.length` is true at 1 >= 0: the level completed
         having routed nothing, which is an act with no material dressed as an
         act. The faces inside a level are not gated against each other and will
         not be; an empty station is simply empty, and a hand that finds it empty
         has learned where the water comes from. */
      if(!L.queue.length) return;
      const b=bays();
      for(const [k,r] of Object.entries(b)){
        /* THE REACH, in the shared verb: a bay answers a hand that comes down
           anywhere on it, and the verb owns whether a hand came down. */
        if(near(r.x+r.w/2, r.y+r.h/2, Math.max(r.w,r.h)*0.62)){
          /* THE HELD FORM, built 2026-08-14. The brief's own words: HOLD THE
             ROUTE BEFORE WALKING IT. A reach on a bay used to send immediately
             and routing has no undo — so the one act in this seat that cannot
             be taken back was also the one that took a single touch.

             The piece now RESTS ON THE LIP of the bay you reached for. Reach
             another bay and it moves there; reach the same bay again and it
             goes. A route left resting simply rests: nothing sends it. */
          if(L.lip!==k){ L.lip=k; break; }
          L.lip=null;
          /* THE THREE OUTPUTS, AND THE THIRD CANNOT ACKNOWLEDGE ─────────────
             This used to be one line — S.routed[k]++ — run identically for all
             three bays. Law 6 held because nobody had added a toast to the
             third, not because the third was shaped so a toast could not be
             added. Obeying a law and being unable to break it are different
             states, and only the second survives the next hand in this file.

             send() is the only way a piece leaves, and its RETURN VALUE is the
             only thing anything on screen may read to show a departure. The
             value it returns is the member the piece left on — and the solid
             gives the set-down no member (solid.js outputsOf: {out:"set",
             member:null}). So the third output returns undefined, not by a rule
             this file remembers but because THE GEOMETRY HAS NOTHING THERE TO
             RETURN. A confirmation on the set-down is now un-writable rather
             than merely unwritten.

             The COUNT still rises for all three. That is the seat's own field
             five — the record of where each went is complete and permanent —
             and it never reaches the player, which is the only thing law 2
             asks. The record is not the acknowledgement. */
          L.ack = send(k); L.i++;
          if(L.i>=L.queue.length){ const w=W_();
          // WRITES: sending downstream puts it back in the water; dropping to
          // the lake takes it out; setting down does nothing at all, and that is
          // the point — law 6, no destination, no feedback.
          w.load=clamp01(w.load + S.routed.spire*0.05 - S.routed.lake*0.04);
          reading(6,"routed"); save(); finish(); } break; } } } },
  draw(){ sky(); const b=bays();
    Object.entries(b).forEach(([k,r])=>{
      const held=(L.lip===k);
      g.strokeStyle= held?"rgba(40,40,44,.9)":"rgba(60,54,44,.6)"; g.lineWidth= held?3.5:2;
      g.strokeRect(r.x,r.y,r.w,r.h);
      /* what rests on the lip, waiting for the hand to say it again */
      if(held){ g.fillStyle="rgba(74,108,122,.85)";
        g.beginPath(); g.arc(r.x+r.w/2, r.y-12, 9, 0, 7); g.fill();
        g.strokeStyle=PAL.edge; g.lineWidth=1; g.stroke(); }
      g.fillStyle="rgba(60,54,44,.55)"; g.font="12px Georgia,serif"; g.textAlign="center";
      g.fillText(k==="spire"?"↑":k==="lake"?"↓":"—", r.x+r.w/2, r.y+r.h/2+5); });
    /* THE DEPARTURE, drawn ONLY from what send() handed back ─────────────────
       A piece that left on a member draws a short trace along it and fades. The
       set-down handed back nothing, so this block is unreachable for it — not
       skipped by an if on the bay's name, which the next hand could delete, but
       unreachable because there is no value to draw from. That is the whole
       difference between the law being obeyed and the law being built.

       It is form and it is brief: a line leaving the bay, no glyph, no text, no
       count, and nothing names the member it went on. */
    if(L.ack){ L.ackT=(L.ackT||0)+1;
      const a=Math.max(0, 1-L.ackT/45);
      if(a<=0){ L.ack=null; L.ackT=0; }
      else { const r=b[L.ack.on===memberFor("spire")?"spire":"lake"] || b.spire;
        g.strokeStyle="rgba(74,108,122,"+(a*0.8)+")"; g.lineWidth=2;
        g.beginPath(); g.moveTo(r.x+r.w/2, r.y-14);
        g.lineTo(r.x+r.w/2, r.y-14-(1-a)*46); g.stroke(); } }
    if(L.i<L.queue.length){ g.fillStyle="#8d8578"; g.fillRect(W/2-30,H*0.30,60,26);
      g.strokeStyle="rgba(40,40,44,.5)"; g.strokeRect(W/2-30,H*0.30,60,26); }
    ring(mouse.x,mouse.y,18); }
},

/* 8 · THE HELIOSTAT — TWELVE mirrors around the perimeter of the lake, joined
   to the twelve seats above.

     "I'm thinking about the heliostat as 12 individual mirrors around the
      perimeter of the lake… I want to be able to have the avatar engage with
      THE WHOLE ARRAY FROM ANY SINGLE ARRAY."
        — THE_APEX_AND_THE_SPIRES_2026-08-06.md:73,76
     "the load-bearing clause is not the twelve — it is 'the whole array from any
      single face.'"  — THE_VISION_WHOLE_2026-08-06.md:317

   THE JOIN, and it runs one way only:
     Your hand aims the WHOLE array at once, from wherever you are standing. That
     aim lasts exactly as long as your hand is on it — let go and the unseated
     mirrors fall slack. A mirror stays aimed when you are gone ONLY if its seat
     above has been fed a lens (level 9). Held is lawful; permanence is earned by
     seating, never by holding harder.

   So this level teaches the array, and level 9 is what makes any of it keep. */
heliostat:{ g:"hold", cost:"light spent on growth is light not spent on clarity, and the day is one day", enter(){ L.a=-0.9; L.grown=0;
    /* THE PARTITION — the day is one day, and now that is arithmetic ─────────
       The cost line above has said "light spent on growth is light not spent on
       clarity" since the seat was built, and nothing anywhere enforced it: you
       could grow every shoot and the water lost nothing. A cost declared in a
       string is a sentence about the seat, not a property of it.

       One unit of light per visit. Every shoot takes a fifth of it. Whatever is
       left when the hand leaves goes back to the water as clarity. Spent plus
       returned is exactly one, so aiming here is arithmetically not aiming
       there — which is the seat's whole claim, finally load-bearing.

       IT IS NEVER A NUMBER ON SCREEN. The budget is read as form and only as
       form: the beam simply has less to give and dims, and when it is gone the
       mirrors still turn and nothing grows. No bar, no gauge, no warning, and
       nothing says why — the absence is the feedback (law 6), and law 2 is not
       strained by a model holding a number it never shows. */
    L.light=1; },
  step(dt){
    /* THE HOLD, in the shared verb: the aim is live only while a hand holds it,
       and the verb owns "is a hand holding". */
    hold(dt, 1.0);
    if(holding()){ L.a=Math.atan2(mouse.y-lakeY(), mouse.x-W/2); }
    // every mirror that is currently throwing light: your hand's aim on the
    // unseated ones, plus each seated mirror on its own locked bearing
    let anyHit=false;
    mirrors().forEach((m,i)=>{ const a=seatedAim(i); const ang=(a!==null)?a:(holding()?L.a:null);
      if(ang===null) return; if(beamCrossesWater(m,ang)) anyHit=true; });
    /* FOG stays — Kevin ruled scorch broken 2026-08-17, not fog. Fog is the
       changed-conditions mechanic: it veils what is there and alters none of it,
       and it thins when the coupling stops. It now runs off a held beam alone. */
    { const w2=W_(), held = holding() && anyHit;
      w2.fog = held ? Math.min(1, w2.fog + HELIO_FOG_RATE*dt/1000)
                    : Math.max(0, w2.fog - HELIO_FOG_FADE*dt/1000); }
    if(anyHit){ L.on=(L.on||0)+dt;
      /* a shoot spends a fifth of the day. With none left the beam still lands
         and still lights the water — it simply has nothing more to give, and
         nothing on screen says so. */
      if(L.on>800 && L.light>0){ L.on=0; L.light=Math.max(0,L.light-0.2);
        S.shoots.push(Math.round(W*0.2+Math.random()*W*0.6)); L.grown++; } }
    else L.on=0;
    if(L.grown>=3){ const w=W_();
      /* WHAT WAS NOT SPENT ON GROWTH COMES BACK AS CLARITY. This is the other
         half of the partition and the half that makes it a partition at all:
         without it, unspent light would simply vanish and growing would cost
         nothing. Three shoots leave 0.4 of the day, so a hand that grew the
         minimum clears the water and a hand that grew five clears none. */
      w.clarity=clamp01(w.clarity + 0.12*L.light);
      /* EDGE 12, NOT 11. The partition pass first wrote 11, which THE STILLING
         already holds — and reading() replaces by edge, so the two would have
         overwritten each other's trace on every visit and seeded() would have
         counted one where there were two. Twelve was NOT free — OVERWINTERING already held it, and reading() replaces by edge, so the two overwrote each other and seeded() counted one trace where there were two. That gates unlocked(). Moved to 16 on 2026-08-17; 17-24 remain free. */
      reading(16,"aimed"); save(); finish(); } },
  draw(){ sky(); const ly=lakeY(), full=(S.seated||[]).length>=12;
    // "The final unfold — all twelve mirrors seated, the equilibrium — makes the
    // water go glass-clear for the first time." The clearing is built. WHAT IS
    // SEEN THROUGH IT IS NOT: law 9 ("the deep never renders") carries three
    // live readings, NOT DEFAULTED, Kevin's. So the water clears and nothing is
    // drawn beneath it.
    g.fillStyle= full ? "rgba(74,108,122,.16)" : "rgba(74,108,122,.55)";
    g.beginPath(); g.ellipse(W/2,ly,Math.min(W*0.34,360),58,0,0,7); g.fill();
    if(full){ g.strokeStyle="rgba(200,230,240,.7)"; g.lineWidth=1.5;
      g.beginPath(); g.ellipse(W/2,ly,Math.min(W*0.34,360),58,0,0,7); g.stroke(); }
    mirrors().forEach((m,i)=>{ const locked=seatedAim(i);
      const ang=(locked!==null)?locked:(holding()?L.a:null);
      if(ang!==null){ const hit=beamCrossesWater(m,ang);
        /* THE BUDGET IS READ AS FORM. A day with light left throws a full beam;
           a day spent throws a thin one. Never a figure, never a bar. */
        const lit=0.25+0.75*(L.light===undefined?1:L.light);
        g.strokeStyle= hit?"rgba(255,238,180,"+(0.85*lit).toFixed(3)+")"
                          :"rgba(255,238,180,"+(0.28*lit).toFixed(3)+")";
        g.lineWidth= hit?(2+4*lit):2;
        g.beginPath(); g.moveTo(m.x,m.y); g.lineTo(m.x+Math.cos(ang)*1600,m.y+Math.sin(ang)*1600); g.stroke(); }
      g.save(); g.translate(m.x,m.y); g.rotate((ang!==null)?ang:Math.PI/2);
      // a seated mirror is drawn standing; a slack one lies flat. Behaviour, not
      // colour, carries the difference (law 10).
      g.fillStyle= (locked!==null)?"#e6dcb4":"#a89f8e";
      g.fillRect(-3,-26,6,52); g.restore(); });
    S.shoots.forEach(x=>{ g.strokeStyle="#4f6a3d"; g.lineWidth=3;
      g.beginPath(); g.moveTo(x%W,ly+70); g.lineTo(x%W,ly+40); g.stroke(); });
    ground(ly+92);
    /* THE FOG, LAST — over everything, because it is a condition of encounter
       and not a thing in the world. It veils what is already there and changes
       none of it: lift the beam and it thins, and what was under it is exactly
       what it was. NEVER A FIGURE — no bar, no percentage, no count. The veil
       IS the reading, which is the only form law 2 permits. */
    { const fg=W_().fog||0;
      if(fg>0.02){ g.fillStyle="rgba(236,238,240,"+(0.55*fg).toFixed(3)+")";
        g.fillRect(0,0,W,H); } } }
},

/* 8 · THE OVERWINTERING — "ground fed again on a later day roots; a thousand
   releases in one afternoon root nothing." The only mechanic that a heavy day
   cannot force. If you came back on the same day, nothing roots, and bare
   ground is bare — not failing. */
winter:{ g:"wait", cost:"the day itself — a thousand releases in one afternoon root nothing", enter(){ L.same = (S.lastDay===today()); if(!S.lastDay){ S.lastDay=today(); save(); L.same=true; } },
  step(dt){ L.t+=dt;
    if(!L.same&&L.t>1600&&!L.k){ S.rooted++; S.lastDay=today();
      // WRITES: rooting takes something out of the water for good.
      const w=W_(); w.released=clamp01(w.released+0.08); w.still=1; save(); L.k=1; }
    if(L.t>2600&&(!L.same||L.ack)){ reading(12, L.same?"held":"rooted"); save(); finish(); }
    /* THE WAIT, in the shared verb. A day that has not passed cannot be made to
       pass; all a hand can do here is see that, and the seeing is a wait. */
    if(L.same && wait(dt, 900).still) L.ack=true; },
  draw(){ sky(); const fy=H-150; ground(fy);
    breathe(H-150);      /* the light moves; time cannot be hurried */
    // what is standing, and what is simply bare
    for(let i=0;i<6;i++){ const x=W*0.22+i*(W*0.56/5);
      if(i<S.rooted){ g.strokeStyle="#4f6a3d"; g.lineWidth=3;
        g.beginPath(); g.moveTo(x,fy); g.lineTo(x,fy-38); g.stroke();
        g.beginPath(); g.arc(x,fy-42,6,0,7); g.fillStyle="#4f6a3d"; g.fill(); }
      else { g.strokeStyle="rgba(90,84,74,.35)"; g.lineWidth=2;
        g.beginPath(); g.moveTo(x-9,fy); g.lineTo(x+9,fy); g.stroke(); } } }
},

/* 2 · THE RAIN — "the moment a sentence completes, it falls into the world as
   visible rain… Never read, never judged — but lavishly received." The world
   answers THAT you wrote, never WHAT. Your hand catches nothing here; it only
   moves the catchment under what is already falling. */
rain:{ g:"draw", enter(){ const w=W_();
    // READS: it rains as much as the tank raised. A dry tank is a dry sky, and
    // that is a fact about the water.
    L.drops=[]; L.caught=0; L.need=6; L.t=0; L.rate=Math.max(90, 420-w.level*330);
    L.pan=W/2; },
  step(dt){ const w=W_(); L.t+=dt;
    if(L.t>L.rate){ L.t=0; L.drops.push({x:60+Math.random()*(W-120), y:-10, v:1.4+Math.random()*1.2}); }
    /* THE DRAW, in the shared verb: the pan follows a hand that is drawing a
       line across the sky. The verb owns "is the hand down and moving"; where
       the pan goes is the stage's. */
    if(draw().drawing) L.pan += (mouse.x-L.pan)*0.18;
    const fy=H-150;
    L.drops.forEach(d=>{ d.v+=0.05; d.y+=d.v; });
    L.drops=L.drops.filter(d=>{
      if(d.y>=fy){ if(Math.abs(d.x-L.pan)<70){ L.caught++; w.level=clamp01(w.level+0.012); }
                   return false; }
      return true; });
    if(L.caught>=L.need){ w.still=0; reading(2,"received"); save(); finish(); } },
  draw(){ sky(); const fy=H-150;
    g.strokeStyle="rgba(74,108,122,.75)"; g.lineWidth=2;
    L.drops.forEach(d=>{ g.beginPath(); g.moveTo(d.x,d.y); g.lineTo(d.x,d.y+9); g.stroke(); });
    ground(fy);
    // the catchment: a pan you slide under the sky. It never says it caught one.
