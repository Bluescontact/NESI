<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NESI</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0d1416}
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:default}

  /* ------------------------------------------------------------- THE PAGE
     THE WORLD HOLDS THE WRITING, AND THE FIRST PLACE IT HOLDS IT IS HERE.
     The page lies over the sky and is never cleared. What you have written
     stays on it; the watermark — everything the world has already taken —
     goes quiet behind what you are writing now, and nothing is removed.
     It sits in the sky band only, so the whole valley below stays workable
     with no mode to be in. Esc lays it aside; Esc brings it back.
     Two layers, one text: #pagebg PAINTS the words, #field carries the caret
     and the keystrokes. Their metrics must match exactly or the caret drifts
     off the letters — that is why every font property is repeated. */
  #sheet{position:fixed;overflow:hidden;transition:opacity .3s,transform .3s;
         border-radius:2px}
  #sheet.aside{opacity:0;transform:translateY(-14px);pointer-events:none}
  #pagebg,#field{position:absolute;inset:0;width:100%;height:100%;
         font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.62;
         padding:14px 18px;border:0;outline:0;resize:none;white-space:pre-wrap;
         word-wrap:break-word;overflow-y:auto;letter-spacing:.1px}
  #pagebg{background:rgba(247,244,236,.80);color:#2a2419;pointer-events:none}
  #pagebg .gone{color:#9a9382}   /* what the world has already taken */
  #field{background:transparent;color:transparent;caret-color:#2a2419}
  #field::selection{background:rgba(120,150,150,.30)}

  /* ---------------------------------------------------------- THE SOUNDING
     One settled sentence, brought back up out of the ground it went into,
     verbatim, because the hand asked for it. */
  #sound{position:fixed;max-width:340px;font-family:Georgia,'Times New Roman',serif;
         font-size:13.5px;line-height:1.6;color:#22201a;
         background:rgba(247,244,236,.94);padding:9px 12px;border-radius:2px;
         box-shadow:0 2px 14px rgba(0,0,0,.28);opacity:0;transition:opacity .28s;
         pointer-events:none}
  #sound.up{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sheet"><div id="pagebg"></div><textarea id="field" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea></div>
<div id="sound"></div>
<script>
"use strict";
/* ===========================================================================
   NESI — THE FUN SLICE
   One world, one camera. Rain from real writing · one dam · one basin ·
   one mirror aimed by hand · one shoot where light meets water · one stone
   sunk · something moving under the surface.

   SACRED, and enforced here rather than promised:
   - nothing reads, judges, or rewrites the words. The cut looks at punctuation
     and nothing else; the text is stored verbatim and never drawn.
   - no number, score, streak or tally reaches the player. There is no text
     drawn on this canvas at all.
   - quitting loses nothing. blank is a complete state.
   Sited, not invented: the band cut is carried character-for-character from
   nesi.html:342-358. The valley, the dam, the lake and the light law are the
   same world those stations stood in.
   =========================================================================== */

const W=1000, H=660;                      /* one camera, one logical frame */
const KEY="nesiworld";
const cv=document.getElementById("c"), g=cv.getContext("2d");
const field=document.getElementById("field");

/* ---------------------------------------------------------------- terrain */
/* THE VALLEY'S OWN PROFILE, in its own coordinates 0..566: a high catchment, a
   dam, a channel, a basin, and the lip it spills over. One shape, placed as many
   times as the world has unfolded. */
const VALLEY=[[0,268],[70,296],[140,326],[206,336],[232,338],[258,338],
              [292,392],[330,446],[372,484],[432,499],[500,499],[548,486],[566,452]];
const VW=566;
/* stage 0's lake, kept EXACTLY as it was built, so nothing four passes deep can
   regress: at M=0 every formula below reproduces the original terrain to the byte */
const LAKE0=[[566,452],[610,494],[664,532],[720,590],[800,636],[900,650],[1000,654]];
function lerpPts(P,x){
  if(x<=P[0][0])return P[0][1];
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];
    if(x<=b[0]){const t=(x-a[0])/(b[0]-a[0]);return a[1]+(b[1]-a[1])*t}}
  return P[P.length-1][1];
}
const valleyY=sx=>lerpPts(VALLEY,sx);
/* the second valley is not a mirror of the first — it is a bowl with a ridge at
   the world's edge, so it holds its own water table without needing a second dam */
function valleyBY(u){
  return lerpPts([[0,452],[.12,470],[.30,500],[.50,506],[.70,494],[.85,420],[1,300]],u);
}

/* ------------------------------------------------------------------ THE ASCENT
   Stage 0 is one valley beside the deep. THE BLOOM folds it and opens a second
   across the water, with its own water table and its own seat. `M` is the one
   parameter: 0 is the world as built, 1 is the world unfolded, and every value
   between is the motion itself — which is why the bloom needs no second
   geometry, only a number moving.
   NAMED AND NOT BUILT: stage 2 (the star, faces-lit) and stage 3 (all twelve
   seated, the equilibrium, the water going glass-clear once). The ascent's own
   4/8/12 is the ladder; this manifest builds the first rung of it. */
let M=0;
function bounds(m){return {aR:VW+(430-VW)*m, lR:W+(690-W)*m}}
function profileAt(m,x){
  const b=bounds(m);
  if(x<=b.aR)return valleyY(x*VW/b.aR);
  if(x<=b.lR){
    const u=(x-b.aR)/(b.lR-b.aR);
    const open=lerpPts(LAKE0,566+u*434);                 /* the lake as built */
    const bowl=452+205*Math.pow(Math.sin(Math.PI*u),0.6);/* a bowl between two valleys */
    return open+(bowl-open)*m;
  }
  return valleyBY((x-b.lR)/(W-b.lR));
}
function terrAt(x){return profileAt(M,x)}
/* one lookup, rebuilt when the ground changes — it is asked for thousands of
   times a frame */
const GY=new Float32Array(W+2);
function groundY(x){
  if(x<=0)return GY[0]; if(x>=W)return GY[W];
  const i=x|0, f=x-i; return GY[i]+(GY[i+1]-GY[i])*f;
}
const GATE_H=42;                                /* how far the sluice can rise */
const LIP=452;                                  /* the basin's own lip */
/* THE MEMBRANE — a screen standing just past the sluice, in the same dry
   stretch the water's own cut already runs through (x>DAM.x1&&x<344). Sited
   as an offset from DAM.x1 rather than a fixed x, so it moves correctly
   through the bloom's fold exactly as DAM itself does. */
const MEM_DX=54, MEM_W=30, MEM_H=96;
let MEM={x:0,y:0};
let DAM={}, LAKE_L=VW, BODIES={};
const BODYK=["res","basin","lake","basin2"];
/* the seats, at each end of the fold. the third slides in from the world's edge
   as the second valley opens — it is the unfold's own gift and cannot exist
   before there is ground for it to light. */
const SEAT0=[{x:596,y:298,len:56,aimAt:330},{x:150,y:206,len:50,aimAt:196}];
const SEAT1=[{x:421,y:300,len:52,aimAt:251},{x:114,y:214,len:48,aimAt:149},
             {x:820,y:300,len:52,aimAt:750}];
let SEATS=[];
/* every site the valley has is derived from where the valley currently stands */
function siteStage(m){
  const b=bounds(m), mx=(a,c)=>a+(c-a)*m;
  DAM={x0:232*b.aR/VW, x1:258*b.aR/VW, crest:248, base:338};
  LAKE_L=b.aR;
  MEM={x:DAM.x1+MEM_DX, y:DAM.base-MEM_H};
  /* the bodies are MUTATED, never replaced. a stage change that handed out fresh
     objects would silently orphan every reference already holding one — and the
     thing it holds is the area table, so the waterline would sit on a bed that
     no longer exists. */
  const R={res:[6,DAM.x0,252], basin:[DAM.x1,b.aR,LIP],
           lake:[b.aR,b.lR,-1], basin2:[b.lR,W-2,LIP]};
  for(const k of BODYK){
    if(!BODIES[k])BODIES[k]={};
    BODIES[k].x0=R[k][0]; BODIES[k].x1=R[k][1]; BODIES[k].spill=R[k][2];
  }
  SEATS=[0,1].map(i=>({x:mx(SEAT0[i].x,SEAT1[i].x), y:mx(SEAT0[i].y,SEAT1[i].y),
                       len:mx(SEAT0[i].len,SEAT1[i].len), aimAt:mx(SEAT0[i].aimAt,SEAT1[i].aimAt)}));
  if(m>0)SEATS.push({x:mx(W,SEAT1[2].x), y:SEAT1[2].y, len:SEAT1[2].len,
                     aimAt:mx(W,SEAT1[2].aimAt)});
}
/* THE MAP THAT CARRIES EVERYTHING THE HAND PLACED THROUGH THE FOLD. At m=0 it is
   the identity, which is what lets the motion start without anything jumping. */
function mapX(x,m){
  const b=bounds(m);
  return x<=VW ? x*b.aR/VW : b.aR+(x-VW)*(b.lR-b.aR)/(W-VW);
}
function invMapX(wx,m){
  const b=bounds(m);
  return wx<=b.aR ? wx*VW/b.aR : VW+(wx-b.aR)*(W-VW)/(b.lR-b.aR);
}
function buildArea(b){
  const a=new Float64Array(H+2);
  for(let y=0;y<=H;y++){
    let s=0;
    for(let x=b.x0;x<b.x1;x+=2){const d=groundY(x)-y; if(d>0)s+=d*2}
    a[y]=s;
  }
  b.area=a;
}
/* the ground as it stands right now: the profile at M, plus the silt the water
   has laid down. `light` skips the area tables, which is what makes the bloom
   affordable — during the motion nothing is simulated, only shown. */
function rebuildGY(){for(let x=0;x<=W+1;x++)GY[x]=terrAt(x)-siltAt(x)}
siteStage(0); for(let x=0;x<=W+1;x++)GY[x]=terrAt(x);
for(const k in BODIES)buildArea(BODIES[k]);
/* surface y for a volume — the only direction this ever runs. */
function surfaceOf(b,vol){
  if(vol<=0)return 1e9;
  const a=b.area;
  let lo=0,hi=H;
  while(lo<hi){const m=(lo+hi+1)>>1; if(a[m]>=vol)lo=m; else hi=m-1}
  if(lo>=H)return 1e9;
  const a0=a[lo], a1=a[lo+1]||0;
  const t=(a0-a1)>0?(a0-vol)/(a0-a1):0;
  return lo+Math.max(0,Math.min(1,t));
}
function volumeAt(b,y){const i=Math.max(0,Math.min(H,Math.round(y)));return b.area[i]}

/* ------------------------------------------------------------------ state */
const DEF={
  writing:{}, watermark:0,
  res:0, basin:0, lake:0,
  gate:0, mirror:null, aimed:false,
  wet:[], shoots:[], stones:[], sunk:0,
  creature:{x:840,y:598,tx:840,ty:598},
  /* M1 · THE DAY. the land remembers: `silt` is the bed's own deviation from
     the profile it was born with — positive where water stood and dropped its
     load, negative where the sluice cut. `hiNow`/`hiPast` are the highest each
     body has stood, this day and every day before it — a LEVEL, not a place,
     because a flood mark is a ring around a bowl and not a stain on one stone. */
  silt:[], hiNow:{}, hiPast:{}, lastDay:"",
  /* M2 · THE NIGHT. what you sink is not spent — it waits in `queue`, in the
     dark, carrying its own words verbatim and unread. `built` is what the deep
     has made of it while you were gone. */
  queue:[], built:[],
  /* M3 · THE GREEN. `mirrors`/`aimedM` are per-seat; `seated` is how many seats
     the valley has earned. A shoot carries `rooted` (asymptotic, never rendered
     as itself) and `lastFed` (the dayKey of the last day light stood on it). */
  mirrors:[], aimedM:[], seated:1,
  /* M4 · THE HEADWATER. `settled` is what the hand has put into the soil: each
     carries its verbatim sentence, the place it was set down, its written order
     `n`, and how many seams it has — a merge is the work, and a worked deposit
     draws the weather harder. The rain's distribution is derived from these and
     from nothing else. */
  settled:[], nn:0,
  /* M5 · THE BLOOM. `stage` is how far the world has unfolded; `everFruited` is
     the accumulation that earns the next unfold, and it is remembered even after
     a cast is pulled, because giving must not undo an ascent. */
  stage:0, everFruited:false, basin2:0
};
const NOMARK=1e9;
let S=DEF;
try{const raw=localStorage.getItem(KEY); if(raw){const p=JSON.parse(raw); if(p&&typeof p==="object")S=Object.assign({},DEF,p)}}catch(e){}
const WN=Math.ceil(W/4)+1;
const fitArr=(a,v)=>(Array.isArray(a)&&a.length===WN)?a:new Array(WN).fill(v);
S.wet=fitArr(S.wet,0); S.silt=fitArr(S.silt,0);
for(const k of BODYK){
  if(typeof S.hiNow[k]!=="number")S.hiNow[k]=NOMARK;
  if(typeof S.hiPast[k]!=="number")S.hiPast[k]=NOMARK;
}
if(typeof S.stage!=="number")S.stage=0;
if(typeof S.basin2!=="number")S.basin2=0;
if(typeof S.everFruited!=="boolean")S.everFruited=false;
M=S.stage;
if(!S.creature)S.creature={x:840,y:598,tx:840,ty:598};
if(!Array.isArray(S.queue))S.queue=[];
if(!Array.isArray(S.built))S.built=[];
/* M6 · WIRE — WHAT THE DEEP BUILT STANDS IN THE LIGHT'S WAY.
   A structure is a solid thing at the shoreline, so it shadows what is behind it.
   Kept as a per-column top/bottom rather than tested block by block, because
   aiming a mirror sweeps three thousand rays and the honest version has to be
   affordable. Columns are contiguous by construction — each block sits on the
   last — so the span is exact rather than an approximation. */
const BTOP=new Float32Array(WN), BBOT=new Float32Array(WN);
function rebuildBlocks(){
  BTOP.fill(1e9); BBOT.fill(-1e9);
  for(const b of S.built){
    const i0=Math.max(0,Math.floor((b.x-b.w/2)/4)), i1=Math.min(WN-1,Math.ceil((b.x+b.w/2)/4));
    for(let i=i0;i<=i1;i++){
      if(b.y<BTOP[i])BTOP[i]=b.y;
      if(b.y+b.h>BBOT[i])BBOT[i]=b.y+b.h;
    }
  }
}
/* one mirror becomes many, and a save from before M3 keeps its aim */
if(!Array.isArray(S.settled))S.settled=[];
if(typeof S.nn!=="number")S.nn=0;
if(!Array.isArray(S.mirrors))S.mirrors=[];
if(!Array.isArray(S.aimedM))S.aimedM=[];
if(typeof S.mirror==="number"&&typeof S.mirrors[0]!=="number"){S.mirrors[0]=S.mirror;S.aimedM[0]=!!S.aimed}
for(let i=0;i<3;i++){
  if(typeof S.mirrors[i]!=="number")S.mirrors[i]=0;
  if(typeof S.aimedM[i]!=="boolean")S.aimedM[i]=false;
}
if(typeof S.seated!=="number")S.seated=1;
/* a shoot grown under the old rule keeps what it had, read as rooting */
for(const s of S.shoots){
  if(typeof s.rooted!=="number")s.rooted=Math.max(0,Math.min(1,s.g||0));
  if(typeof s.lastFed!=="string")s.lastFed="";
}

function dayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysBetween(a,b){
  const p=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);return m?Date.UTC(+m[1],+m[2]-1,+m[3]):NaN};
  const d=(p(b)-p(a))/86400000;
  return isFinite(d)?Math.max(0,Math.round(d)):0;
}

/* THE DAY BOUNDARY. crossing it moves this day's marks into the past, where
   they render fainter. nothing announces it; the land is simply older.
   NO ABSENCE IS SIMULATED FOR THE WATER — crossing advances no flow, no level,
   no silt. Law 8 stands for the valley. What crossing DOES advance is the deep,
   and that is not an exception smuggled in: "absence is productive by design"
   is one of the four sacred lines, and it is about exactly this. */
const NIGHTS=(S.lastDay&&S.lastDay!==dayKey())?Math.min(12,daysBetween(S.lastDay,dayKey())||1):0;
if(NIGHTS>0){
  for(const k of BODYK){
    S.hiPast[k]=Math.min(S.hiPast[k],S.hiNow[k]);
    S.hiNow[k]=NOMARK;
  }
}
S.lastDay=dayKey();

/* THE GROUND IS NO LONGER A CONSTANT. `GY` and every body's area table were
   baked once from the birth profile; silt makes them derived state. Rebuilding
   is the whole of the cost — a stale area table would not throw, it would put
   the waterline on the wrong ground, which is the quietest way to be wrong. */
function siltAt(x){
  const fx=Math.max(0,Math.min(WN-1.001,x/4)), i=fx|0, t=fx-i;
  return S.silt[i]*(1-t)+S.silt[Math.min(WN-1,i+1)]*t;
}
function rebuildGround(){
  /* MINUS, and the sign is the whole of it: y grows downward, so a bed that has
     been silted stands HIGHER on the screen and holds LESS. Adding here would
     dig the basin out every time water stood in it — the exact silent wrong a
     stale area table gives you, arrived at from the other direction. */
  siteStage(M); rebuildGY();
  for(const k in BODIES)buildArea(BODIES[k]);
}
rebuildGround();
/* the lake is older than the player. it is here on the first open. */
if(!S.lake)S.lake=volumeAt(BODIES.lake,540);

/* ------------------------------------------------------------------ THE NIGHT
   The deep works only while you are away. ONE BLOCK PER NIGHT rises from what
   you sank, set at the shoreline nearest where it went in — so what stands
   there is traceable by COUNT and by PLACE and never by a word. The words ride
   along inside it, verbatim and unread, because nothing here is spent.
   A week away is a bigger reveal, never a penalty: nights are the multiplier
   and an empty queue simply means nothing rose. Blocks stack on each other's
   shoulders, so sinking into one place builds a stair and sinking all along the
   shore builds a reef — the shape is your hand's doing, not a chosen form. */
function theNight(nights){
  if(nights<=0||!S.queue.length)return;
  let n=Math.min(nights,S.queue.length);
  while(n-->0){
    const q=S.queue.shift();
    const sd=Math.abs(Math.floor((q.seed||0)*1000));
    const x=Math.max(690,Math.min(944,q.x||820));
    let base=groundY(x), col=null;
    for(const b of S.built){ if(Math.abs(b.x-x)<30&&b.y<base){ base=b.y; col=b } }
    const h=13+sd%7;
    S.built.push({x:col?col.x:x, y:base-h, w:24+sd%15, h:h, seed:sd%997, text:q.text});
  }
}
theNight(NIGHTS);
rebuildBlocks();

/* ------------------------------------------------------------------ THE BLOOM
   ALL-OR-NOTHING, per Fuller's invariant: the world does not half-unfold. It
   fires at a day boundary once the valley has actually carried fruit — an
   accumulation no single day can reach, so the trigger is LIVED and there is no
   button anywhere that produces it. Nothing announces it: you open the world and
   the world opens.
   While it moves, NOTHING IS SIMULATED — no water flows, no light feeds, no
   stone falls. The motion is the whole of it, and it takes everything the hand
   ever placed with it through one map. */
let bloom=null;
const BLOOM_T=3.4;
function snapshot(){
  return {settled:S.settled.map(d=>d.x), shoots:S.shoots.map(s=>s.x),
          stones:S.stones.map(s=>s.x), built:S.built.map(b=>b.x),
          creature:S.creature.x};
}
function carry(m){
  const sn=bloom.snap;
  S.settled.forEach((d,i)=>{d.x=mapX(sn.settled[i],m);d.y=groundY(d.x)});
  S.shoots.forEach((s,i)=>{s.x=mapX(sn.shoots[i],m);s.y=groundY(s.x)});
  S.stones.forEach((s,i)=>{s.x=mapX(sn.stones[i],m);s.y=groundY(s.x)-s.r*0.6});
  S.built.forEach((b,i)=>{b.x=mapX(sn.built[i],m);b.y=Math.min(b.y,groundY(b.x)-b.h)});
  S.creature.x=mapX(sn.creature,m);
}
/* resample a per-cell array through the fold — cells that land on ground the
   world did not have before start empty, because nothing has happened there */
function refold(arr,fill){
  const out=new Array(WN).fill(fill), b=bounds(1);
  for(let i=0;i<WN;i++){
    const wx=i*4;
    if(wx>b.lR)continue;
    const src=invMapX(wx,1)/4, j=Math.max(0,Math.min(WN-1,Math.round(src)));
    out[i]=arr[j];
  }
  return out;
}
function commitBloom(){
  S.silt=refold(S.silt,0); S.wet=refold(S.wet,0);
  S.stage=1; M=1; siteStage(1); rebuildGround(); rebuildWeather();
  S.settled.forEach(d=>d.y=groundY(d.x));
  S.shoots.forEach(s=>s.y=groundY(s.x));
  S.stones.forEach(s=>{s.y=groundY(s.x)-s.r*0.6;s.vy=0});
  /* the deep's work is re-seated on the bed it now stands on, keeping its
     columns — a stair that was a stair is still a stair */
  const blocks=S.built.slice().sort((p,q)=>p.x-q.x); S.built.length=0;
  for(const bl of blocks){
    let base=groundY(bl.x), col=null;
    for(const o of S.built)if(Math.abs(o.x-bl.x)<30&&o.y<base){base=o.y;col=o}
    bl.x=col?col.x:bl.x; bl.y=base-bl.h; S.built.push(bl);
  }
  rebuildBlocks();          /* the light must know where they stand now */
  S.creature.x=Math.max(BODIES.lake.x0+30,Math.min(BODIES.lake.x1-30,S.creature.x));
  S.creature.y=Math.min(groundY(S.creature.x)-20,540+40);
  S.creature.tx=S.creature.x; S.creature.ty=S.creature.y;
  S.seated=Math.max(S.seated,SEATS.length);
  /* a seat the unfold has just created has, BY DEFINITION, never been aimed by a
     hand — so its aimed flag is cleared rather than trusted. Without this a stray
     flag from anywhere could leave a brand-new mirror pointing at nothing, and
     the world would open with a seat that does nothing and says nothing. */
  for(let i=SEAT0.length;i<SEATS.length;i++)S.aimedM[i]=false;
  for(let i=0;i<SEATS.length;i++)if(!S.aimedM[i])S.mirrors[i]=autoAim(i);
  bloom=null;
}
if(NIGHTS>0&&S.stage===0&&S.everFruited)bloom={t:0,snap:snapshot()};

/* --------------------------------------------------------------- THE STILLING
   Carried from nesi.html's sixth pass (2026-08-11) and sited here at the scale
   of a whole valley. `lastStir` is NEVER PERSISTED — that is the free half of
   the mechanic: re-entry always opens on still water and the first keystroke
   moves it. The day starts when the hand does, and nothing says so. */
let lastStir=-1e9, running=false, frameQueued=false;
function calm(){return Math.exp(-(performance.now()-lastStir)/22000)}
function stir(){
  lastStir=performance.now();
  if(!running&&!frameQueued){frameQueued=true;last=performance.now();requestAnimationFrame(frame)}
}
/* ---------------------------------------------------------- THE ONLY WAY IN
   EVERY CHARACTER THAT REACHES THE SCREEN COMES THROUGH HERE — and `own` TAKES
   NO STRING. It takes a reference into the store and resolves the text itself,
   so a caller cannot hand it a label, a count, or a sentence the machine wrote,
   because a caller cannot hand it text at all.
   The silence law says the only text on screen is the player's own. The old
   build satisfied that by being unable to draw a character, which satisfied it
   vacuously and cost the writing its way home. This is the same law made
   structural instead: not "no text", but "no text that is not his". */
const sheetEl=document.getElementById("sheet");
const pagebg=document.getElementById("pagebg");
const soundEl=document.getElementById("sound");
function own(el,src){
  while(el.firstChild)el.removeChild(el.firstChild);
  if(src.k==="page"){
    const v=S.writing[dayKey()]||"";
    const w=Math.max(0,Math.min(S.watermark|0,v.length));
    const gone=document.createElement("span");
    gone.className="gone";                       /* what the world already took */
    gone.appendChild(document.createTextNode(v.slice(0,w)));
    el.appendChild(gone);
    el.appendChild(document.createTextNode(v.slice(w)));
    return true;
  }
  if(src.k==="settled"){
    const d=S.settled[src.i];
    if(!d||!d.text)return false;                 /* finds nothing, shows nothing */
    el.appendChild(document.createTextNode(d.text));
    return true;
  }
  return false;
}
function paintPage(){own(pagebg,{k:"page"})}

field.value=S.writing[dayKey()]||"";
if(S.watermark>field.value.length)S.watermark=field.value.length;
paintPage();                 /* you open on what you wrote, not on a blank pane */
field.addEventListener("scroll",()=>{pagebg.scrollTop=field.scrollTop});

/* pad → read back → commit. a bad write never destroys a good file. silently. */
function save(){
  S.writing[dayKey()]=field.value;
  try{const j=JSON.stringify(S);
    localStorage.setItem(KEY+".pad",j);
    if(localStorage.getItem(KEY+".pad")===j){localStorage.setItem(KEY,j);localStorage.removeItem(KEY+".pad")}
  }catch(e){}
}
setInterval(save,2000);
addEventListener("beforeunload",save); addEventListener("blur",save);

/* --------------------------------------------------------------- the band */
/* THE BAND CUT — carried whole from nesi.html:342-358. A .!?… completes a
   sentence and the trailing cluster leaves with it; a period between two
   digits is inside a number; bare punctuation is not a sentence. The page is
   never cleared and deletion never un-banks. Nothing here looks at meaning. */
let pending=0;
function bandCut(){
  stir();                      /* the writing hand moves the water */
  S.writing[dayKey()]=field.value;   /* the page is the store's, not the box's */
  const v=field.value;
  if(S.watermark>v.length)S.watermark=v.length;
  const isEnd=c=>".!?…".indexOf(c)>=0;
  let i=S.watermark, start=S.watermark;
  while(i<v.length){
    if(isEnd(v[i])){
      if(v[i]==="."&&/\d/.test(v[i-1]||"")&&/\d/.test(v[i+1]||"")){i++;continue}
      let j=i;while(j+1<v.length&&isEnd(v[j+1]))j++;
      const seg=v.slice(start,j+1).trim();
      if(seg.length>1&&/[A-Za-z0-9]/.test(seg))arrive(seg);
      start=j+1;S.watermark=j+1;i=j+1;
    } else i++;
  }
  pending=Math.max(0,v.length-S.watermark);
  paintPage();
  pagebg.scrollTop=field.scrollTop;
}
field.addEventListener("input",bandCut);
field.addEventListener("keydown",e=>{
  if(e.key==="Escape"){e.preventDefault();sheetEl.classList.toggle("aside");return}
  if(e.key==="Enter"){
    /* THE NEWLINE LANDS. Enter banks what is held, as it always did — but it is
       no longer swallowed, because the page is visible now and a record with no
       line breaks is not a record. Bank after the break has gone in. */
    stir();
    const seg=field.value.slice(S.watermark).trim();
    setTimeout(()=>{
      if(seg.length>1&&/[A-Za-z0-9]/.test(seg))arrive(seg);
      S.watermark=field.value.length;
      S.writing[dayKey()]=field.value;
      pending=0; paintPage(); pagebg.scrollTop=field.scrollTop;
    },0);
  }
});
addEventListener("keydown",e=>{
  if(e.key==="Escape"&&document.activeElement!==field){
    e.preventDefault(); sheetEl.classList.toggle("aside");
  }
});
/* the keyboard always has somewhere to go; the pointer belongs to the world. */
function keepFocus(){if(document.activeElement!==field)field.focus({preventScroll:true})}
addEventListener("pointerdown",()=>setTimeout(keepFocus,0));
setInterval(keepFocus,600); keepFocus();

/* ---------------------------------------------------------------- arrival */
/* a sentence completes: the cloud discharges over the catchment and a stone
   comes to the shore. the world never learns what was written. */
const drops=[], splashes=[], spray=[], bubbles=[];
let rainQueue=0, rainT=0, flash=0;
function arrive(text){
  rainQueue+=110; flash=1;
  const x=618+Math.random()*46, y=groundY(x)-4;
  S.nn++;
  S.stones.push({x,y,r:6+Math.random()*3,text,n:S.nn,vy:0,held:false,sinking:0,seed:Math.random()*99});
  if(S.stones.length>26)S.stones.splice(0,S.stones.length-26);
}

/* ------------------------------------------------------------------ water */
let resY=1e9, basinY=1e9, lakeY=540, basin2Y=1e9, spillT=0, jetT=0;
/* WHICH WATER A PLACE BELONGS TO — one answer, so that nothing in the world can
   disagree with itself about where a shore is. Every branch that used to carry
   its own copy of the lake's left edge now asks here instead, which is why the
   valley can move at all. */
function bodyAt(x){
  if(x<DAM.x0)return "res";
  if(x>DAM.x1&&x<LAKE_L)return "basin";
  if(x>=LAKE_L&&x<BODIES.lake.x1)return "lake";
  if(x>=BODIES.basin2.x0&&x<W)return "basin2";
  return null;
}
function surfOf(k){
  return k==="res"?resY:k==="basin"?basinY:k==="lake"?lakeY:k==="basin2"?basin2Y:1e9;
}
/* the bed changes continuously and is committed on a slow tick — rebuilding the
   area tables every frame would be honest and wasteful in equal measure. */
let siltT=0, siltDirty=false;
const SILT_CAP=16, CUT_CAP=14;
/* SEDIMENT ARRIVES WITH WATER — it is not a property of water being present.
   `load` is what each body is currently carrying: raised by rain landing, by
   the sluice's flow, by the spill over the lip; it settles out in a few
   seconds. Without this a standing lake buries itself for as long as the page
   is open, and the land would drift with no hand on it — which is the opposite
   of the land being the save file. Never persisted: what is in suspension when
   you close is not simulated while you are gone. */
const load={res:0,basin:0,lake:0};
function waters(dt){
  if(siltDirty){siltT+=dt; if(siltT>2.5){siltT=0;siltDirty=false;rebuildGround()}}
  /* the sluice: head over the opening, and the opening is the hand's */
  const openY=DAM.base-GATE_H*S.gate;
  resY=surfaceOf(BODIES.res,S.res);
  const head=Math.max(0,DAM.base-Math.max(resY,openY));
  let flow=0;
  if(S.gate>0.02&&S.res>0&&resY<DAM.base){
    flow=300*S.gate*Math.sqrt(head+0.01)*dt;   /* it pours; it does not empty */
  }
  /* over the crest, when the reservoir has more than the wall */
  if(resY<DAM.crest){ flow+=9000*(DAM.crest-resY)*dt; spillT=1 } else spillT=Math.max(0,spillT-dt*2);
  flow=Math.min(flow,S.res);
  if(flow>0){S.res-=flow;S.basin+=flow;jetT=1;load.basin+=flow*0.00022} else jetT=Math.max(0,jetT-dt*3);

  /* the basin gives its excess to the lake over the lip */
  basinY=surfaceOf(BODIES.basin,S.basin);
  const cap=volumeAt(BODIES.basin,LIP);
  if(S.basin>cap){const ex=Math.min(S.basin-cap,26000*dt+ (S.basin-cap)*0.9*dt);S.basin-=ex;S.lake+=ex;load.lake+=ex*0.00022}
  basinY=surfaceOf(BODIES.basin,S.basin);
  /* the second valley holds its own water table and gives its excess to the deep
     the same way — over its own lip, with no wall in between */
  basin2Y=surfaceOf(BODIES.basin2,S.basin2);
  const cap2=volumeAt(BODIES.basin2,LIP);
  if(S.basin2>cap2){const ex=Math.min(S.basin2-cap2,26000*dt+(S.basin2-cap2)*0.9*dt);
    S.basin2-=ex;S.lake+=ex;load.lake+=ex*0.00022}
  basin2Y=surfaceOf(BODIES.basin2,S.basin2);
  lakeY=surfaceOf(BODIES.lake,S.lake);

  /* THE LAND IS THE SAVE FILE.
     Where water STANDS it drops what it carries and the bed rises; where it
     RUNS it takes the bed with it and the channel deepens. Both are capped, so
     a valley can be shaped but never erased. And the highest the water reaches
     is remembered as a mark on the ground — that is what makes an open show
     yesterday's valley rather than only today's water. */
  const cal=calm();
  /* what is carried settles out — and settles ALL THE WAY. an exponential that
     only approaches zero would re-dirty the bed every frame forever, and the
     valley could never finish going still. it reaches nothing, and stops. */
  const set=Math.exp(-dt*0.30);
  for(const k in load){load[k]*=set; if(load[k]<0.0015)load[k]=0}
  for(const k of BODYK)if(surfOf(k)<S.hiNow[k])S.hiNow[k]=surfOf(k);  /* flood marks — a level */
  for(let i=0;i<WN;i++){
    const x=i*4, gy=groundY(x);
    const bk=bodyAt(x), sfy=bk?surfOf(bk):NOMARK;
    let w=0, sy=NOMARK;
    if(bk&&gy>sfy){w=1;sy=sfy}
    if(w===1){
      /* standing water drops what it CARRIES — stiller settles faster, which is
         why a held pool silts and a torrent carries straight through */
      const k=bk;
      const dep=dt*1.9*load[k]*(0.3+0.7*cal)*Math.min(1,(gy-sy)/40);
      if(dep>1e-5&&S.silt[i]<SILT_CAP){S.silt[i]=Math.min(SILT_CAP,S.silt[i]+dep);siltDirty=true}
    }
    /* the cut: the sluice's own water takes the channel down with it */
    if(jetT>0.05&&x>DAM.x1&&x<344&&S.gate>0.02){
      const cut=dt*0.30*S.gate;
      if(S.silt[i]>-CUT_CAP){S.silt[i]=Math.max(-CUT_CAP,S.silt[i]-cut);siltDirty=true}
    }
    if(w<1){ /* seepage: the ground drinks a hand's width past the waterline,
                which is what makes a shore a place and not a line */
      for(let d=1;d<=10;d++){
        const j1=i-d, j2=i+d;
        const near=(k)=>{const xx=k*4,gg=groundY(xx),b2=bodyAt(xx);
          return !!b2&&gg>surfOf(b2)};
        if((j1>=0&&near(j1))||(j2<WN&&near(j2))){w=Math.max(w,0.95-d*0.06);break}
      }
    }
    S.wet[i]=Math.max(w,S.wet[i]-dt*0.012);
  }
}
/* MEMBRANE'S OWN STEP — mHeld is the visual ramp ONLY, exactly as seam.js's
   own sillMechanic continuously animates its plate's height while held.
   THE WRITE ITSELF IS NOT HERE. Ascent.html's own membrane is explicit that
   HOLD's law is "the act is the release, not the hold itself" — its effect
   fires once, in `letting_go`, sized by how much crossed while it was down.
   An earlier pass of this station mutated load/silt every frame it was
   held, which is HOLD wearing DRAW's clothes; caught on its own gesture
   pass and moved to release() below, where a HOLD's effect belongs. */
function membraneStep(dt){
  mHeld = mHold ? Math.min(1,mHeld+dt*0.7) : Math.max(0,mHeld-dt*1.6);
}
function wetAt(x){const i=Math.max(0,Math.min(WN-1,Math.round(x/4)));return S.wet[i]}
function waterYAt(x){const b=bodyAt(x);return b?surfOf(b):1e9}

/* ------------------------------------------------ THE HAND SHAPES THE WEATHER
   The rain's own distribution is derived from where sentences have been settled
   in the soil and from how hard they have been worked — and from nothing else.
   With nothing settled the valley keeps the weather it was born with, the high
   catchment falling away eastward, so an untouched world behaves exactly as it
   always did. Settle into the basin and the cloud comes to the basin: the work
   upstream is the weather downstream, and it is read off the sky, never off a
   word. */
const RAINW=new Float64Array(WN);
let rainCDF=new Float64Array(WN), rainMean=170;
function rebuildWeather(){
  for(let i=0;i<WN;i++){
    const x=i*4;
    /* the birth weather — the same shape the fun slice fell in */
    RAINW[i]=x<360?Math.max(0.02,-Math.log(Math.max(x,14)/360)):0.02;
  }
  for(const d of S.settled){
    const c=d.x/4, amp=1.15*(1+(d.seams||0));
    for(let i=0;i<WN;i++){
      const dx=(i-c)/13;
      if(dx>-5&&dx<5)RAINW[i]+=amp*Math.exp(-dx*dx);
    }
  }
  let tot=0, m=0;
  for(let i=0;i<WN;i++){tot+=RAINW[i];rainCDF[i]=tot;m+=i*4*RAINW[i]}
  for(let i=0;i<WN;i++)rainCDF[i]/=tot;
  rainMean=tot>0?m/tot:170;
}
function rainX(){
  const u=Math.random();
  let lo=0,hi=WN-1;
  while(lo<hi){const mid=(lo+hi)>>1; if(rainCDF[mid]<u)lo=mid+1; else hi=mid}
  return lo*4+Math.random()*4;
}
rebuildWeather();

/* --------------------------------------------------------------- the rain */
function rain(dt){
  rainT+=dt;
  while(rainQueue>0&&rainT>0.018){
    rainT-=0.018; rainQueue--;
    const x=rainX();
    drops.push({x,y:-10-Math.random()*90,v:340+Math.random()*220,l:8+Math.random()*12});
  }
  for(let i=drops.length-1;i>=0;i--){
    const d=drops[i]; d.v+=560*dt; d.y+=d.v*dt;
    const wy=waterYAt(d.x), gy=groundY(d.x), hit=Math.min(wy,gy);
    if(d.y>=hit){
      splashes.push({x:d.x,y:hit,t:0,onWater:wy<gy});
      /* the drop becomes volume in whatever holds it */
      const bk=bodyAt(d.x)||"lake";
      if(bk==="res")S.res+=34; else if(bk==="basin")S.basin+=34;
      else if(bk==="basin2")S.basin2+=34; else S.lake+=34;
      load[bk]+=0.010;                 /* rain arrives carrying the hillside */
      const i4=Math.max(0,Math.min(WN-1,Math.round(d.x/4)));
      S.wet[i4]=Math.min(1,S.wet[i4]+0.5);
      drops.splice(i,1);
    }
  }
  for(let i=splashes.length-1;i>=0;i--){const s=splashes[i];s.t+=dt*3.2;if(s.t>1)splashes.splice(i,1)}
  /* the jet from the sluice, and the spill over the crest */
  if(jetT>0.05){
    for(let k=0;k<3;k++){
      const oy=DAM.base-GATE_H*S.gate*Math.random();
      spray.push({x:DAM.x1,y:oy,vx:70+Math.random()*130*S.gate,vy:-20+Math.random()*60,t:0});
    }
  }
  if(spillT>0.05){for(let k=0;k<2;k++)spray.push({x:DAM.x0+Math.random()*26,y:DAM.crest,vx:40+Math.random()*70,vy:0,t:0})}
  for(let i=spray.length-1;i>=0;i--){
    const p=spray[i];p.t+=dt;p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.t>1.6||p.y>groundY(p.x)||p.y>waterYAt(p.x))spray.splice(i,1);
  }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.y-=b.v*dt;b.x+=Math.sin(b.y*0.06+b.s)*8*dt;
    if(b.y<lakeY+2)bubbles.splice(i,1);
  }
}

/* -------------------------------------------------------------- the light */
/* the sun stands on the far side of the mirror from the valley, so the bounce
   is a bounce and not a pass-through — a mirror aimed almost along its own
   light is a mirror you cannot see working. */
const SUN={x:250,y:62};
/* TWO SEATS — and the second is not a spare of the first, it is the answer to a
   wall. The dam's crest stands at y=248 and the first mirror sits at y=298,
   BELOW it, so every leftward ray it can throw meets the wall at any angle.
   The reservoir's own shore is therefore a dark pool the first mirror cannot
   reach, and the second seat stands on the high ridge above it. Each mirror
   owns ground the other cannot light. That is the puzzle, and it fell out of
   the geometry rather than being arranged. */
function reflect(a,st){
  const dx=st.x-SUN.x, dy=st.y-SUN.y, m=Math.hypot(dx,dy);
  const d={x:dx/m,y:dy/m};
  const n={x:-Math.sin(a),y:Math.cos(a)};
  const dot=d.x*n.x+d.y*n.y;
  return {x:d.x-2*dot*n.x, y:d.y-2*dot*n.y};
}
/* march until the ray meets a surface — the wall, then water, then ground.
   the dam is a real obstacle: light you cannot get past is the puzzle. */
function cast(a,si){
  const st=SEATS[si||0], r=reflect(a,st);
  let x=st.x, y=st.y;
  for(let i=0;i<1400;i++){
    x+=r.x*1.6; y+=r.y*1.6;
    if(x<0||x>W||y>H||y<-40)return {x,y,hit:null};
    if(x>DAM.x0&&x<DAM.x1&&y>DAM.crest&&y<DAM.base)return {x,y,hit:"wall"};
    const bi=x/4|0;
    if(bi>=0&&bi<WN&&y>=BTOP[bi]&&y<=BBOT[bi])return {x,y,hit:"wall"};
    const wy=waterYAt(x), gy=groundY(x);
    if(y>=wy&&wy<gy)return {x,y:wy,hit:"water"};
    if(y>=gy)return {x,y:gy,hit:"ground"};
  }
  return {x,y,hit:null};
}
/* A MIRROR COMES AIMED ALMOST RIGHT — computed, never hardcoded. The first is
   already on the basin's dry shore; nothing grows there until the hand opens
   the dam and the ground goes wet under a beam that was always standing on it.
   Re-derived on EVERY open until a hand actually takes that mirror, so an
   untouched mirror can never come back wrong — `aimedM` is set by the drag,
   never by the existence of an angle. */
function autoAim(si){
  let best=0,bd=1e9;
  for(let a=-Math.PI;a<Math.PI;a+=0.004){
    const h=cast(a,si);
    if(h.hit!=="ground")continue;
    const d=Math.abs(h.x-SEATS[si].aimAt);
    if(d<bd){bd=d;best=a}
  }
  return best;
}
for(let i=0;i<SEATS.length;i++)if(!S.aimedM[i])S.mirrors[i]=autoAim(i);

let beams=SEATS.map((_,i)=>cast(S.mirrors[i],i)), dwell=[0,0], motes=[];

/* ------------------------------------------------------------ THE OVERWINTERING
   Carried in its grammar from nesi.html's seventh pass, per M3's own siting:
   a stand roots only on a day LATER than the last day it was fed. Nothing a
   single day contains can produce it, and there is no threshold to aim at —
   the step is asymptotic and never completes.
   Feeding is idempotent within a day ON PURPOSE: hold the beam on it from dawn
   to dusk and it roots exactly as much as touching it once. Volume is not a
   substitute for return, and there is no way to spend more and get more. */
function feed(s){
  const d=dayKey();
  if(s.lastFed&&s.lastFed!==d)s.rooted=Math.min(1,s.rooted+(1-s.rooted)*0.22);
  s.lastFed=d;
}
/* what a stand LOOKS like is its rooting, not its hours under a lamp. the first
   day's sprout is small and stays small; standing is made of returns. */
function standing(s){return 0.16+0.84*(s.rooted||0)}
function shootShape(s){
  const gg=standing(s);
  return {gg:gg, h:8+gg*46, sway:Math.sin(t*1.1+s.s)*0.10*gg,
          fr:3.4+Math.max(0,(s.rooted||0)-0.72)*13};
}
/* where the ripe cast actually hangs, in the world, sway and all — the hand has
   to be able to find it, so this is the same arithmetic the painter uses */
function fruitAt(s){
  if(!(s.rooted>0.72))return null;
  const q=shootShape(s), ly=-q.h*0.80+3+q.fr*0.7, lx=6;
  const cs=Math.cos(q.sway), sn=Math.sin(q.sway);
  return {x:s.x+lx*cs-ly*sn, y:s.y+lx*sn+ly*cs, r:q.fr};
}
/* ------------------------------------------------------------------ THE CAST
   The one thing that leaves the world, and it leaves by hand. It carries SHAPE
   and never a word: the stand's own silhouette and the ground it grew out of.
   There is no parameter here that could reach a sentence — the only inputs are
   a rooting, a place, and the terrain, and that is what makes the refusal
   structural rather than promised. */
function castSVG(s){
  const q=shootShape(s), h=q.h, gg=q.gg;
  let leaves="";
  for(let k=0;k<3;k++){
    const lp=0.35+k*0.24; if(gg<lp-0.2)continue;
    const ly=-h*lp, sd=k%2?1:-1, sz=(6+gg*13)*Math.min(1,(gg-(lp-0.2))*4);
    leaves+='<path d="M0,'+ly.toFixed(1)+' Q'+(sd*sz*0.8).toFixed(1)+','+(ly-sz*0.55).toFixed(1)
      +' '+(sd*sz).toFixed(1)+','+(ly-sz*0.1).toFixed(1)
      +' Q'+(sd*sz*0.55).toFixed(1)+','+(ly+sz*0.3).toFixed(1)+' 0,'+ly.toFixed(1)+'Z" fill="#6f9a52"/>';
  }
  let ground="M-60,"+(groundY(s.x-60)-groundY(s.x)).toFixed(1);
  for(let x=-54;x<=60;x+=6)ground+=" L"+x+","+(groundY(s.x+x)-groundY(s.x)).toFixed(1);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-70 '+(-h-24).toFixed(0)
    +' 140 '+(h+48).toFixed(0)+'">'
    +'<path d="'+ground+'" fill="none" stroke="#6f6650" stroke-width="2"/>'
    +'<path d="M0,0 Q2,'+(-h*0.55).toFixed(1)+' 0,'+(-h).toFixed(1)
    +'" fill="none" stroke="#5f8a46" stroke-width="'+(1.8+gg*1.6).toFixed(1)+'" stroke-linecap="round"/>'
    +leaves
    +'<circle cx="6" cy="'+(-h*0.80+3+q.fr*0.7).toFixed(1)+'" r="'+q.fr.toFixed(1)+'" fill="#9c5a34"/>'
    +'</svg>';
}
function pullCast(s){
  const svg=castSVG(s);
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
    a.download="cast.svg"; a.click();
  }catch(e){}
  /* the stand spends what it grew. it can hang another, across further
     returns, and nothing says so. */
  s.rooted=Math.max(0,s.rooted-0.18);
  /* M6 · WIRE — THE GAP THE PULL LEAVES GOES TO THE DEEP.
     What the stand gave up does not evaporate: it goes down with everything else
     you have released, and the deep builds with it on a later day. It carries no
     word, because a cast never had one — the deep receives the GIVING, not a
     sentence. Nothing you release is wasted. */
  S.queue.push({text:"",x:s.x,seed:(s.s||0)/9});
}

function light(dt){
  for(let i=0;i<SEATS.length;i++)beams[i]=cast(S.mirrors[i],i);
  for(let i=0;i<S.seated;i++){
    const b=beams[i];
    if(b.hit==="ground"&&wetAt(b.x)>0.3){
      dwell[i]+=dt;
      let near=null;
      for(const s of S.shoots)if(Math.abs(s.x-b.x)<26)near=s;
      /* dwell is the SEEDING clock and nothing else. left running once a shoot
         stands there it never returns to zero, and a valley with one grown
         shoot under the beam could never finish going still. */
      if(near){near.lit=1;feed(near);dwell[i]=0}
      else if(dwell[i]>1.1){
        S.shoots.push({x:b.x,y:b.y,rooted:0,lastFed:dayKey(),s:Math.random()*9,lit:1});
        dwell[i]=0;
      }
    } else dwell[i]=Math.max(0,dwell[i]-dt*0.6);
  }
  /* THE SECOND SEAT IS EARNED BY A RETURN, not by a count and not by a clock.
     It stands there the moment anything in the valley has actually rooted —
     which cannot happen inside a single day. Nothing announces it. */
  if(S.seated<SEATS.length&&S.shoots.some(s=>s.rooted>0.0001))S.seated=SEATS.length;
  /* the accumulation that earns the next unfold. remembered even after the cast
     is pulled: giving must not undo an ascent. */
  if(!S.everFruited&&S.shoots.some(s=>s.rooted>0.72))S.everFruited=true;
  for(const s of S.shoots){ if(s.lit===undefined)s.lit=0; s.lit=Math.max(0,s.lit-dt*1.4) }
  if(Math.random()<dt*26){
    const i=Math.floor(Math.random()*S.seated);
    motes.push({x:SEATS[i].x,y:SEATS[i].y,t:0,o:Math.random(),i:i});
  }
  for(let k=motes.length-1;k>=0;k--){
    const m=motes[k], st=SEATS[m.i], r=reflect(S.mirrors[m.i],st); m.t+=dt;
    m.x=st.x+r.x*(m.t*160)+Math.sin(m.t*3+m.o*9)*5;
    m.y=st.y+r.y*(m.t*160)+Math.cos(m.t*2.4+m.o*9)*5;
    if(m.t>Math.hypot(beams[m.i].x-st.x,beams[m.i].y-st.y)/160)motes.splice(k,1);
  }
}

/* ---------------------------------------------------------------- the deep */
let wake=0;
function deep(dt){
  const c=S.creature;
  if(Math.hypot(c.tx-c.x,c.ty-c.y)<24||Math.random()<dt*0.09){
    /* it keeps to whatever is waiting for it. it does not BUILD while you are
       here — it attends. the wake and the bubbles over that place are the only
       thing you ever get of the worker. */
    if(S.queue.length&&Math.random()<0.72){
      let mx=0; for(const q of S.queue)mx+=q.x; mx/=S.queue.length;
      c.tx=Math.max(660,Math.min(958,mx+(Math.random()-0.5)*70));
      c.ty=Math.min(groundY(c.tx)-18,lakeY+50+Math.random()*46);
    }else{
      c.tx=640+Math.random()*330;
      c.ty=lakeY+34+Math.random()*(650-lakeY-58);
    }
  }
  const dx=c.tx-c.x, dy=c.ty-c.y, m=Math.hypot(dx,dy)||1;
  /* it slows as the valley stills and comes to rest with it. the deep is quiet
     while you are quiet; it does its own work in your ABSENCE, not your idleness. */
  const sp=(18+S.sunk*0.6)*swell;
  c.x+=dx/m*sp*dt; c.y+=dy/m*sp*dt;
  const depth=c.y-lakeY;
  wake=Math.max(0,1-depth/70)*swell;
  if(Math.random()<dt*(0.5+wake*2.2)*(S.queue.length?1.8:1)*swell) bubbles.push({x:c.x+(Math.random()-0.5)*40,y:c.y,v:22+Math.random()*26,s:Math.random()*9,r:1+Math.random()*2});
}

/* --------------------------------------------------------------- stones */
function stones(dt){
  for(let i=S.stones.length-1;i>=0;i--){
    const s=S.stones[i];
    if(s.held)continue;
    if(s.sinking>0){
      s.sinking+=dt; s.y+=(26+s.sinking*16)*dt; s.x+=Math.sin(s.y*0.05+s.seed)*7*dt;
      if(Math.random()<dt*7)bubbles.push({x:s.x,y:s.y,v:26+Math.random()*22,s:Math.random()*9,r:1+Math.random()*2});
      if(s.y>groundY(s.x)-4||s.y>640){
        /* it reaches the bottom and WAITS there. nothing is spent, and nothing
           is built while you are here to watch it. */
        S.queue.push({text:s.text,x:s.x,seed:s.seed});
        S.sunk++; S.creature.tx=s.x; S.creature.ty=Math.min(groundY(s.x)-16,lakeY+70);
        for(let k=0;k<14;k++)bubbles.push({x:s.x+(Math.random()-0.5)*22,y:s.y,v:20+Math.random()*40,s:Math.random()*9,r:1+Math.random()*2.4});
        S.stones.splice(i,1);
      }
      continue;
    }
    /* it rests where the ground is */
    const gy=groundY(s.x)-s.r*0.6;
    if(s.y<gy){s.vy+=900*dt;s.y=Math.min(gy,s.y+s.vy*dt); if(s.y>=gy)s.vy=0}
  }
}

/* ------------------------------------------------------------------ input
   THE HAND'S LAW — four gestures, carried from ascent.html's own
   CONSTRAINTS["fifth"]: "a stage may use only reach, hold, draw or wait.
   There is no fifth gesture." world.html predates that law and already
   was NOT true on first write — this comment claimed it, then a gesture
   pass on 2026-08-21 actually checked every mechanic against the law
   instead of the label attached to it. Two claims did not survive:

   CLEAN MATCHES, checked against the definitions in ascent.html itself
   (reach()/hold()/draw()/wait()), not against what this comment used to say:
     REACH — resolves the instant a click lands, no drag needed at all.
             THE SOUNDING (already was). now also SPRING (a built block,
             clicked, comes back a stone — no drag, checked first-return).
     HOLD  — the act is the RELEASE, not the press; nothing during the hold
             writes anything real, only a visual ramp (mHeld). MEMBRANE was
             built wrong on the first pass — it wrote load→silt every frame
             it was held, which is HOLD wearing DRAW's clothes. Fixed: the
             write is one line, in release(), sized by how deep mHeld had
             ramped. A bare tap now gives back almost nothing, correctly.
     DRAW  — a course, and it only counts once released with real length
             (world.html's own `drag.moved>=8` gate, same shape as
             ascent.html's `L.moved>10`). TABLE is this: a course through
             settled ground, worked only past the threshold; a still tap on
             the same ground still only sounds it, never tables it.
     WAIT  — no input at all. THE STILLING already was, and still is.

   NOT A CLEAN MATCH, found rather than assumed: the gate, the mirror, a
   dragged stone, and a pulled cast do not fit any of the four as actually
   defined. All four resolve UNCONDITIONALLY on release — no length
   threshold, no accumulation, no minimum anything — and the gate and
   mirror don't resolve on release AT ALL, they are a continuously-tracked
   live value the whole time the hand is down, which is neither DRAW's
   committed course nor HOLD's single fire. This is a real fifth shape —
   call it LEVER — that predates ascent.html's "no fifth gesture" law
   (world.html is older) and was never reconciled against it. CHANNEL, new
   in this pass, was deliberately built to match this existing LEVER shape
   (it carves continuously as the hand moves, no length gate) rather than
   forced into DRAW's threshold-then-commit shape, because that is the
   idiom the water's own erosion — the ledger channel shares — already
   uses. Whether gate/mirror/stone/fruit should be brought into strict
   four-gesture conformance, or whether LEVER should be named as a real
   fifth member of the law, is not this pass's call to make; it is named
   here, unresolved, rather than quietly forced either way. */
let drag=null, mHold=false, mHeld=0;
function toWorld(e){
  const r=cv.getBoundingClientRect();
  const sc=Math.min(r.width/W,r.height/H);
  const ox=(r.width-W*sc)/2, oy=(r.height-H*sc)/2;
  return {x:(e.clientX-r.left-ox)/sc, y:(e.clientY-r.top-oy)/sc};
}
cv.addEventListener("pointerdown",e=>{
  if(bloom)return;          /* nothing reaches the world while it is unfolding */
  const p=toWorld(e); try{cv.setPointerCapture(e.pointerId);}catch(err){} stir();
  soundEl.classList.remove("up");     /* the hand moves on; the line closes */
  /* a ripe cast under the hand — the one thing that leaves */
  for(const s of S.shoots){
    const f=fruitAt(s);
    if(f&&Math.hypot(p.x-f.x,p.y-f.y)<f.r+13){drag={k:"fruit",s:s,x:f.x,y:f.y};return}
  }
  /* a stone under the hand */
  for(let i=S.stones.length-1;i>=0;i--){
    const s=S.stones[i];
    if(!s.sinking&&Math.hypot(p.x-s.x,p.y-s.y)<s.r+13){s.held=true;drag={k:"stone",s};return}
  }
  /* SPRING (REACH) — what the deep has already built comes back to the hand
     as a stone, verbatim: the block carries its own `text` from the night it
     rose (theNight() stamps it). Resolves the instant it lands, no drag, no
     letting-go — checked ahead of the sluice/mirror because a block is a
     thing to take, not a lever to pull. Does not compete with the night-
     build: it only ever returns what the deep already finished making. */
  for(let i=S.built.length-1;i>=0;i--){
    const b=S.built[i];
    if(p.x>b.x-b.w/2-6&&p.x<b.x+b.w/2+6&&p.y>b.y-6&&p.y<b.y+b.h+6){
      S.built.splice(i,1);
      S.stones.push({x:b.x,y:b.y-8,r:6+Math.random()*3,text:b.text||"",n:++S.nn,vy:0,held:false,sinking:0,seed:Math.random()*99});
      rebuildBlocks();
      return;
    }
  }
  /* the sluice */
  if(p.x>DAM.x0-16&&p.x<DAM.x1+16&&p.y>DAM.base-GATE_H-30&&p.y<DAM.base+16){drag={k:"gate",y0:p.y,g0:S.gate};return}
  /* MEMBRANE (HOLD) — a screen standing in the water's own cut. Pressed and
     held, it pulls the basin's suspended load down faster than the passive
     settling waters() already does, and lays exactly that much silt at its
     own foot — the SAME two fields (load.basin, S.silt) water already
     writes, hand-accelerated at one exact spot rather than a second ledger.
     The act is the press; nothing here reads what the load IS, only how
     much of it moves. */
  if(p.x>MEM.x-MEM_W/2-8&&p.x<MEM.x+MEM_W/2+8&&p.y>MEM.y-8&&p.y<MEM.y+MEM_H+8){
    mHold=true; drag={k:"membrane"}; return;
  }
  /* the mirror is a lever, not a dial: the hand takes it where it is and turns
     it from there. grabbing it must never snap it, and holding it further out
     must give finer control — both fall out of tracking the DELTA. */
  for(let i=0;i<S.seated;i++){
    const st=SEATS[i];
    if(Math.hypot(p.x-st.x,p.y-st.y)<74){
      S.aimedM[i]=true;
      drag={k:"mirror",si:i,a0:Math.atan2(p.y-st.y,p.x-st.x),m0:S.mirrors[i]};return;
    }
  }
  /* CHANNEL (DRAW) — the hand's own cut, in the same dry stretch the water's
     jet already cuts (x>DAM.x1&&x<344). Reuses S.silt exactly as the water
     does; the difference is only who is moving it — direct and deliberate
     here, incidental there. Requires the hand to be AT OR BELOW the ground:
     held above it, nothing happens, same law channel had in ascent.html. */
  if(p.x>DAM.x1+16&&p.x<344&&p.y>=groundY(p.x)-6){
    drag={k:"channel"}; return;
  }
  /* THE SOUNDING — unchanged, still a true REACH: it fires the instant the
     click lands, not on release, exactly as `reach()`'s own law states ("the
     one frame a click lands near a thing"). TABLE (DRAW) layers on top of
     the same start rather than replacing it: the sound surfaces right away,
     and if the hand keeps moving from there, a course begins too — the two
     are not exclusive, the same way a REACH and a DRAW never were in
     ascent.html's own grammar, only ever sequenced. */
  for(let i=S.settled.length-1;i>=0;i--){
    const d=S.settled[i];
    if(Math.abs(p.x-d.x)<20&&Math.abs(p.y-groundY(d.x))<24){
      sound(i,e);
      drag={k:"course",x0:p.x,y0:p.y,i0:i,touched:new Set([i]),moved:0};
      return;
    }
  }
});
cv.addEventListener("pointermove",e=>{
  const p=toWorld(e);
  cv.style.cursor = drag?"grabbing":hover(p)?"grab":soundable(p)?"pointer":"default";
  if(!drag)return;
  stir();
  if(drag.k==="gate")S.gate=Math.max(0,Math.min(1,drag.g0+(drag.y0-p.y)/GATE_H));
  else if(drag.k==="mirror"){
    const st=SEATS[drag.si];
    let d=Math.atan2(p.y-st.y,p.x-st.x)-drag.a0;
    while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    S.mirrors[drag.si]=drag.m0+d;
  }
  else if(drag.k==="stone"){drag.s.x=Math.max(8,Math.min(W-8,p.x));drag.s.y=p.y;drag.s.vy=0}
  else if(drag.k==="fruit"){drag.x=p.x;drag.y=p.y}
  else if(drag.k==="channel"){
    if(p.x>DAM.x1+16&&p.x<344&&p.y>=groundY(p.x)-6){
      const i=Math.max(0,Math.min(WN-1,Math.round(p.x/4)));
      if(S.silt[i]>-CUT_CAP){S.silt[i]=Math.max(-CUT_CAP,S.silt[i]-0.35);siltDirty=true}
    }
  }
  else if(drag.k==="course"){
    drag.moved+=Math.hypot(p.x-(drag.px==null?drag.x0:drag.px),p.y-(drag.py==null?drag.y0:drag.py));
    drag.px=p.x; drag.py=p.y;
    for(let i=S.settled.length-1;i>=0;i--){
      const d=S.settled[i];
      if(Math.abs(p.x-d.x)<20&&Math.abs(p.y-groundY(d.x))<24)drag.touched.add(i);
    }
  }
});
function hover(p){
  for(const s of S.stones)if(!s.sinking&&Math.hypot(p.x-s.x,p.y-s.y)<s.r+13)return true;
  for(const b of S.built)if(p.x>b.x-b.w/2-6&&p.x<b.x+b.w/2+6&&p.y>b.y-6&&p.y<b.y+b.h+6)return true;
  if(p.x>DAM.x0-16&&p.x<DAM.x1+16&&p.y>DAM.base-GATE_H-30&&p.y<DAM.base+16)return true;
  if(p.x>MEM.x-MEM_W/2-8&&p.x<MEM.x+MEM_W/2+8&&p.y>MEM.y-8&&p.y<MEM.y+MEM_H+8)return true;
  for(let i=0;i<S.seated;i++)if(Math.hypot(p.x-SEATS[i].x,p.y-SEATS[i].y)<74)return true;
  for(const s of S.shoots){const f=fruitAt(s); if(f&&Math.hypot(p.x-f.x,p.y-f.y)<f.r+13)return true}
  if(p.x>DAM.x1+16&&p.x<344&&p.y>=groundY(p.x)-6)return true;
  return false;
}
/* THE SOUNDING HAS A CURSOR. It was the one act in the world with no hand-signal
   — the ground gave a sentence back and nothing said the ground could be asked.
   Deliberately NOT folded into hover(): hover() means "this can be dragged" and
   reads grab; the sounding is a click and reads pointer. Same predicate as the
   pointerdown branch, and checked in the same order — last, after everything
   liftable — so a stone lying on buried ground still reads grab, not pointer. */
function soundable(p){
  for(let i=S.settled.length-1;i>=0;i--){
    const d=S.settled[i];
    if(Math.abs(p.x-d.x)<20&&Math.abs(p.y-groundY(d.x))<24)return true;
  }
  return false;
}
function sound(i,e){
  if(!own(soundEl,{k:"settled",i}))return;   /* found nothing; shows nothing */
  soundEl.classList.add("up");
  soundEl.style.left=Math.max(8,Math.min(innerWidth-352,e.clientX-150))+"px";
  soundEl.style.top=Math.max(8,e.clientY-78)+"px";
}
function release(){
  if(drag&&drag.k==="stone"){
    const s=drag.s; s.held=false;
    if(s.x>LAKE_L&&s.x<BODIES.lake.x1&&s.y>lakeY-16&&groundY(s.x)>lakeY){
      s.sinking=0.01; s.y=Math.max(s.y,lakeY);
      splashes.push({x:s.x,y:lakeY,t:0,onWater:true});
      for(let k=0;k<10;k++)spray.push({x:s.x,y:lakeY,vx:(Math.random()-0.5)*160,vy:-90-Math.random()*120,t:0});
    } else if(s.y>groundY(s.x)-26){
      /* THE SOIL, AND THE TABLE, IN ONE GESTURE. Setting a sentence down in the
         ground is the act; setting one down ON another is the work — they join
         in WRITTEN order, the seam is kept, and a worked deposit draws the
         weather harder. Where your hand lets go decides which, and there is no
         mode to be in. */
      const gx=Math.max(6,Math.min(W-6,s.x));
      let onto=null;
      for(const d of S.settled)if(Math.abs(d.x-gx)<18)onto=d;
      if(onto){
        const first=onto.n<=s.n?onto.text:s.text, second=onto.n<=s.n?s.text:onto.text;
        onto.text=first+" "+second;
        onto.n=Math.min(onto.n,s.n);
        onto.seams=(onto.seams||0)+1;
      }else{
        S.settled.push({x:gx,y:groundY(gx),text:s.text,n:s.n,seams:0});
      }
      const k=S.stones.indexOf(s); if(k>=0)S.stones.splice(k,1);
      rebuildWeather();
    }
  }
  if(drag&&drag.k==="fruit")pullCast(drag.s);
  if(drag&&drag.k==="membrane"){
    mHold=false;
    /* THE ACT IS THIS LINE, not the frames before it. Sized by how deep the
       press had ramped (mHeld, 0..1) — a tap presses barely and gives
       almost nothing back; a real hold gives its full pull. Same two real
       fields as before (load.basin, S.silt), one write, on release. */
    if(mHeld>0.02){
      const i=Math.max(0,Math.min(WN-1,Math.round(MEM.x/4)));
      const pull=Math.min(load.basin, mHeld*1.1);
      if(pull>1e-6){
        load.basin-=pull;
        if(S.silt[i]<SILT_CAP){S.silt[i]=Math.min(SILT_CAP,S.silt[i]+pull*30);siltDirty=true}
      }
    }
  }
  if(drag&&drag.k==="course"&&drag.moved>=8&&drag.touched.size){
    /* WRITES: every deposit the course touched is worked, the same act a
       merge already is — one more seam, and the weather it draws follows.
       Below the threshold nothing is written here at all: the sounding
       already ran, at pointerdown, and a tap that never became a course
       owes this ledger nothing more. */
    drag.touched.forEach(function(i){ if(S.settled[i])S.settled[i].seams=(S.settled[i].seams||0)+1; });
    rebuildWeather();
  }
  drag=null;
}
cv.addEventListener("pointerup",release);
cv.addEventListener("pointercancel",release);

/* ------------------------------------------------------------------ paint */
const SHEET={x0:44,x1:956,y0:14,y1:190};
/* THE CLOUD'S BAND — the free sky between the page's lower edge and the ridge.
   DERIVED FROM SHEET.y1, never written as a number: the cloud was drawn at a
   literal cy=112, which is INSIDE the page, at 80% opacity over it, and so the
   one signal that writing is becoming weather before a drop falls could not be
   seen. Eight suites, every assertion green, none of them looking. (LEARNED 5,
   re-broken the day after it was filed; LEARNED 22 — a fact, not a comment, so
   moving the page moves the cloud instead of hiding it again.) */
const CLOUD_TOP=SHEET.y1+4, CLOUD_BOT=236;
const CLOUD_CY=(CLOUD_TOP+CLOUD_BOT)/2, CLOUD_RR=(CLOUD_BOT-CLOUD_TOP)/2;
function fit(){
  const d=Math.min(devicePixelRatio||1,2);
  cv.width=innerWidth*d; cv.height=innerHeight*d;
  const sc=Math.min(innerWidth/W,innerHeight/H);
  g.setTransform(d*sc,0,0,d*sc,d*(innerWidth-W*sc)/2,d*(innerHeight-H*sc)/2);
  /* THE PAGE SITS IN THE SKY BAND AND NOWHERE ELSE. Above every control the
     world has, so the whole valley below stays workable with no mode to be in —
     and low enough that the water it makes is visible under it while you write. */
  const ox=(innerWidth-W*sc)/2, oy=(innerHeight-H*sc)/2;
  sheetEl.style.left=(ox+SHEET.x0*sc)+"px";
  sheetEl.style.top=(oy+SHEET.y0*sc)+"px";
  sheetEl.style.width=((SHEET.x1-SHEET.x0)*sc)+"px";
  sheetEl.style.height=((SHEET.y1-SHEET.y0)*sc)+"px";
  const fs=Math.max(11,Math.min(19,15*sc));
  pagebg.style.fontSize=field.style.fontSize=fs+"px";
  pagebg.style.padding=field.style.padding=(10*sc)+"px "+(14*sc)+"px";
}
/* resizing resets the backing store, which CLEARS it — a still world would sit
   blank until the hand moved. one frame is owed, and it is not a stir. */
addEventListener("resize",()=>{fit(); if(!running&&!frameQueued){frameQueued=true;requestAnimationFrame(frame)}});
fit();

function markRange(k){
  return k==="res"?[0,DAM.x0]:k==="basin"?[DAM.x1,LAKE_L]
       :k==="lake"?[LAKE_L,BODIES.lake.x1]:[BODIES.basin2.x0,W];
}
/* WHAT THE DEEP MADE. The deep itself is never drawn — this is. Cut faces and a
   shadowed underside, so it reads as placed rather than grown, and so a stack
   reads as a stair. Painted once beneath the water, then again clipped above the
   surface, which is what lets a structure BREAK the waterline as it grows. */
function paintBuilt(){
  for(const b of S.built){
    const x0=b.x-b.w/2;
    g.fillStyle="#2c2922"; g.fillRect(x0,b.y,b.w,b.h);
    g.fillStyle="rgba(198,188,160,.20)"; g.fillRect(x0,b.y,b.w,3);
    g.fillStyle="rgba(0,0,0,.30)"; g.fillRect(x0,b.y+b.h-2.5,b.w,2.5);
    g.fillStyle="rgba(0,0,0,.18)"; g.fillRect(x0,b.y,2,b.h);
  }
}
function waterPath(b,sy){
  if(sy>=1e8)return null;
  let x0=null,x1=null;
  for(let x=b.x0;x<=b.x1;x+=2){ if(groundY(x)>sy){ if(x0===null)x0=x; x1=x } }
  if(x0===null)return null;
  return {x0,x1};
}
function paintWater(b,sy,t,c0,c1){
  const p=waterPath(b,sy); if(!p)return;
  g.save(); g.beginPath();
  g.moveTo(p.x0,sy);
  for(let x=p.x0;x<=p.x1;x+=4){
    const w=(Math.sin(x*0.045+t*1.6)*1.1+Math.sin(x*0.017-t*1.1)*1.5)*swell;
    g.lineTo(x,sy+w);
  }
  for(let x=p.x1;x>=p.x0;x-=4)g.lineTo(x,Math.max(groundY(x),sy));
  g.closePath();
  const grd=g.createLinearGradient(0,sy,0,Math.min(H,sy+180));
  grd.addColorStop(0,c0); grd.addColorStop(1,c1);
  g.fillStyle=grd; g.fill();
  g.restore();
  return p;
}
function surfaceLine(p,sy,t){
  if(!p)return;
  g.save(); g.beginPath();
  for(let x=p.x0;x<=p.x1;x+=4){
    const w=(Math.sin(x*0.045+t*1.6)*1.1+Math.sin(x*0.017-t*1.1)*1.5)*swell;
    if(x===p.x0)g.moveTo(x,sy+w); else g.lineTo(x,sy+w);
  }
  g.strokeStyle="rgba(232,247,246,.5)"; g.lineWidth=1.2; g.stroke();
  g.restore();
}

let t=0, last=performance.now(), swell=1;
function frame(now){
  frameQueued=false; running=true;
  const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  swell=calm();
  flash=Math.max(0,flash-dt*1.1);

  if(bloom){
    /* the motion, and nothing else. all-or-nothing: it cannot stop half-open,
       and no act of the hand reaches the world while it is moving. */
    bloom.t=Math.min(1,bloom.t+dt/BLOOM_T);
    const e=bloom.t<0.5?4*bloom.t*bloom.t*bloom.t
                       :1-Math.pow(-2*bloom.t+2,3)/2;      /* ease in and out */
    M=e; siteStage(M); rebuildGY(); carry(M);
    for(let i=0;i<SEATS.length;i++)beams[i]=cast(S.mirrors[i],i);
    if(bloom.t>=1)commitBloom();
  } else {
    waters(dt); rain(dt); light(dt); deep(dt); stones(dt); membraneStep(dt);
  }

  g.clearRect(-400,-400,W+800,H+800);

  /* --- sky ------------------------------------------------------------- */
  const sky=g.createLinearGradient(0,0,0,H*0.72);
  sky.addColorStop(0,"#9fb8c2"); sky.addColorStop(.55,"#cfd8d2"); sky.addColorStop(1,"#e8dcc6");
  g.fillStyle=sky; g.fillRect(0,0,W,H);

  /* the sun, and its bloom */
  const sg=g.createRadialGradient(SUN.x,SUN.y,4,SUN.x,SUN.y,150);
  sg.addColorStop(0,"rgba(255,246,214,.95)"); sg.addColorStop(1,"rgba(255,240,200,0)");
  g.fillStyle=sg; g.beginPath(); g.arc(SUN.x,SUN.y,150,0,7); g.fill();

  /* far hills */
  g.fillStyle="rgba(139,158,158,.55)";
  g.beginPath(); g.moveTo(0,330);
  for(let x=0;x<=W;x+=20)g.lineTo(x,308+Math.sin(x*0.006)*44+Math.sin(x*0.017+2)*16);
  g.lineTo(W,H); g.lineTo(0,H); g.fill();

  /* --- the cloud gathers while you write ------------------------------- */
  /* it gathers OVER WHERE IT WILL FALL, so the hand's work in the soil is
     visible in the sky before a drop lands */
  const cloudLoad=Math.min(1,pending/90), heavy=Math.max(cloudLoad,rainQueue>0?1:0);
  if(heavy>0.01){
    g.save();
    for(let i=0;i<7;i++){
      const cx=rainMean-138+i*46+Math.sin(t*0.35+i)*7;
      const cy=CLOUD_CY+Math.cos(t*0.5+i*1.7)*3;
      const rr=CLOUD_RR*(0.74+((i*37)%22)/76);
      const cg=g.createRadialGradient(cx,cy,2,cx,cy,rr);
      const a=0.10+heavy*0.55;
      cg.addColorStop(0,"rgba("+(150-heavy*70)+","+(158-heavy*70)+","+(166-heavy*66)+","+a+")");
      cg.addColorStop(1,"rgba(150,158,166,0)");
      g.fillStyle=cg; g.beginPath(); g.arc(cx,cy,rr,0,7); g.fill();
    }
    g.restore();
  }

  /* --- ground ---------------------------------------------------------- */
  g.beginPath(); g.moveTo(0,groundY(0));
  for(let x=0;x<=W;x+=3)g.lineTo(x,groundY(x));
  g.lineTo(W,H); g.lineTo(0,H); g.closePath();
  const gg=g.createLinearGradient(0,240,0,H);
  gg.addColorStop(0,"#8f8468"); gg.addColorStop(.5,"#6f6650"); gg.addColorStop(1,"#4a4436");
  g.fillStyle=gg; g.fill();

  /* wet ground reads darker — the shore is legible without a word */
  g.save(); g.beginPath();
  for(let x=0;x<=W;x+=4){const y=groundY(x);if(x===0)g.moveTo(x,y);else g.lineTo(x,y)}
  g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.clip();
  /* THREE PASSES, ONE FILL EACH. drawn per-cell with a translucent style, every
     seam between two cells is painted twice and the shore renders as a picket
     fence. banding the wetness and filling each band as ONE path makes the
     overlaps free — a single fill never double-darkens itself. */
  const BANDS=[[0.75,.40],[0.42,.25],[0.12,.13]];
  for(let b=0;b<BANDS.length;b++){
    const lo=BANDS[b][0], hi=b?BANDS[b-1][0]:2;
    g.beginPath(); let any=false;
    for(let i=0;i<WN-1;i++){
      const w=S.wet[i]; if(w<lo||w>=hi)continue;
      const x0=i*4, x1=x0+4.7, y0=groundY(x0)-1, y1=groundY(x1)-1;
      g.moveTo(x0,y0); g.lineTo(x1,y1); g.lineTo(x1,y1+30); g.lineTo(x0,y0+30);
      g.closePath(); any=true;
    }
    if(any){g.fillStyle="rgba(34,42,38,"+BANDS[b][1]+")"; g.fill()}
  }
  /* THE FLOOD MARKS. A horizontal level, still clipped to the ground — so it
     paints only where there is hillside at that height and vanishes across the
     empty bowl. That is what makes it read as a ring and not a floating line.
     Yesterday's marks are fainter than today's; nothing says which is which. */
  for(const L of [["hiPast",0.17],["hiNow",0.30]]){
    for(const k of BODYK){
      const lv=S[L[0]][k]; if(lv>=NOMARK)continue;
      const r=markRange(k);
      g.fillStyle="rgba(48,38,22,"+L[1]+")";
      g.fillRect(r[0],lv-0.9,r[1]-r[0],1.9);
    }
  }
  g.restore();

  /* --- water ------------------------------------------------------------ */
  paintBuilt();                       /* under the water, it is a shadow of itself */
  const pr=paintWater(BODIES.res,resY,t,"rgba(96,146,150,.90)","rgba(44,86,94,.95)");
  const pb=paintWater(BODIES.basin,basinY,t,"rgba(104,154,156,.90)","rgba(48,92,98,.95)");
  const pl=paintWater(BODIES.lake,lakeY,t,"rgba(74,124,132,.94)","rgba(11,32,40,1)");

  /* --- the deep: something enormous and gentle -------------------------- */
  if(pl){
    g.save();
    g.beginPath(); g.moveTo(pl.x0,lakeY);
    for(let x=pl.x0;x<=pl.x1;x+=4)g.lineTo(x,lakeY);
    for(let x=pl.x1;x>=pl.x0;x-=4)g.lineTo(x,Math.max(groundY(x),lakeY));
    g.closePath(); g.clip();
    const c=S.creature, sz=54+S.sunk*2.2;
    const cg=g.createRadialGradient(c.x,c.y,4,c.x,c.y,sz*1.7);
    cg.addColorStop(0,"rgba(6,20,26,.82)"); cg.addColorStop(.55,"rgba(8,26,32,.44)"); cg.addColorStop(1,"rgba(8,26,32,0)");
    g.fillStyle=cg;
    g.beginPath(); g.ellipse(c.x,c.y,sz*1.6,sz*0.62,Math.sin(t*0.4)*0.09,0,7); g.fill();
    /* the slow shape of it moving */
    g.fillStyle="rgba(4,16,22,.30)";
    for(let k=0;k<3;k++){
      const px=c.x-k*30-Math.sin(t*1.1+k)*7, py=c.y+Math.sin(t*1.3+k*1.4)*5;
      g.beginPath(); g.ellipse(px,py,26-k*6,10-k*2,Math.sin(t*0.8+k)*0.3,0,7); g.fill();
    }
    g.restore();
    /* the wake it pushes at the surface */
    if(wake>0.02){
      g.save(); g.strokeStyle="rgba(226,244,242,"+(wake*0.5)+")"; g.lineWidth=1.1;
      for(let k=0;k<3;k++){
        g.beginPath();
        for(let x=S.creature.x-70;x<S.creature.x+70;x+=5){
          const d=Math.abs(x-S.creature.x)/70;
          const y=lakeY+Math.sin(x*0.1-t*3+k*1.5)*2.4*(1-d)+k*3;
          if(x<=S.creature.x-70+5)g.moveTo(x,y); else g.lineTo(x,y);
        }
        g.stroke();
      }
      g.restore();
    }
  }
  /* bubbles rising to the waterline */
  g.fillStyle="rgba(214,240,240,.5)";
  for(const b of bubbles){g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill()}

  surfaceLine(pr,resY,t); surfaceLine(pb,basinY,t); surfaceLine(pl,lakeY,t);
  /* and again above the line — the day a stack finally stands out of the water
     is the day it stops being a rumour, and nothing announces that either */
  if(S.built.length){
    g.save(); g.beginPath(); g.rect(0,0,W,lakeY+0.5); g.clip(); paintBuilt(); g.restore();
  }

  /* --- the dam and its sluice ------------------------------------------ */
  const openY=DAM.base-GATE_H*S.gate;
  g.fillStyle="#57503f"; g.fillRect(DAM.x0,DAM.crest,DAM.x1-DAM.x0,DAM.base-DAM.crest);
  g.fillStyle="rgba(255,255,255,.10)"; g.fillRect(DAM.x0,DAM.crest,4,DAM.base-DAM.crest);
  /* the opening, and the water in it */
  if(S.gate>0.01){
    g.fillStyle="rgba(18,30,34,.9)"; g.fillRect(DAM.x0,openY,DAM.x1-DAM.x0,DAM.base-openY);
    if(resY<DAM.base){
      g.fillStyle="rgba(120,176,178,.85)";
      g.fillRect(DAM.x0,Math.max(openY,resY),DAM.x1-DAM.x0,DAM.base-Math.max(openY,resY));
    }
  }
  /* the gate panel — it glints, which is the whole of the teaching */
  g.fillStyle="#3c3830"; g.fillRect(DAM.x0+3,openY-GATE_H,DAM.x1-DAM.x0-6,GATE_H);
  const gl=0.45+0.35*Math.sin(t*2.1);
  g.fillStyle="rgba(255,238,190,"+(S.gate>0.02?0.18:gl)+")";
  g.fillRect(DAM.x0+5,openY-GATE_H+4,DAM.x1-DAM.x0-10,3);
  g.fillStyle="#241f18";
  g.fillRect(DAM.x0+9,openY-GATE_H-7,DAM.x1-DAM.x0-18,7);

  /* --- THE MEMBRANE, standing in the water's own cut -------------------- */
  /* a screen: hatched lines fixed in place, and a plate that advances only
     as far as mHeld — the press itself is the whole readout, no bar, no
     count, same idiom the sill in seam.js already uses. */
  g.save();
  g.strokeStyle="rgba(90,84,74,.55)"; g.lineWidth=1.4;
  for(let y=MEM.y;y<MEM.y+MEM_H;y+=8){
    g.beginPath(); g.moveTo(MEM.x-MEM_W/2,y); g.lineTo(MEM.x-MEM_W/2,y+5); g.stroke();
    g.beginPath(); g.moveTo(MEM.x+MEM_W/2,y); g.lineTo(MEM.x+MEM_W/2,y+5); g.stroke();
  }
  g.strokeStyle="rgba(90,84,74,.35)"; g.lineWidth=1;
  g.beginPath(); g.moveTo(MEM.x-MEM_W/2,MEM.y); g.lineTo(MEM.x-MEM_W/2,MEM.y+MEM_H); g.stroke();
  g.beginPath(); g.moveTo(MEM.x+MEM_W/2,MEM.y); g.lineTo(MEM.x+MEM_W/2,MEM.y+MEM_H); g.stroke();
  const plateY=MEM.y+MEM_H*(1-mHeld*0.7);
  g.fillStyle="rgba(90,84,74,"+(0.30+mHeld*0.35)+")";
  g.fillRect(MEM.x-MEM_W/2-4,plateY,MEM_W+8,(MEM.y+MEM_H)-plateY);
  g.restore();

  /* the jet, the spill, the splashes */
  g.fillStyle="rgba(206,232,232,.62)";
  for(const p of spray){g.beginPath();g.arc(p.x,p.y,1.6,0,7);g.fill()}
  if(jetT>0.05&&resY<DAM.base){
    g.save(); g.globalAlpha=Math.min(1,jetT)*0.75;
    g.beginPath(); g.moveTo(DAM.x1,openY);
    g.quadraticCurveTo(DAM.x1+60*S.gate+20,openY+26,330,446);
    g.lineTo(330,458); g.quadraticCurveTo(DAM.x1+58*S.gate+16,openY+40,DAM.x1,DAM.base);
    g.closePath(); g.fillStyle="rgba(150,196,196,.8)"; g.fill(); g.restore();
  }

  /* --- rain ------------------------------------------------------------ */
  g.strokeStyle="rgba(226,240,244,.62)"; g.lineWidth=1.1;
  g.beginPath();
  for(const d of drops){g.moveTo(d.x,d.y);g.lineTo(d.x-1.5,d.y-d.l)}
  g.stroke();
  for(const s of splashes){
    const r=2+s.t*11;
    g.strokeStyle="rgba(232,246,246,"+(0.55*(1-s.t))+")"; g.lineWidth=1;
    g.beginPath(); g.ellipse(s.x,s.y,r,r*(s.onWater?0.32:0.42),0,0,7); g.stroke();
  }

  /* --- what the hand has set into the soil ------------------------------ */
  for(const d of S.settled){
    const gy=groundY(d.x), sm=d.seams||0, w=9+sm*3.4, hh=4.8+sm*0.9;
    g.fillStyle="#4a4234";
    g.beginPath(); g.ellipse(d.x,gy-1,w,hh,0,Math.PI,0); g.fill();
    g.fillStyle="rgba(240,232,206,.15)";
    g.beginPath(); g.ellipse(d.x-w*0.28,gy-2.4,w*0.38,hh*0.42,0,Math.PI,0); g.fill();
    for(let k=0;k<sm;k++){                       /* one seam per joining */
      const sx=d.x-w+(k+1)*(2*w/(sm+1));
      g.strokeStyle="rgba(18,14,8,.42)"; g.lineWidth=1;
      g.beginPath(); g.moveTo(sx,gy-1); g.lineTo(sx,gy-1-hh*0.92); g.stroke();
    }
  }

  /* --- shoots: where light met water, ACROSS RETURNED DAYS --------------- */
  for(const s of S.shoots){
    const q=shootShape(s), gg=q.gg, h=q.h, sway=q.sway;
    g.save(); g.translate(s.x,s.y); g.rotate(sway);
    g.strokeStyle="#5f8a46"; g.lineWidth=1.8+gg*1.6; g.lineCap="round";
    g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(2,-h*0.55,0,-h); g.stroke();
    for(let k=0;k<3;k++){
      const lp=0.35+k*0.24; if(gg<lp-0.2)continue;
      const ly=-h*lp, sd=k%2?1:-1, sz=(6+gg*13)*Math.min(1,(gg-(lp-0.2))*4);
      g.fillStyle=k===0?"#6f9a52":"#7ba85c";
      g.beginPath(); g.moveTo(0,ly);
      g.quadraticCurveTo(sd*sz*0.8,ly-sz*0.55,sd*sz,ly-sz*0.1);
      g.quadraticCurveTo(sd*sz*0.55,ly+sz*0.3,0,ly); g.fill();
    }
    /* FRUIT. A stand that has been lit and wet across enough returns hangs one.
       It cannot be reached by a long day — only by many. Taking it is not built
       here; that is M4's, and hanging it is M3's. */
    if(s.rooted>0.72&&!(drag&&drag.k==="fruit"&&drag.s===s)){
      const fy=-h*0.80, fr=q.fr;
      g.strokeStyle="#5f8a46"; g.lineWidth=1.1;
      g.beginPath(); g.moveTo(0,fy); g.lineTo(5,fy+3); g.stroke();
      g.fillStyle="#9c5a34";
      g.beginPath(); g.arc(6,fy+3+fr*0.7,fr,0,7); g.fill();
      g.fillStyle="rgba(255,232,190,.34)";
      g.beginPath(); g.arc(6-fr*0.3,fy+3+fr*0.45,fr*0.42,0,7); g.fill();
    }
    if(s.lit>0){g.fillStyle="rgba(255,240,190,"+(s.lit*0.35)+")";g.beginPath();g.arc(0,-h,7,0,7);g.fill()}
    g.restore();
  }

  /* --- stones ---------------------------------------------------------- */
  for(const s of S.stones){
    g.save();
    if(s.sinking>0)g.globalAlpha=Math.max(0.12,1-s.sinking*0.24);
    g.fillStyle="#3f3a30";
    g.beginPath(); g.ellipse(s.x,s.y,s.r*1.25,s.r,Math.sin(s.seed)*0.6,0,7); g.fill();
    g.fillStyle="rgba(255,246,220,.30)";
    g.beginPath(); g.ellipse(s.x-s.r*0.3,s.y-s.r*0.35,s.r*0.5,s.r*0.34,0,0,7); g.fill();
    if(s.held){g.strokeStyle="rgba(255,240,200,.55)";g.lineWidth=1.2;g.beginPath();g.arc(s.x,s.y,s.r+7,0,7);g.stroke()}
    g.restore();
  }

  /* --- the heliostats, and the light they throw ------------------------- */
  /* the shafts, drawn after the world so they lie over it like light does */
  for(let i=0;i<S.seated;i++){
    const st=SEATS[i], beam=beams[i];
    if(!beam.hit)continue;
    const dx=beam.x-st.x, dy=beam.y-st.y, m=Math.hypot(dx,dy)||1;
    const nx=-dy/m, ny=dx/m, wdt=9;
    g.save(); g.globalCompositeOperation="lighter";
    const bg=g.createLinearGradient(st.x,st.y,beam.x,beam.y);
    bg.addColorStop(0,"rgba(255,238,180,.36)"); bg.addColorStop(1,"rgba(255,232,168,.16)");
    g.fillStyle=bg;
    g.beginPath();
    g.moveTo(st.x+nx*3,st.y+ny*3); g.lineTo(beam.x+nx*wdt,beam.y+ny*wdt);
    g.lineTo(beam.x-nx*wdt,beam.y-ny*wdt); g.lineTo(st.x-nx*3,st.y-ny*3);
    g.closePath(); g.fill();
    /* the warm pool where it lands — a wall takes the light and gives nothing */
    if(beam.hit!=="wall"){
      const pg=g.createRadialGradient(beam.x,beam.y,1,beam.x,beam.y,42);
      pg.addColorStop(0,"rgba(255,240,190,.55)"); pg.addColorStop(1,"rgba(255,236,180,0)");
      g.fillStyle=pg; g.beginPath(); g.ellipse(beam.x,beam.y,42,17,0,0,7); g.fill();
    }
    g.restore();
  }
  g.save(); g.globalCompositeOperation="lighter";
  for(const mo of motes){
    if(mo.i>=S.seated)continue;
    g.fillStyle="rgba(255,244,206,"+(0.5*(1-mo.t))+")";
    g.beginPath(); g.arc(mo.x,mo.y,1.3,0,7); g.fill();
  }
  /* the incoming rays from the sun */
  g.strokeStyle="rgba(255,240,196,.16)"; g.lineWidth=7;
  for(let i=0;i<S.seated;i++){
    g.beginPath(); g.moveTo(SUN.x,SUN.y); g.lineTo(SEATS[i].x,SEATS[i].y); g.stroke();
  }
  g.restore();
  /* the posts and the mirrors */
  for(let i=0;i<S.seated;i++){
    const st=SEATS[i];
    g.strokeStyle="#4a4436"; g.lineWidth=4;
    g.beginPath(); g.moveTo(st.x,st.y); g.lineTo(st.x,groundY(st.x)); g.stroke();
    g.save(); g.translate(st.x,st.y); g.rotate(S.mirrors[i]);
    g.fillStyle="#20262a"; g.fillRect(-st.len/2,-4.5,st.len,9);
    const mg=g.createLinearGradient(-st.len/2,0,st.len/2,0);
    mg.addColorStop(0,"#f6f2e2"); mg.addColorStop(.5,"#ffffff"); mg.addColorStop(1,"#dfe6e4");
    g.fillStyle=mg; g.fillRect(-st.len/2+1.5,-3,st.len-3,4.4);
    g.restore();
    g.fillStyle="#2d3238"; g.beginPath(); g.arc(st.x,st.y,5,0,7); g.fill();
  }

  /* --- a course, mid-draw ------------------------------------------------ */
  /* TABLE, drawn while it is being drawn: every deposit the course has
     touched so far reads warmer, so the hand can see what it has worked
     before it lets go — the same "already picked" cue seam.js's own
     fraction buttons use, translated to this canvas. */
  if(drag&&drag.k==="course"){
    g.strokeStyle="rgba(74,108,122,.55)"; g.lineWidth=2.4; g.lineCap="round";
    g.beginPath(); g.moveTo(drag.x0,drag.y0); g.lineTo(drag.px==null?drag.x0:drag.px,drag.py==null?drag.y0:drag.py); g.stroke();
    drag.touched.forEach(function(i){
      const d=S.settled[i]; if(!d)return;
      g.strokeStyle="rgba(255,214,120,.55)"; g.lineWidth=1.4;
      g.beginPath(); g.arc(d.x,groundY(d.x)-1,12,0,7); g.stroke();
    });
  }

  /* --- a cast in the hand ---------------------------------------------- */
  if(drag&&drag.k==="fruit"){
    const fr=shootShape(drag.s).fr;
    g.fillStyle="#9c5a34"; g.beginPath(); g.arc(drag.x,drag.y,fr,0,7); g.fill();
    g.fillStyle="rgba(255,232,190,.34)";
    g.beginPath(); g.arc(drag.x-fr*0.3,drag.y-fr*0.25,fr*0.42,0,7); g.fill();
    g.strokeStyle="rgba(255,240,200,.5)"; g.lineWidth=1.2;
    g.beginPath(); g.arc(drag.x,drag.y,fr+7,0,7); g.stroke();
  }

  /* --- THE MEMBRANE, at the world's edge -------------------------------- */
  /* Named, visible, and CLOSED. A PLACE rather than a feature: nothing here
     answers the hand, nothing crosses it, and nothing behind it is implied or
     hinted at. The fork about who else might ever stand on the other side is
     Kevin's and is not built — this is the seam that fork is about, drawn so
     that it exists rather than being a blank edge where a wall should be.
     It has no hit test anywhere in this file, and that is deliberate. */
  g.save();
  const mem=g.createLinearGradient(W-26,0,W,0);
  mem.addColorStop(0,"rgba(214,232,236,0)");
  mem.addColorStop(0.72,"rgba(214,232,236,.09)");
  mem.addColorStop(1,"rgba(228,242,246,.20)");
  g.fillStyle=mem; g.fillRect(W-26,0,26,H);
  g.strokeStyle="rgba(232,244,246,.30)"; g.lineWidth=1;
  g.beginPath();
  for(let y=0;y<=H;y+=6){
    const xx=W-1.5+Math.sin(y*0.035+t*0.5)*1.1*swell;
    if(y===0)g.moveTo(xx,y); else g.lineTo(xx,y);
  }
  g.stroke(); g.restore();

  /* --- the arrival flash: the world is glad, and knows nothing ---------- */
  if(flash>0.01){
    g.save(); g.globalCompositeOperation="lighter";
    g.fillStyle="rgba(255,250,232,"+(flash*0.085)+")"; g.fillRect(0,0,W,H); g.restore();
  }

  /* THE LOOP ENDS ITSELF. Not a throttle and not a pause — when nothing in the
     valley is still changing, the page genuinely stops asking for frames, and
     the next act of the hand starts it again. That quiet IS the mechanic. */
  const stonesMoving=S.stones.some(s=>s.held||s.sinking>0||Math.abs(s.vy)>0.4||s.y<groundY(s.x)-s.r*0.6-0.5);
  const draining=(S.gate>0.02&&S.res>0&&resY<DAM.base)||S.basin>volumeAt(BODIES.basin,LIP)+1;
  /* light is not the hand — a seed still forming under a beam keeps the loop
     alive. ROOTING never does: it is a single step taken on a day change, so
     there is nothing to wait out and nothing a longer session can add. */
  const growing=beams.some((b,i)=>i<S.seated&&b.hit==="ground"&&wetAt(b.x)>0.3&&dwell[i]>0);
  /* 0.05 is not a taste: nesi.html's stilling quiets at amplitude 0.3 of a
     swell whose full height is 6, and this is that same fraction, so the two
     surfaces fall quiet on the same clock. ~66s after the last act. */
  const busy = bloom || swell>0.05 || drag || siltDirty || rainQueue>0 || flash>0.01
            || drops.length || splashes.length || spray.length || bubbles.length
            || jetT>0.05 || spillT>0.05 || draining || stonesMoving || growing
            || mHold || mHeld>0.001;
  if(busy)requestAnimationFrame(frame); else running=false;
}
/* the first frame is a KICK, not a stir: the valley paints itself once and then
   holds still, because `lastStir` starts before time. The hand starts the day. */
frameQueued=true; requestAnimationFrame(frame);
</script>
</body>
</html>
