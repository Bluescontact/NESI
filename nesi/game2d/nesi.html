<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NESI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#efe9dc;font-family:Georgia,serif}
#stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column}
#room{position:relative;height:188px;flex:none;background:#4a4336;transition:background 2s}
#glass{height:16px;flex:none;background:linear-gradient(#bfb7a2,#d8d2c2);opacity:.85}
#worldwrap{position:relative;flex:1;background:#e9e2d2}
#world{position:absolute;inset:0;width:100%;height:100%}
#field{position:absolute;inset:0;width:100%;height:100%;background:rgba(238,232,220,.80);border:none;outline:none;resize:none;padding:60px 18%;font-family:Georgia,serif;font-size:19px;line-height:1.9;color:#2e2617;display:block;z-index:4}
#panel{position:absolute;inset:24px;background:rgba(74,67,54,.97);display:none;border:1px solid #2e2a22;z-index:6}
#panel.on{display:block}
.station{position:absolute;bottom:24px;width:64px;height:64px;cursor:pointer}
.station svg{width:100%;height:100%}
#tank{position:absolute;left:40px;bottom:18px;width:74px;height:140px;cursor:pointer}
#tetraov{position:absolute;inset:0;z-index:5;background:rgba(238,232,220,.96);display:none}
#tetraov.on{display:block}
#netview{position:absolute;inset:0}
#faceview{position:absolute;inset:0;display:none;background:rgba(238,232,220,.98);padding:26px 8%}
#faceview.on{display:block}
#facehost{width:100%;height:calc(100% - 60px);overflow:auto}
#foldback{position:absolute;top:14px;right:20px;width:34px;height:30px;cursor:pointer;opacity:.55}
#blindline{width:100%;font-family:Georgia,serif;font-size:19px;line-height:1.9;color:#2e2617;background:transparent;border:none;border-bottom:1px solid #ccc5b0;outline:none;padding:10px 4px;margin-top:18vh}
.stile{position:relative;font-family:Georgia,serif;font-size:14px;line-height:1.7;color:#3a3020;background:rgba(255,255,255,.5);border:1px solid #ccc5b0;padding:8px 30px 8px 11px;margin:7px 0;cursor:grab}
.stile.worked{border-left:3px solid #7a6840}
.stile.tether{outline:2px dashed #4a5a8a}
.stile .markline{display:block;font-size:11px;color:#7a6840;margin-top:4px;font-style:italic}
.stile .paneh{position:absolute;top:6px;right:8px;width:14px;height:14px;cursor:pointer;opacity:.45}
#stonepane{position:absolute;z-index:9;right:6%;top:8%;width:min(420px,80%);background:rgba(240,235,222,.98);border:1px solid #7a6840;padding:16px;font-family:Georgia,serif;display:none}
#stonepane.on{display:block}
#stonepane .src{font-size:11px;color:#7a6840;letter-spacing:1px;margin-bottom:8px}
#stonepane textarea{width:100%;min-height:90px;font-family:Georgia,serif;font-size:14px;line-height:1.7;color:#2e2617;background:#fff;border:1px solid #ccc5b0;padding:8px;resize:vertical}
#stonepane input{width:100%;font-family:Georgia,serif;font-size:12.5px;color:#3a3020;background:transparent;border:none;border-bottom:1px solid #ccc5b0;outline:none;padding:4px 2px;margin-top:10px}
#stonepane .lines{font-size:11px;color:#5a5040;margin-top:10px}
#stonepane .closep{position:absolute;top:8px;right:10px;width:18px;height:18px;cursor:pointer;opacity:.5}
.chip{position:absolute;width:34px;height:34px;cursor:grab;touch-action:none}
.chip:active{cursor:grabbing}
.mouth{position:absolute;width:56px;height:56px;border-radius:50%;border:2px dashed rgba(222,214,196,.5)}
.plate{position:absolute;width:64px;height:40px;border:2px solid rgba(222,214,196,.55);border-radius:4px}
#sound{position:absolute;display:none;max-width:340px;font-size:14.5px;line-height:1.7;color:#3a3020;background:rgba(240,235,222,.92);padding:10px 13px;border-left:2px solid #7a6840;pointer-events:none;z-index:7}
#closer{position:absolute;top:8px;right:12px;width:26px;height:26px;cursor:pointer;opacity:.6}
#dampanel{position:absolute;display:none;background:rgba(74,67,54,.97);border:1px solid #2e2a22;padding:14px;z-index:6}
#dampanel div{width:120px;height:44px;margin:6px 0;border:2px solid rgba(222,214,196,.6);cursor:pointer;color:#ddd6c4;font-family:Georgia,serif;font-size:12px;display:flex;align-items:center;justify-content:center;letter-spacing:1px}
#dampanel .rel{background:rgba(112,146,160,.45)}
#dampanel .shut{background:transparent}
#teach{position:absolute;left:0;right:0;bottom:0;z-index:9;padding:8px 20px;font-family:Georgia,serif;font-size:13.5px;line-height:1.6;color:#4a3f2c;background:rgba(238,232,220,.92);border-top:1px solid #ccc5b0;display:none;pointer-events:none}
.pv-h{font-family:Georgia,serif}
</style>
</head>
<body>
<div id="stage">
  <div id="room">
    <div id="tank"><svg viewBox="0 0 74 140" style="width:100%;height:100%">
      <defs><clipPath id="tetraclip"><polygon points="6,6 68,6 37,134"/></clipPath></defs>
      <rect id="tankwater2" x="0" y="140" width="74" height="0" fill="rgba(112,146,160,.75)" clip-path="url(#tetraclip)"/>
      <polygon points="6,6 68,6 37,134" fill="none" stroke="#241f16" stroke-width="2"/>
      <line x1="37" y1="6" x2="37" y2="134" stroke="#241f16" stroke-width=".7" opacity=".5"/>
      <line x1="21.5" y1="70" x2="52.5" y2="70" stroke="#241f16" stroke-width=".7" opacity=".5"/>
    </svg></div>
    <div class="station" id="st0" style="left:220px"><svg viewBox="0 0 64 64"><rect x="8" y="26" width="48" height="8" fill="#8a7f66" transform="rotate(-4 32 30)"/><rect x="28" y="34" width="8" height="20" fill="#6b6250"/></svg></div>
    <div class="station" id="st1" style="left:340px"><svg viewBox="0 0 64 64"><circle cx="32" cy="26" r="13" fill="none" stroke="#c9b878" stroke-width="3"/><line x1="32" y1="39" x2="32" y2="56" stroke="#6b6250" stroke-width="4"/></svg></div>
    <div class="station" id="st2" style="left:460px"><svg viewBox="0 0 64 64"><path d="M8 20 Q32 44 56 20" fill="none" stroke="#a89a7c" stroke-width="3"/><circle cx="8" cy="20" r="4" fill="#6b6250"/><circle cx="56" cy="20" r="4" fill="#6b6250"/><circle cx="32" cy="32" r="4" fill="#6b6250"/></svg></div>
    <div class="station" id="st3" style="left:580px"><svg viewBox="0 0 64 64"><rect x="10" y="14" width="44" height="6" fill="#8a7f66"/><rect x="10" y="28" width="44" height="6" fill="#8a7f66"/><rect x="10" y="42" width="44" height="6" fill="#8a7f66"/></svg></div>
    <div class="station" id="mouth2" style="left:130px;width:44px"><svg viewBox="0 0 64 64"><path d="M18 14 L46 14 L46 50 L18 50 Z" fill="none" stroke="#8a7f66" stroke-width="3" stroke-dasharray="7 4"/><line x1="32" y1="24" x2="32" y2="40" stroke="#8a7f66" stroke-width="3"/><line x1="24" y1="32" x2="40" y2="32" stroke="#8a7f66" stroke-width="3"/></svg></div>
  </div>
  <div id="glass"></div>
  <div id="worldwrap">
    <svg id="world" viewBox="0 0 1280 596" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="sound"></div>
    <div id="dampanel"><div class="fall" style="width:22px;height:70px;border:1px solid rgba(222,214,196,.4);position:relative;margin:2px auto 8px;cursor:ns-resize;background:none"><div class="leaf" style="position:absolute;left:1px;right:1px;bottom:0;background:rgba(157,179,189,.55);height:100%"></div></div><div class="rel">release</div><div class="shut">keep holding</div><div class="bare" style="background:none;border:1.5px dashed rgba(222,214,196,.45)"></div></div>
    <div id="teach"></div>
    <div id="panel">
      <svg id="pv" style="position:absolute;inset:0;width:100%;height:100%"></svg>
      <div id="closer"><svg viewBox="0 0 26 26"><line x1="5" y1="5" x2="21" y2="21" stroke="#ddd6c4" stroke-width="2"/><line x1="21" y1="5" x2="5" y2="21" stroke="#ddd6c4" stroke-width="2"/></svg></div>
    </div>
    <div id="tetraov">
      <svg id="netview" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="faceview">
        <div id="facehost"></div>
      </div>
      <div id="foldback"><svg viewBox="0 0 34 30"><polygon points="17,4 4,26 30,26" fill="none" stroke="#7a6840" stroke-width="2"/></svg></div>
      <div id="stonepane">
        <div class="closep"><svg viewBox="0 0 18 18"><line x1="3" y1="3" x2="15" y2="15" stroke="#7a6840" stroke-width="2"/><line x1="15" y1="3" x2="3" y2="15" stroke="#7a6840" stroke-width="2"/></svg></div>
        <div class="src"></div>
        <textarea></textarea>
        <input type="text">
        <div class="lines"></div>
      </div>
    </div>
    <textarea id="field" spellcheck="false" style="display:none"></textarea>
  </div>
</div>
<script>
/* NESI — the 2D deposit. Laws carried from store.gd / look.gd / THE_FLOOR_2D:
   100 words per interval (THE AUTHORITY) · tank capacity 12, level rendered 0..1 only ·
   fixed charge composition, never derived from the words · deletion never un-banks ·
   three fractions: bedload sinks fast→deep, suspended hangs→ground, dissolved passes→lake ·
   three outputs at every station · hold is the default and costs no click ·
   set-it-down does nothing, on purpose · the deep never renders · no number reaches the player ·
   verbatim only · quitting mid-sentence loses nothing · nothing reaches outward. */
"use strict";
/* WORDS_PER_INTERVAL removed — superseded by the intake's per-sentence arrival,
   Kevin's ruling 2026-08-11, verbatim in BUILD_RECORD. Nothing in this file counts
   words anymore. The sentence is the arrival. TANK_CAPACITY is a rendering ceiling,
   not a banking limit — nothing is ever swallowed. */
const TANK_CAPACITY=12, DAM_AT=0.46, GROUND_AT=0.42;
const DESCENT=3400, RUNOUT=2200, BURN_AT=3400, RELAX=7000, RIM=1.0, REACH=150;
const APEX=[640,58], LEFT=[350,554], RIGHT=[930,554], CENTER=[(640+350+930)/3,(58+554+554)/3];
const dayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
/* the machine never writes the live store. The scratch door has two forms:
   ?scratch=1 / #scratch on the URL, and enterScratch() in-page — the second exists
   because the browser pane strips BOTH query and hash from file: URLs, found
   2026-08-11 when a test wrote the live store through the silently-absent door.
   A harness MUST call enterScratch() and check its return before any write. */
let KEY=(location.search.indexOf("scratch=1")>=0||location.hash.indexOf("scratch")>=0)?"nesi2d_scratch":"nesi2d";
function enterScratch(){
  KEY="nesi2d_scratch";
  S={banked:0,tank:[],grounds:[0,0,0],lake:0,cycles:0,sediment:[[],[],[]],pools:[[],[],[]],lean:0,scorch:[false,false,false],tornAt:0,writing:{},nextN:1,run:1,standing:[],lensWater:[0,0,0],regionNames:["","",""],regionAsked:[false,false,false],descended:[],watermark:0,working:null,compost:[],forest:[],gateOpen:[1,1,1],life:[0,0,0],
   wt:{load:0,sorted:0,spin:0,tune:false,warm:false,form:"bed",fog:0}};
  return KEY;
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){S=null}
if(!S)S={banked:0,tank:[],grounds:[0,0,0],lake:0,cycles:0,sediment:[[],[],[]],pools:[[],[],[]],lean:0,scorch:[false,false,false],tornAt:0,writing:{}};
if(!S.writing)S.writing={};
if(!S.lensWater)S.lensWater=[0,0,0];
if(!S.nextN)S.nextN=1;
if(!S.standing)S.standing=[]; /* the standing water: intervals above the brim, queued unseen */
if(!S.run)S.run=1;
if(!S.regionNames)S.regionNames=["","",""];
if(!S.linesList)S.linesList=[]; /* the hand-made ties between stones — {a,b} by n */
if(!S.regionAsked)S.regionAsked=[false,false,false];
/* THE SOIL AND THE FOREST (ported from nesi/conductor/soil.py + forest.py, 2026-08-11)
   — reframed single-player: no "does not obligate the receiver," no second party, no
   network. What is dropped to the lake (dissolved fraction, the fraction that already
   "passes through everything") composts. After a further cycle of light has run — the
   world's own existing clock, not a new wall-clock — a composted line grows into an
   ember the SAME player can gather back into the tank by clicking the lake. Order is
   arrival, never worth (forest.py's grove law); no score, rank, or featured field
   anywhere on a compost or ember record; verbatim text only (law 4/5). */
if(!S.compost)S.compost=[];   // {text, kind, at: cycles-at-composting} — the bed
if(!S.forest)S.forest=[];     // {text, kind, grown_at} — grown, arrival-ordered, pickable
/* THE FALL (ported from nesi/world3d/scripts/dam.gd, 2026-08-11) — release height as a
   second decision at the dam, riding the existing single-drag grammar (FK2/FK3 honored:
   all held stones stay visible, one flagged-variant chassis, merge-in-written-order,
   settling-is-the-taking — none of that chassis is touched). gateOpen[i] in [0,1], 1 by
   default so untouched saves and an unworked lever behave exactly as before. "Power
   comes from the fall, not the restriction": nothing is ever lost at release — every
   held stone still settles and is still recorded — but the SIZE of what the release
   grows (ground density, lake, lens water) scales with how far the gate was set open.
   Zero if nothing is moving; holding (never clicking release) is already zero. */
if(!S.gateOpen)S.gateOpen=[1,1,1];
/* THE ECOSYSTEM (ported from nesi/world3d/scripts/spire.gd, 2026-08-11) — "each
   terrain has its own ecosystems... when flow is restored the land fills with
   life." Source law carried whole: NOTHING HERE DOES LEDGER WORK — no counter,
   no unlock, no threshold that is better than another, never read as a number.
   Adaptation named: source drives life continuously from a HELD-OPEN gate
   (a per-frame release value); this world's dam has no held-open state, only
   discrete release events, so life is a pure function of RELEASE RATE instead —
   it grows when a spire's release lands (sized by how far THE FALL's gate was
   set, exactly like ground/lake already scale) and settles back down when a
   cycle passes at another spire without this one releasing. Purely visual —
   three indicator kinds by spire index (timber/reeds/thicket, spire.gd's own
   _kind() mapping), drawn only as shape, no label, no number. */
if(!S.life)S.life=[0,0,0];
/* THE FOUR TOOLS (ported from nesi/world3d/scripts/water_table.gd, 2026-08-11)
   — STILL/SPIN/TUNE/WARM at the existing water-table station (st0). Source
   law carried whole: none of load/sorted/form/fog is EVER shown as a number —
   they are the water's opacity and the shape on the basin floor, nothing else.
   EVERY TOOL UNDOES STILL: while any tool runs, the load stops settling on its
   own — STILL is what happens when the hand comes off, not a fourth button
   beside the other three. Adaptation named: source charges the basin from a
   continuously-flowing station and steps every physics frame; this basin
   charges from the same discrete "a charge has arrived" event the tray
   already uses, and steps only while this exact station's panel is open (an
   interval gated on panelOn&&curStation===0 — nothing runs, or advances any
   clock, while the player is elsewhere, so there is no law-8 risk here). */
if(!S.wt)S.wt={load:0,sorted:0,spin:0,tune:false,warm:false,form:"bed",fog:0};
/* THE UNCOVERING (ported from nesi/world3d/scripts/weather.gd, 2026-08-11) —
   asked-for-only, never volunteered; a non-numeric contour reveal that fades
   and leaves nothing behind unless asked again. Source law carried whole:
   "the erosion uncovers; it never creates" — it is a contour of a field that
   is already there. Adaptation named: source exposes hidden bedrock relief
   under the terrain; this world has no such hidden layer available to expose
   without touching THE DEEP (law 9: the deep never renders, and staying clear
   of it rules out the literal port). What IS already there but not normally
   drawn in this much detail is the spire's own ground density/lens-water —
   both already-visible state (rendered as the ellipse and the lens glyphs),
   never raw text, never a number shown. The uncovering here is a temporary,
   richer contour of THAT same already-shown state, fired only by an explicit
   ask (a double-click on a spire's ground — never on hover, never
   volunteered), held in ordinary (non-persisted) JS state so it carries no
   new wall-clock and never survives a reload — no law-8 risk. */
let uncover={};
function askUncover(i){
  if(uncover[i])return; /* already showing — asking again does not restack it */
  uncover[i]={start:performance.now()};
  uncoverTick();
}
function uncoverTick(){
  let any=false;
  const now=performance.now();
  for(const k in uncover){
    if((now-uncover[k].start)/1000>8){delete uncover[k];continue}
    any=true;
  }
  drawWorld();
  if(any)requestAnimationFrame(uncoverTick);
}
/* quarantine ethic: old saves migrate append-shape-only — nothing rewritten, nothing cleaned.
   THE TANK NOW HOLDS STONES DIRECTLY (the charge is the stone — supersession S3);
   old interval-charges flatten, their stones intact; the standing water folds in whole. */
S.sediment=S.sediment.map(arr=>arr.map(x=>typeof x==="string"?{n:0,text:x,kind:"self",stage:"settled"}:x));
S.tank=S.tank.flatMap(c=>c.n?[c]:(c.stones||(c.s||[]).map(t=>mkStone(t,"self"))));
S.tank=S.tank.concat((S.standing||[]).flatMap(c=>c.n?[c]:(c.stones||[])));S.standing=[];
if(S.working){const w=S.working.n?[S.working]:(S.working.stones||[]);S.tank=w.concat(S.tank);S.working=null}
if(S.watermark===undefined)S.watermark=0;
/* the stone: one text, one source, machine-immutable kind/who/asked; n is a name, never rendered.
   worked: set only by a hand-act (edit · merge · line · break · place) — never by time or view. */
function mkStone(text,kind,who,asked){return{n:S.nextN++,text,kind:kind||"self",who:who||"",asked:asked||"",run:S.run,stage:"held",seams:null,worked:false}}
if(!S.descended)S.descended=[]; /* below the tetra: the water the stations draw, in descent order */
S.tank.forEach(st=>{if(st.worked===undefined)st.worked=true}); /* pre-gate stones are grandfathered */
S.descended.forEach(st=>{if(st.worked===undefined)st.worked=true});
const field=document.getElementById("field");
field.value=S.writing[dayKey()]||"";
/* ---------- persistence: whole text every time; pad → read back → compare → commit.
   A bad write never destroys a good file. Silently. ---------- */
function save(){S.writing[dayKey()]=field.value;
  try{const j=JSON.stringify(S);
    localStorage.setItem(KEY+".pad",j);
    if(localStorage.getItem(KEY+".pad")===j){localStorage.setItem(KEY,j);localStorage.removeItem(KEY+".pad")}
  }catch(e){}}
setInterval(save,2000);
window.addEventListener("beforeunload",save);
window.addEventListener("blur",save);
/* ---------- intake: words become water ---------- */
/* THE BAND CUT — the intake's arrival, carried whole (supersession S1/S2, Kevin's
   ruling 2026-08-11). The cut fires live as you type, scanning only past the WATERMARK —
   the offset up to which text has already banked. A .!?… completes a sentence and the
   whole trailing cluster leaves with it; a period between two digits is inside a number;
   bare punctuation with no letter or digit is not a sentence. The page is NEVER cleared:
   banked text stays visible and the watermark moves past it. Deletion never un-banks —
   editing behind the watermark changes the page only; the stone is the water that
   already left, and the page remains his record. */
function bandCut(){
  const v=field.value;
  if(S.watermark>v.length)S.watermark=v.length; /* the page shrank; the stones already left */
  const isEnd=c=>".!?…".indexOf(c)>=0;
  let i=S.watermark, start=S.watermark;
  while(i<v.length){
    if(isEnd(v[i])){
      if(v[i]==="."&&/\d/.test(v[i-1]||"")&&/\d/.test(v[i+1]||"")){i++;continue}
      let j=i;while(j+1<v.length&&isEnd(v[j+1]))j++;
      const seg=v.slice(start,j+1).trim();
      if(seg.length>1&&/[A-Za-z0-9]/.test(seg))S.tank.push(mkStone(seg,"self"));
      start=j+1;S.watermark=j+1;i=j+1;
    } else i++;
  }
  renderTank();
}
field.addEventListener("input",bandCut);
field.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    const seg=field.value.slice(S.watermark).trim();
    if(seg.length>1&&/[A-Za-z0-9]/.test(seg)){
      S.tank.push(mkStone(seg,"self")); /* the override: banks whole, finished or not */
      S.watermark=field.value.length;
    } else if(!seg){S.run++} /* Enter on nothing held closes the run */
    renderTank();save();
  }
});
function drawStanding(){renderTank()} /* the standing water folded into the tank — S4 */
function renderTank(){ /* the text itself is the water: held stones + the unbanked band,
  as mass, derived each frame, never stored, never shown as a number (T3) */
  const mass=S.tank.reduce((a,s)=>a+s.text.length,0)+Math.max(0,field.value.length-S.watermark);
  const L=1-Math.exp(-mass/1400);
  const h=128*L;
  const r=document.getElementById("tankwater2");
  if(r){r.setAttribute("y",134-h);r.setAttribute("height",h)}
  if(typeof drawNet==="function"&&tetraOpen&&!faceOpen)drawNet();
}
/* ---------- THE WRITING TETRA (T1–T6, Kevin's design 2026-08-11, Cowan's rulings) ----------
   The tank IS the tetra seen small; click opens the net — centre THE TABLE, around it
   BLIND · TILES · SEQUENTIAL (the intake's four faces; no vertex is named). The writer
   is the bottom node. The text is the water and it rises as he types. A stone is worked
   only by a hand-act. Only worked stones can be carried down past the bottom node —
   an unworked stone hangs and will not carry (behaviour as the carrier, law 10). The
   drag is the decision; the release is the act; descent order is the downstream order. */
const tetraov=document.getElementById("tetraov"),netv=document.getElementById("netview"),
      facev=document.getElementById("faceview"),facehost=document.getElementById("facehost");
let tetraOpen=false,faceOpen=null;
/* one vertex downward (Kevin's mark 2026-08-11): the writer IS the bottom vertex */
const TA=[500,630],TB=[130,70],TC=[870,70];
const MAB=[(TA[0]+TB[0])/2,(TA[1]+TB[1])/2],MAC=[(TA[0]+TC[0])/2,(TA[1]+TC[1])/2],MBC=[(TB[0]+TC[0])/2,(TB[1]+TC[1])/2];
const NODE=TA; /* the writer — the bottom vertex itself */
function drawNet(){
  netv.innerHTML="";
  const en=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);(p||netv).appendChild(e);return e};
  /* the water rises inside the tetra as the text mass grows */
  const mass=S.tank.reduce((a,s)=>a+s.text.length,0)+Math.max(0,field.value.length-S.watermark);
  const L=1-Math.exp(-mass/1400);
  en("clipPath",{id:"netclip"}).appendChild(en("polygon",{points:[TA,TB,TC].map(p=>p.join(",")).join(" ")}));

  S.pools.forEach(p=>p.forEach(h=>(h.stones||[]).forEach(s=>{if(s.n===n)f=s})));

function mergeInPool(i,na,nb){

  const joined=mkStone(parts.map(p=>p.text).join(" "),parts[0].kind);
  joined.stage="sent";
  joined.seams=parts.map(p=>({n:p.n,text:p.text,kind:p.kind,who:p.who,asked:p.asked})); /* seams kept */
  found.forEach(f=>{f.st.stage="merged";f.h.stones=f.h.stones.filter(x=>x!==f.st)});

  parts.forEach(t=>{const st=mkStone(t,rock.kind,rock.who,rock.asked);st.stage="sent";S.pools[i][0].stones.push(st)});
  save();

   physics delta. */
const WT_SETTLE=0.06,WT_SPIN_STEP=0.34,WT_SPIN_DECAY=0.22,WT_SPIN_LO=0.30,WT_SPIN_HI=1.00,
      WT_SORT_RATE=0.30,WT_MIX_RATE=1.60,WT_FOG_RATE=0.34,WT_FOG_FADE=0.045;
function wtStep(dt){
  const w=S.wt;
  if(w.spin>0)w.spin=Math.max(0,w.spin-WT_SPIN_DECAY*dt);
  const running=w.spin>0||w.tune||w.warm;
  let want=w.form;
  if(w.spin>WT_SPIN_HI){ /* too fast: homogenizes */
    w.load=Math.min(1,w.load+WT_MIX_RATE*dt*0.5);
    w.sorted=Math.max(0,w.sorted-WT_MIX_RATE*dt);
    want="mixed";
  } else if(w.tune&&w.warm){ /* tune fights warm — convection tears the nodes apart */
    w.sorted=Math.max(0,w.sorted-WT_SORT_RATE*dt*0.6);
    want="mixed";
  } else if(w.spin>WT_SPIN_LO&&w.warm){ /* spin+warm: the spiral. its output is not in the basin — fog only */
    want="spiral"; w.fog=Math.min(1,w.fog+WT_FOG_RATE*dt);
  } else if(w.spin>WT_SPIN_LO){
    w.sorted=Math.min(1,w.sorted+WT_SORT_RATE*dt); want="ring";
  } else if(w.tune){
    w.sorted=Math.min(1,w.sorted+WT_SORT_RATE*dt); want="nodes";
  } else if(w.warm){
    w.sorted=Math.min(1,w.sorted+WT_SORT_RATE*dt); want="strata";
  } else if(!running){ /* STILL — the only tool that works by itself, pulling load out rather than rearranging it */
    if(w.load>0){w.load=Math.max(0,w.load-WT_SETTLE*dt);w.sorted=Math.min(1,w.sorted+WT_SETTLE*dt*0.5)}
    want="bed";

}

    mkBtn(W-74,"WARM",S.wt.warm,()=>{wtToggleWarm();buildPanel(0)});
  }
  if(st===1){ /* heliostat: turn the mirror; the beam picks the spire */
    for(let k=0;k<3;k++){
      const rx=ax-170+k*170;
      el("rect",{x:rx-20,y:ay-70,width:40,height:14,rx:3,fill:S.scorch[k]?"#5a3a30":"#c9b878",opacity:S.scorch[k]?0.9:0.8,"data-r":k},pv);
    }
    const m=el("g",{id:"mir"},pv);
    el("rect",{x:ax-34,y:ay+40,width:68,height:8,fill:"#c9b878"},m);
    m.setAttribute("transform","rotate("+((mirror-0.5)*70)+" "+ax+" "+(ay+44)+")");
    m.style.cursor="ew-resize";
    let dX=null;
    m.addEventListener("pointerdown",e=>{dX=e.clientX;m.setPointerCapture(e.pointerId)});
    m.addEventListener("pointermove",e=>{if(dX==null)return;mirror=Math.max(0,Math.min(1,mirror+(e.clientX-dX)/300));dX=e.clientX;
      m.setAttribute("transform","rotate("+((mirror-0.5)*70)+" "+ax+" "+(ay+44)+")");
      const k=mirror<0.34?0:(mirror>0.66?2:1);
      if(k!==beamOn){beamOn=k;beamT=performance.now()}
      else if(performance.now()-beamT>BURN_AT&&!S.scorch[k]){S.scorch[k]=true;save();buildPanel(1)} /* the receiver closes — scorched */
      if(!S.scorch[k])sel=k;
      pv.querySelectorAll(".beam").forEach(b=>b.remove());
      el("line",{x1:ax,y1:ay+44,x2:ax-170+k*170,y2:ay-56,stroke:"rgba(230,210,140,.7)","stroke-width":3,class:"beam"},pv);
    });
    m.addEventListener("pointerup",()=>{dX=null});
  }
  if(st===2){ /* membrane: pull the sheet; water rolls into the well */
    const anchors=[[ax-160,ay-40],[ax,ay+60],[ax+160,ay-40]];
    anchors.forEach(a=>el("circle",{cx:a[0],cy:a[1],r:6,fill:"#6b6250"},pv));
    const torn=Date.now()-S.tornAt<RELAX; /* wall clock: a saved tear heals on real time, not session time */
    const sheet=el("path",{d:"M"+anchors[0]+" Q "+(ax+pull[0])+" "+(ay+pull[1])+" "+anchors[2]+" L "+anchors[1]+" Z",
      fill:torn?"rgba(168,154,124,.15)":"rgba(168,154,124,.45)",stroke:"#a89a7c","stroke-width":2,"stroke-dasharray":torn?"6 5":"none"},pv);
    sheet.style.cursor="move";
    let d0=null;
    sheet.addEventListener("pointerdown",e=>{d0=[e.clientX,e.clientY];sheet.setPointerCapture(e.pointerId)});
    sheet.addEventListener("pointermove",e=>{if(!d0)return;
      pull[0]+=e.clientX-d0[0];pull[1]+=e.clientY-d0[1];d0=[e.clientX,e.clientY];
      const r=Math.hypot(pull[0],pull[1]);
      if(r>REACH){S.tornAt=Date.now();pull=[0,0];save();buildPanel(2);return} /* the tear: it opens */
      sheet.setAttribute("d","M"+anchors[0]+" Q "+(ax+pull[0])+" "+(ay+pull[1])+" "+anchors[2]+" L "+anchors[1]+" Z");
      let best=0,bd=1e9;anchors.forEach((a,k)=>{const dd=Math.hypot(a[0]-ax-pull[0],a[1]-ay-pull[1]);if(dd<bd){bd=dd;best=k}});
      sel=best;});
    sheet.addEventListener("pointerup",()=>{d0=null});
    if(torn)setTimeout(()=>{if(panelOn&&curStation===2)buildPanel(2)},RELAX-(Date.now()-S.tornAt)+50);
  }
  if(st===3){ /* the filters: laid out already separated; which one goes where is entirely the hand's */ }
  /* the three spire mouths (the act's own output) */
  for(let k=0;k<3;k++){
    const mx=W*0.25+k*W*0.25;
    const m=document.createElementNS(NS,"g");
    el("circle",{cx:mx,cy:H*0.56,r:26,fill:"none",stroke:(st===1&&S.scorch[k])?"rgba(120,70,60,.5)":"rgba(222,214,196,"+((st===3||sel===k)?0.85:0.28)+")","stroke-width":2,"stroke-dasharray":"5 4",class:"mouth-c","data-dest":k},pv);
  }
  /* the lake plate and the bare plate — always on screen */
  el("rect",{x:W*0.30,y:H*0.78,width:70,height:42,rx:4,fill:"rgba(96,132,148,.4)",stroke:"rgba(222,214,196,.5)","data-dest":"lake"},pv);
  el("rect",{x:W*0.58,y:H*0.78,width:70,height:42,rx:4,fill:"none",stroke:"rgba(222,214,196,.5)","data-dest":"set"},pv);
  /* the tray: three fractions by their own behavior — empty if nothing has arrived */
  chips=[];
  if(charge){
    const cy=H*0.70;
    mkChip("bed",W*0.14,cy,st);mkChip("sus",W*0.14,cy-46,st);mkChip("dis",W*0.14,cy-92,st);
  }
}
function mkChip(frac,x,y,st){
  const g=document.createElementNS(NS,"g");
  g.setAttribute("transform","translate("+x+","+y+")");g.style.cursor="grab";
  if(frac==="bed")el("polygon",{points:"0,-9 8,0 0,9 -8,0",fill:"#2e2921"},g);
  if(frac==="sus")el("circle",{cx:0,cy:0,r:8,fill:"rgba(170,158,128,.85)"},g);
  if(frac==="dis")el("circle",{cx:0,cy:0,r:8,fill:"none",stroke:"rgba(150,170,180,.95)","stroke-width":2.5},g);
  pv.appendChild(g);
  let drag=null,px=x,py=y;
  /* suspended hangs and wanders; bedload sits; the ring drifts */
  if(frac==="sus"){let t=0;setInterval(()=>{if(drag||!panelOn)return;t+=0.05;g.setAttribute("transform","translate("+(px+Math.sin(t)*7)+","+(py+Math.cos(t*0.7)*4)+")")},60)}
  g.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY];g.setPointerCapture(e.pointerId)});
  g.addEventListener("pointermove",e=>{if(!drag)return;px+=e.clientX-drag[0];py+=e.clientY-drag[1];drag=[e.clientX,e.clientY];
    g.setAttribute("transform","translate("+px+","+py+")")});
  g.addEventListener("pointerup",e=>{drag=null;
    const W=panel.clientWidth,H=panel.clientHeight;
    let dest=null;
    if(py>H*0.74&&px>W*0.28&&px<W*0.42)dest="lake";
    else if(py>H*0.74&&px>W*0.56&&px<W*0.70)dest="set";
    else if(py>H*0.44&&py<H*0.66){
      const k=Math.round((px-W*0.25)/(W*0.25));
      if(k>=0&&k<=2){
        if(st===3)dest=k; /* the hand routes directly */
        else dest=sel;    /* the act chose the spire; the mouth is where it leaves */
        if(st===0&&Math.abs(S.lean)>RIM)dest="deep";       /* slop-over: past the rim, over the edge */
        if(st===1&&S.scorch[dest])dest="deep";              /* a scorched receiver passes it through, doing nothing it can keep */
        if(st===2&&Date.now()-S.tornAt<RELAX)dest="deep"; /* a torn membrane holds nothing */
      }
    }
    if(dest!==null){g.remove();
      const done=chargeTake(frac);
      /* all three fraction-chips belong to the one charge stone (law 4: composition never
         derived from the words) — its text rides along regardless of which fraction is
         dropped, which is what lets a lake-drop compost (soil.py) no matter the fraction */
      route(frac,dest,charge?charge.stones:null);
      if(done){if(st===0)wtDischarge();charge=null;closeQuiet()}
    }});
}
let taken={};
function chargeTake(frac){taken[frac]=true;return taken.bed&&taken.sus&&taken.dis}
function closeQuiet(){
  /* the tray refills in an open station: route a charge and the next loads without
     closing and reopening. Twenty charges become one sitting. The closer still
     leaves anytime; an empty tank closes quietly on its own. */
  taken={};S.working=null;
  drawStanding();
  if(S.descended.length&&panelOn){
    charge={stones:[S.descended.shift()]};S.working=charge;save();
    drawStanding();buildPanel(curStation);return;
  }
  panel.classList.remove("on");panelOn=false;save();
}
/* ---------- the second mouth: given and fetched enter coarse, by his hand ----------
   Paste the text; the small line above is who (a given), the one below is asked (a fetched).
   Whichever carries words decides the kind. One rock, verbatim, source immutable from entry.
   The file itself never fetches anything — he carried it in. */
const mouth2=document.getElementById("mouth2");
mouth2.addEventListener("click",()=>{
  if(document.getElementById("pastepane"))return;
  const pane=document.createElement("div");pane.id="pastepane";
  pane.style.cssText="position:absolute;z-index:8;left:24px;top:24px;right:24px;bottom:24px;background:rgba(74,67,54,.97);border:1px solid #2e2a22;padding:26px;display:flex;flex-direction:column;gap:10px";
  const who=document.createElement("input");
  who.style.cssText="width:240px;background:rgba(255,255,255,.08);border:none;border-bottom:1px dashed rgba(222,214,196,.5);color:#ddd6c4;font-family:Georgia,serif;font-size:13px;padding:4px 6px;outline:none";
  const asked=document.createElement("input");
  asked.style.cssText=who.style.cssText.replace("dashed","dotted");
  const ta=document.createElement("textarea");
  ta.style.cssText="flex:1;background:rgba(255,255,255,.05);border:1px solid rgba(222,214,196,.3);color:#e6e0d0;font-family:Georgia,serif;font-size:14px;line-height:1.8;padding:12px;outline:none;resize:none";
  const row=document.createElement("div");row.style.cssText="display:flex;gap:10px";
  const inBtn=document.createElement("div");
  inBtn.style.cssText="width:56px;height:36px;border:2px solid rgba(222,214,196,.6);background:rgba(112,146,160,.35);cursor:pointer";
  const xBtn=document.createElement("div");
  xBtn.style.cssText="width:36px;height:36px;border:1px solid rgba(222,214,196,.4);cursor:pointer";
  row.appendChild(inBtn);row.appendChild(xBtn);
  pane.appendChild(who);pane.appendChild(asked);pane.appendChild(ta);pane.appendChild(row);
  document.getElementById("worldwrap").appendChild(pane);ta.focus();
  pane.addEventListener("keydown",ev=>ev.stopPropagation());
  xBtn.addEventListener("click",()=>pane.remove());
  inBtn.addEventListener("click",()=>{
    const t=ta.value.trim();if(!t){pane.remove();return}
    const kind=asked.value.trim()?"fetched":"given";
    S.tank.push(mkStone(t,kind,who.value.trim(),asked.value.trim())); /* one rock, coarse — nothing is ever swallowed */
    renderTank();save();
    pane.remove();
  });
});
/* ---------- THE ROOM CHASSIS (the resynthesis, R1/R4 — one species, and the audit
   is the chassis: a room has one job · is readable before opening (threshold as
   behaviour) · opens over the world · closes lossless · carries set-down furniture ·
   has an empty state that costs the absent person nothing (BUILD LAW 13) · and WAITS,
   never waits FOR you. The dam is the flagged second species: it governs.
   Registry is the contract; auditRooms() (scratch) walks it. */
const ROOMS=[
 {id:"st0",job:"the water table — handling",gov:false},
 {id:"st1",job:"the heliostat — handling",gov:false},
 {id:"st2",job:"the membrane — handling",gov:false},
 {id:"st3",job:"the filters — handling",gov:false},
 {id:"dam",job:"the dam — GOVERNING (second species, flagged, one chassis)",gov:true},
 {id:"f_seq",job:"sequential — the page",gov:false},
 {id:"f_blind",job:"blind — the line",gov:false},
 {id:"f_tiles",job:"tiles — the held, in written order",gov:false},
 {id:"f_table",job:"the table — everything together",gov:false}
];
function auditRooms(){ /* scratch-only; the two-test audit (spec edit 7) */
  if(KEY.indexOf("scratch")<0)return "audit runs in scratch only";
  const r={law13:[],waits:[]};
  /* law 13: every surface opens on empty state without error or demand */
  const keep={tank:S.tank,descended:S.descended,pools:S.pools.map(p=>p)};
  S.tank=[];S.descended=[];S.pools=[[],[],[]];
  for(let i=0;i<4;i++){openStation(i);r.law13.push("st"+i+":"+(panelOn?"opens-empty":"FAIL"));closePanel()}
  openTetra();["seq","blind","tiles","table"].forEach(f=>{openFace(f);r.law13.push("f_"+f+":"+(faceOpen===f?"opens-empty":"FAIL"));closeFaceInner()});
  closeTetra();
  S.tank=keep.tank;S.descended=keep.descended;S.pools=keep.pools;
  /* waits-test: static — no notification/alert/timer-driven surfacing exists.
     Tokens assembled so the audit cannot match its own source. */
  const src=document.documentElement.outerHTML;
  const demand=[["new ","Notifi","cation("],["window.","aler","t("],["confir","m("]].some(p=>src.indexOf(p.join(""))>=0);
  r.waits.push(demand?"FAIL: demand primitive found":"no demand primitives");
  return JSON.stringify(r);
}
/* ---------- THE TEACHING (Kevin's ruling 2026-08-11: "The game can teach the user
   how to use it"). The captions name the world and its mechanics — they never advise,
   never score, never read or mention what he wrote. A museum caption, not a coach. */
const teach=document.getElementById("teach");
function say(t){if(t){teach.textContent=t;teach.style.display="block"}else teach.style.display="none"}
const TEACH={
 tank:"THE WRITING TETRA — the tank is the tetra seen small. Click to open it: four faces, your writing rising inside as water. Only stones your hand has worked can be carried down past the bottom node to the stations.",
 f_blind:"BLIND — a single line. Finish a sentence and it leaves as a stone; nothing accumulates in view.",
 f_seq:"SEQUENTIAL — the page. Everything visible as typed; the page is never cleared. Finished sentences bank as stones; Enter banks what you hold; Enter on empty closes the sitting.",
 f_tiles:"TILES — your held stones in written order. Click one to edit it; the small square opens the stone's own pane — full text, its source, your mark, its ties. An edit or a mark is work, and work is what lets a stone descend.",
 f_table:"THE TABLE — everything together. Drag a stone onto another to merge them (written order, seams kept). Double-click two stones to tie a line. The small square opens the stone's pane. Every one of these acts is work.",
 st0:"THE WATER TABLE — a station. Open it, then lean the tray: water leaves by the lowest spout, and the spout picks which spire. Lean too far and it slops over the edge, to the deep.",
 st1:"THE HELIOSTAT — a station. Turn the mirror: the beam picks the spire. Hold the beam on one receiver too long and it scorches shut — and stays shut.",
 st2:"THE MEMBRANE — a station. Pull the sheet toward an anchor: a well forms and the water follows it. Pull past its reach and it tears; it heals in its own time.",
 st3:"THE FILTERS — a station. The three fractions arrive already separated: the dark diamond sinks, the soft disc hangs, the ring passes through. Your hand routes each one.",
 mouth2:"THE SECOND MOUTH — writing that isn't yours enters here. Paste it, name who gave it (first line) or what you asked for (second line); it arrives as one coarse rock.",
 dam:"A DAM — water you sent down a spire waits here. Holding is free and asks nothing. Click to see what it holds: drag stones together to merge them, click one to edit it, double-click a rock to break it, or release everything downstream. The small bar above release is the fall — how far the gate is set open; a wider fall grows more, a narrow one grows less, and nothing is ever lost either way.",
 ground:"THE GROUND — released water settles here as your own sentences. Each one stands as a lens: it holds water, grows with what lands, and sends light back up. Click to drop a sounding line and read one.",
 lake:"THE LAKE — what was dropped, and what passed through everything, gathers at the center. Below it is the deep, which is never shown. What composts here may grow into something you can click to gather back into the tank — nothing to gather is a lawful, silent state.",
 field:"THE WRITING FIELD — write; nothing else is asked. Finish a sentence and it becomes water in the tank. Enter banks what you're holding, finished or not; Enter on an empty line closes the sitting. The page is never cleared — your words stay, and their water has already left. Esc lays this sheet aside; Esc brings it back. Nothing you write is read, judged, or rewritten — it only ever becomes ground."
};
["tank","st0","st1","st2","st3","mouth2"].forEach(id=>{
  const n=document.getElementById(id);if(!n)return;
  n.addEventListener("mouseenter",()=>say(TEACH[id]));
  n.addEventListener("mouseleave",()=>say(""));
});
field.addEventListener("mouseenter",()=>say(TEACH.field));
field.addEventListener("mouseleave",()=>say(""));
world.addEventListener("mousemove",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("dam"))say(TEACH.dam);
  else if(t.classList&&t.classList.contains("ground"))say(TEACH.ground);
  else if(t.tagName==="circle"&&t.getAttribute("cx")==String(CENTER[0]))say(TEACH.lake);
  else say("");
});
world.addEventListener("mouseleave",()=>say(""));
/* ---------- boot: the program opens in a writing field; nothing precedes it.
   The field is SEQUENTIAL, a face of the tetra — so the tetra opens onto it. ---------- */
if(S.watermark>field.value.length)S.watermark=field.value.length;
drawWorld();drawStanding();
openTetra();openFace("seq");
</script>
