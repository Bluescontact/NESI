<!doctype html>
<!-- NESI · THE WORLD — BUILD_SPEC_v1, stages S0 through S7.
     Generated by tools/nesi_build_world.py. Do not edit the generated file;
     edit this template and rebuild.

     Everything rendered here derives from four inputs and nothing else:
       CANON   patterns/ (172)          → bedrock masses
       GRAIN   declared lineage (344)   → bedding
       WRITING what you type            → deposit + water level
       APEX    which of four is up      → which potential material minimizes

     The system writes no words. Every word you see after the door is yours. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>&nbsp;</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#f2efe8}
body{font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;color:#2e2820}

/* ---- S0 · THE HEADWATERS ---- */
#head{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity 2s ease}
#water{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,rgba(70,98,111,.20),rgba(70,98,111,.06));transition:height 1s cubic-bezier(.22,.61,.36,1)}
#wline{position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(70,98,111,.30);transition:bottom 1s cubic-bezier(.22,.61,.36,1)}
#pen{position:relative;width:min(660px,86vw);max-height:74vh;overflow-y:auto;font-size:19px;line-height:2.05;
  background:transparent;border:0;outline:0;resize:none;color:#2e2820;font-family:inherit;caret-color:#7a5a10}
#pen::-webkit-scrollbar{width:0}

/* ---- the world ---- */
#world{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 2.4s ease}
#world.here{opacity:1;pointer-events:auto}
canvas{position:absolute;inset:0;display:block;cursor:grab}
canvas.drag{cursor:grabbing}
#apex{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:14px;opacity:0;transition:opacity 1.2s ease .6s}
#world.here #apex{opacity:1}
.v{width:10px;height:10px;border:1px solid rgba(70,98,111,.55);transform:rotate(45deg);cursor:pointer;transition:background .4s}
.v:hover{border-color:rgba(70,98,111,1)}
.v.on{background:rgba(70,98,111,.65)}
#read{position:absolute;left:50%;top:26px;transform:translateX(-50%);max-width:min(560px,84vw);
  font-size:13px;line-height:1.7;color:#2e2820;background:rgba(242,239,232,.94);border:1px solid rgba(70,98,111,.30);
  padding:11px 15px;opacity:0;pointer-events:none;transition:opacity .5s}
#read.on{opacity:1}
</style>
</head>
<body>

<div id="head">
  <div id="water"></div><div id="wline"></div>
  <textarea id="pen" spellcheck="false" autocomplete="off" autofocus></textarea>
</div>

<div id="world">
  <canvas id="c"></canvas>
  <div id="read"></div>
  <div id="apex"></div>
</div>

<script>
'use strict';
const DATA = /*WORLD_DATA*/;

/* ============================ S0 · THE HEADWATERS ========================= */
/* THE FOUR THRESHOLDS — Kevin's naming, 2026-08-05, verbatim:
     "200 words opens up a limited world, 500 word opens a landscape,
      750 words opens the whole world and tools. 1000 words unlocks the
      heliostat."
   This replaces the single DRAW at 110. The world does not ask you to write;
   it is simply smaller until you do. Nothing is withheld as a reward — the
   water is low, so less is above it.
   VOLUME ONLY (k6, marked 2026-08-05): two hundred words about nothing opens
   exactly as much as two hundred words about everything. Nothing here reads
   what any of it says. */
const STAGES = [
  {w:200,  name:'a limited world'},
  {w:500,  name:'a landscape'},
  {w:750,  name:'the whole world and tools'},
  {w:1000, name:'the heliostat'}
];
const DRAW = STAGES[0].w;               // the first threshold IS the draw

/* THE STORE, JOINED (Kevin's mark 2026-08-05: "JOIN THE STORE").
   nesi_world_stones is the one deposit path. THE BAR (nesi/world/logbook.html)
   writes it, export_stores.py cuts stones.json from it, shore_stones.gd reads
   that on the Shore. This world settles the SAME material instead of a private
   copy. DRAFT is only the unsent pen — the fragment left in the bar. */
const SHARED='nesi_world_stones';
const DRAFT='nesi.world.draft';
const QUARRY='nesi.quarry.v1';

const pen=document.getElementById('pen'), head=document.getElementById('head');
const water=document.getElementById('water'), wline=document.getElementById('wline');
const world=document.getElementById('world'), readout=document.getElementById('read');
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let afloat=false, W=0,H=0;

function stones(){
  try{ const s=JSON.parse(localStorage.getItem(SHARED)); return Array.isArray(s)?s:[]; }
  catch(e){ return []; }
}
function addStones(texts){
  if(!texts.length) return stones();
  const s=stones(), ts=new Date().toISOString();
  texts.forEach(t=>s.push({text:t, ts:ts, src:'world'}));
  try{ localStorage.setItem(SHARED, JSON.stringify(s)); }catch(e){}
  return s;
}
/* Stone text is carried VERBATIM and never re-cut: the Bar's thought-merge is
   Kevin's own granularity choice, and re-splitting it here would overrule it. */
const stoneTexts = () => stones().map(s=>String(s.text||'')).filter(t=>t.trim().length>1);

const words = s => (s.trim().match(/\S+/g)||[]).length;

/* THE SECOND INTAKE — THE QUARRY. Kevin, 2026-08-05, verbatim:
     "Two intakes on for copy and past external... That comes in as quarried
      rock that gets broken into gravel."
   Your writing is water: it carries, settles, finds its own level. External
   material was cut somewhere else, by someone else, and arrives as ROCK. It
   cannot settle until it is broken. Gravel keeps its edges — broken, never
   dissolved.
   THE GUARD THIS BUILDS IN: pasted material never counts toward the four
   thresholds. The thresholds are what YOU wrote. Nothing from outside opens
   your world, and nothing pasted in becomes bedrock by arriving. */
let ROCK=[];              // quarried, unbroken
let GRAVEL=[];            // broken, moving with the river
function loadQuarry(){
  try{ const q=JSON.parse(localStorage.getItem(QUARRY)); return Array.isArray(q)?q:[]; }
  catch(e){ return []; }
}
function saveQuarry(texts){
  try{ localStorage.setItem(QUARRY, JSON.stringify(texts)); }catch(e){}
}
function quarry(text){
  const t=String(text||'').trim();
  if(t.length<2) return;
  const all=loadQuarry(); all.push({text:t, ts:new Date().toISOString()});
  saveQuarry(all);
  seedRock([{text:t}]);
}
pen.addEventListener('paste',e=>{
  const t=(e.clipboardData||window.clipboardData);
  if(!t) return;
  const s=t.getData('text');
  if(!s || !s.trim()) return;
  e.preventDefault();                       // it does not enter the pen as your words
  quarry(s);
  rise();
});

/* PRIOR_WORDS — words already in the shared store count toward the thresholds.
   The catchment does not empty between sessions. */
let PRIOR_WORDS = 0;
let stage = -1;                             // -1 = still at the headwaters
function written(){ return PRIOR_WORDS + words(pen.value); }
function stageFor(w){ let s=-1; for(let i=0;i<STAGES.length;i++) if(w>=STAGES[i].w) s=i; return s; }

function rise(){
  const w = written();
  const f = Math.min(w/DRAW, 1);
  const h = Math.pow(f,1.4) * innerHeight*0.62;
  water.style.height=h+'px'; wline.style.bottom=h+'px';
  const s = stageFor(w);
  if(s>stage){ stage=s; if(afloat) openStage(); }
  if(f>=1 && !afloat) lift();
}
pen.addEventListener('input',()=>{ try{localStorage.setItem(DRAFT,pen.value);}catch(e){} rise(); });

/* ======================= D1 · BEDROCK  ·  D2 · GRAIN ===================== */
/* Positions come from declared lineage only. A pattern with no declared kin
   has no position and is not in the bedrock — under b4 it is flat ground. */
const N = DATA.nodes.filter(n=>n.grounded);
const IX = {}; N.forEach((n,i)=>IX[n.slug]=i);
const E = DATA.edges.filter(e=>IX[e.from]!==undefined && IX[e.to]!==undefined)
                    .map(e=>({a:IX[e.from], b:IX[e.to], dir:e.dir}));

N.forEach((n,i)=>{
  const a = i*2.399963, r = 26*Math.sqrt(i);   // phyllotaxis seed, then relaxed
  n.x=Math.cos(a)*r; n.y=Math.sin(a)*r; n.vx=0; n.vy=0;
  n.h = 26 + n.hardness*150 + n.mass*34;       // relief height
  n.rad = 70 + n.mass*90;
});

function relax(steps){                          // force-directed over the grain
  for(let s=0;s<steps;s++){
    for(const e of E){
      const A=N[e.a],B=N[e.b];
      let dx=B.x-A.x, dy=B.y-A.y, d=Math.hypot(dx,dy)||1;
      const f=(d-190)*0.010; dx/=d; dy/=d;
      A.vx+=dx*f; A.vy+=dy*f; B.vx-=dx*f; B.vy-=dy*f;
    }
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      const A=N[i],B=N[j];
      let dx=B.x-A.x, dy=B.y-A.y, d2=dx*dx+dy*dy; if(d2<1)d2=1;
      if(d2<90000){ const d=Math.sqrt(d2), f=2600/d2; dx/=d;dy/=d;
        A.vx-=dx*f;A.vy-=dy*f; B.vx+=dx*f;B.vy+=dy*f; }
    }
    for(const n of N){ n.vx*=0.82; n.vy*=0.82; n.x+=n.vx; n.y+=n.vy; }
  }
}

/* D3 · TERRAIN — bedrock relief sampled anywhere */
function ground(x,y){
  let h=0;
  for(const n of N){
    const dx=x-n.x, dy=y-n.y, d2=dx*dx+dy*dy, r2=n.rad*n.rad;
    // a worn mass is a smaller hill — erosion changes the terrain itself,
    // so where material settles changes as the ground is uncovered
    if(d2<r2*4) h += n.h*(1-n.worn)*Math.exp(-d2/(r2*0.9));
  }
  return h;
}

/* ============================ D4 · GRAVITY ============================== */
/* Not a vector — which scalar field material minimizes. Four potentials,
   one terrain. None of them reads what a sentence says. */
const APEX=['AS IT CAME','BY KINSHIP','BY ECHO','BY SOLITUDE'];
let apex=1;

/* THE BASIN — the lake is the centre of the map, so the whole world slopes
   inward. This is what "running down" is: left alone, you end up in the middle.
   Without it the potentials are flat wherever there is no bedrock, material
   never moves, and the four gravities do nothing at all. */
function basin(x,y){ return Math.hypot(x,y)*0.075; }

function potential(p,x,y){
  const b=basin(x,y);
  switch(apex){
    case 0: return b + (x*0.05 - p.t*520);        // time is the slope: early upstream
    case 1: return b - ground(x,y)*2.2;           // pools in canon's own valleys
    case 2: return b - density(x,y)*150;          // deposit draws deposit
    case 3: return b + density(x,y)*190 - ground(x,y)*0.5;  // repels — open ground
  }
}

/* ============================ D5 · DEPOSIT ============================== */
/* Sentences are particles. Verbatim, never measured, never compared. */
let P=[];
function sentences(t){
  const out=[];
  t.split(/\n+/).forEach(b=>{
    (b.match(/[^.!?…]+[.!?…]*/g)||[]).forEach(s=>{ const v=s.trim(); if(v.length>1) out.push(v); });
  });
  return out;
}
/* ROCK AND GRAVEL — the second intake's material.
   Rock enters at the quarry face (mountain side) and does not settle. Each wash
   breaks rock into gravel; gravel then moves with the river like deposit, but is
   drawn with its edges because it never dissolved. */
function seedRock(items){
  for(const it of items){
    ROCK.push({txt:String(it.text||''),
      x: 520 + Math.random()*90, y:(Math.random()-0.5)*300,
      vx:0, vy:0, a:Math.random()*6.283});
  }
}
function breakRock(force){
  if(!ROCK.length) return;
  const r=ROCK.shift();
  // broken, not dissolved: the text is cut into pieces and every piece is kept
  const parts=(r.txt.match(/[^.!?…,;:]+[.!?…,;:]*/g)||[r.txt]).map(s=>s.trim()).filter(s=>s.length>1);
  for(let i=0;i<parts.length;i++){
    GRAVEL.push({txt:parts[i], t:i/Math.max(1,parts.length-1),
      x:r.x+(Math.random()-0.5)*40, y:r.y+(Math.random()-0.5)*40,
      vx:-1.4*(force||1), vy:(Math.random()-0.5)*0.8});
  }
}

/* seed() takes the material as it stands in the shared store — a list of
   verbatim texts — not a private blob of this page's own text. */
function seed(ss){
  if(typeof ss==='string') ss=sentences(ss);
  // what arrives settles over the ground — writing is the depositing half
  if(typeof bury==='function' && ss.length) bury(Math.min(0.5, ss.length*0.03));
  // Enter upstream — off the edge of the bedrock — and run down into the world.
  P = ss.map((s,i)=>({
    txt:s, i, t: ss.length>1 ? i/(ss.length-1) : 0,
    x:-720 + Math.random()*60, y:(i-ss.length/2)*26 + Math.random()*30,
    vx:2.2, vy:0
  }));
}
function density(x,y){
  let c=0; for(const p of P){ const dx=p.x-x, dy=p.y-y; if(dx*dx+dy*dy<26000) c++; }
  return c;
}

/* ============================ D6 · WATER =============================== */
let level=0;
function waterLevel(){ return level; }

/* ============================ D9 · EROSION =============================
   S6. The world begins BURIED. Nothing puts a pattern on a Spire — the wash
   takes the softer material away and what is left standing was always there.

   Two quantities, both persisted, both cumulative across sessions:
     buried[i]  1 → 0   how much cover is still over this mass
     worn[i]    0 → 1   how much of the mass itself the water has taken

   Hardness is resistance. Soft rock wears while the cover is coming off, so
   by the time the ground is clear the soft masses are gone and the hard ones
   are standing clear. A Spire is what outlasted, not what was drawn. */
const ERO='nesi.erosion.v1';
let wash=0, washes=0;

N.forEach(n=>{ n.buried=1; n.worn=0; });
(function loadErosion(){
  try{
    const s=JSON.parse(localStorage.getItem(ERO)||'null');
    if(s&&s.n){ N.forEach(n=>{ const v=s.n[n.slug]; if(v){ n.buried=v[0]; n.worn=v[1]; } });
      washes=s.w||0; }
  }catch(e){}
})();
function saveErosion(){
  try{
    const n={}; N.forEach(x=>{ n[x.slug]=[+x.buried.toFixed(4), +x.worn.toFixed(4)]; });
    localStorage.setItem(ERO, JSON.stringify({n, w:washes}));
  }catch(e){}
}

function weather(){ if(wash<=0){ wash=1; washes++; } }

/* how much of a mass is actually showing, right now */
function exposure(n){ return Math.max(0, (1-n.buried) * (1-n.worn)); }
function standing(n){ return exposure(n) > 0.55; }   // a stack

function erode(dt){
  for(const n of N){
    // cover comes off everywhere at the same rate — the water does not choose
    n.buried = Math.max(0, n.buried - 0.006*dt);
    // the mass itself wears in inverse proportion to how much has been built on it
    n.worn   = Math.min(1, n.worn + 0.0025*dt*(1-n.hardness)*(1-n.hardness));
  }
}

/* THE OTHER HALF OF THE CYCLE — writing buries.
   Erosion alone is monotonic: the world could only ever get emptier, which
   contradicts deposit accumulating. New sediment covers the ground again, so
   the landscape is the running balance of what you wrote and what washed. */
function bury(amount){
  for(const n of N) n.buried = Math.min(1, n.buried + amount);
  saveErosion();
}

function step(){
  // deposit seeks a minimum of the current potential — it settles, nothing sorts it
  for(const p of P){
    const e=7;
    const c=potential(p,p.x,p.y);
    const gx=(potential(p,p.x+e,p.y)-c)/e, gy=(potential(p,p.x,p.y+e)-c)/e;
    p.vx += -gx*0.9 + (Math.random()-0.5)*0.05;
    p.vy += -gy*0.9 + (Math.random()-0.5)*0.05;
    if(wash>0){ p.vx += 1.1*wash; p.vy += (Math.random()-0.5)*0.6*wash; }
    p.vx*=0.90; p.vy*=0.90;
    p.x+=p.vx; p.y+=p.vy;
  }
  // THE QUARRY — rock waits at the face and does not settle. The wash is what
  // breaks it. Gravel then moves with the river, keeping its edges.
  for(const r of ROCK){ r.vx*=0.86; r.vy*=0.86; r.x+=r.vx; r.y+=r.vy; }
  for(const g of GRAVEL){
    const e=7;
    const c=potential(g,g.x,g.y);
    const gx=(potential(g,g.x+e,g.y)-c)/e, gy=(potential(g,g.x,g.y+e)-c)/e;
    g.vx += -gx*0.9; g.vy += -gy*0.9;
    if(wash>0){ g.vx += 1.1*wash; }
    g.vx*=0.90; g.vy*=0.90; g.x+=g.vx; g.y+=g.vy;
  }
  if(wash>0){
    erode(wash);                                   // S6 — cover off, soft rock worn
    if(ROCK.length && Math.random()<0.06*wash) breakRock(wash);
    wash=Math.max(0,wash-0.006);
    if(wash===0) saveErosion();                    // the ground stays uncovered
  }
  cam.x+=(tgt.x-cam.x)*0.09; cam.y+=(tgt.y-cam.y)*0.09; cam.z+=(tgt.z-cam.z)*0.09;
}

/* ============================== RENDER ================================= */
let cam={x:0,y:0,z:0.62}, tgt={x:0,y:0,z:0.62}, hover=-1;
function size(){ const d=Math.min(devicePixelRatio||1,2); W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0); }
addEventListener('resize',size);

/* THE FOUR THRESHOLDS, AS REACH. Below 500 the world is LIMITED — the ground
   is only drawn near you, because that is all that is open yet. Nothing is
   hidden that you wrote; the terrain itself has not come up. */
function reach(){
  if(stage<=0) return 340;        // 200 · a limited world
  if(stage===1) return 1e9;       // 500 · a landscape
  return 1e9;                     // 750+ · the whole world
}
function toolsOpen(){ return stage>=2; }        // 750 · "the whole world and tools"
function heliostatOpen(){ return stage>=3; }    // 1000 · "unlocks the heliostat"

function draw(){
  ctx.clearRect(0,0,W,H);
  const sx=v=>(v-cam.x)*cam.z+W/2, sy=v=>(v-cam.y)*cam.z+H/2;
  const R=reach(), R2=R*R;

  // D3 terrain — contours of the bedrock relief, the ground you did not author today
  const step0=17;
  for(let gy=0;gy<H;gy+=step0) for(let gx=0;gx<W;gx+=step0){
    const wx=(gx-W/2)/cam.z+cam.x, wy=(gy-H/2)/cam.z+cam.y;
    if(wx*wx+wy*wy > R2) continue;              // not open yet — a limited world
    const h=ground(wx,wy);
    if(h<6) continue;
    const a=Math.min(h/210,1);
    ctx.fillStyle='rgba(107,88,68,'+(a*0.16).toFixed(3)+')';
    ctx.fillRect(gx,gy,step0-1,step0-1);
  }

  // D2 grain — bedding, drawn faint. This is Kevin's declared lineage and nothing else.
  ctx.lineWidth=1;
  for(const e of E){
    const A=N[e.a],B=N[e.b];
    const v=Math.min(exposure(A),exposure(B));    // bedding shows only where uncovered
    if(v<=0.02) continue;
    ctx.strokeStyle='rgba(107,88,68,'+((e.dir?0.30:0.10)*v).toFixed(3)+')';
    ctx.beginPath(); ctx.moveTo(sx(A.x),sy(A.y)); ctx.lineTo(sx(B.x),sy(B.y)); ctx.stroke();
  }

  // D9 — bedrock is BURIED until the wash takes the cover off. Nothing here is
  // drawn because it is important; it is visible because it was uncovered.
  for(let i=0;i<N.length;i++){
    const n=N[i], e=exposure(n);
    if(e<=0.02) continue;                       // still under, or worn away
    const X=sx(n.x), Y=sy(n.y);
    const r=Math.max(1.5, (3+n.hardness*9)*(1-n.worn)*cam.z);
    ctx.beginPath(); ctx.arc(X,Y,r,0,6.283);
    ctx.fillStyle= hover===i ? 'rgba(70,98,111,.92)' : 'rgba(107,88,68,'+(e*0.72).toFixed(3)+')';
    ctx.fill();
    if(standing(n)){                            // a stack — it outlasted
      ctx.strokeStyle='rgba(107,88,68,'+(e*0.34).toFixed(3)+')'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(X,Y,r+3.5*cam.z,0,6.283); ctx.stroke();
    }
  }

  // D5 deposit — your sentences, verbatim
  ctx.textBaseline='middle'; ctx.textAlign='center';
  const fs=Math.max(9, 13*cam.z);
  ctx.font=fs+'px "Iowan Old Style", Palatino, Georgia, serif';
  for(const p of P){
    const X=sx(p.x), Y=sy(p.y);
    if(X<-260||X>W+260||Y<-60||Y>H+60) continue;
    const d=Math.hypot(X-W/2,Y-H/2);
    const near=Math.pow(1-Math.min(d/(Math.min(W,H)*0.5),1),1.4);
    const t=p.txt.length>64 ? p.txt.slice(0,64)+'…' : p.txt;
    ctx.fillStyle='rgba(46,40,32,'+(0.16+near*0.78).toFixed(3)+')';
    ctx.fillText(t,X,Y);
  }

  // THE QUARRY — rock at the face, unbroken. Drawn as what it is: cut
  // somewhere else, square-edged, sitting on the surface, not settled.
  for(const r of ROCK){
    const X=sx(r.x), Y=sy(r.y);
    if(X<-200||X>W+200||Y<-200||Y>H+200) continue;
    const s=22*cam.z;
    ctx.save(); ctx.translate(X,Y); ctx.rotate(r.a);
    ctx.strokeStyle='rgba(88,84,78,.72)'; ctx.lineWidth=1.4;
    ctx.strokeRect(-s/2,-s*0.34,s,s*0.68);
    ctx.restore();
  }
  // GRAVEL — broken, moving with the river, edges kept. Never dissolved into
  // your own words: it is drawn smaller, greyer, and angular.
  ctx.font=Math.max(8,10*cam.z)+'px "Iowan Old Style", Palatino, Georgia, serif';
  for(const g of GRAVEL){
    const X=sx(g.x), Y=sy(g.y);
    if(X<-260||X>W+260||Y<-60||Y>H+60) continue;
    const t=g.txt.length>40 ? g.txt.slice(0,40)+'…' : g.txt;
    ctx.fillStyle='rgba(88,84,78,.62)';
    ctx.fillText(t,X,Y);
  }

  // THE HELIOSTAT — 1000 words. It turns to face where the material is, and it
  // is the only thing in the world that turns toward anything.
  if(heliostatOpen()){
    let mx=0,my=0,n=0;
    for(const p of P){ mx+=p.x; my+=p.y; n++; }
    if(n){ mx/=n; my/=n;
      const X=sx(0), Y=sy(0), a=Math.atan2(my-0,mx-0), r=30*cam.z;
      ctx.strokeStyle='rgba(122,90,16,.70)'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.arc(X,Y,r*0.42,0,6.283); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X,Y); ctx.lineTo(X+Math.cos(a)*r, Y+Math.sin(a)*r); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(X+Math.cos(a)*r - Math.sin(a)*r*0.5, Y+Math.sin(a)*r + Math.cos(a)*r*0.5);
      ctx.lineTo(X+Math.cos(a)*r + Math.sin(a)*r*0.5, Y+Math.sin(a)*r - Math.cos(a)*r*0.5);
      ctx.stroke();
    }
  }

  // D7 form — where deposit is dense, something stands
  const cell=64; const bins={};
  for(const p of P){ const k=Math.round(p.x/cell)+','+Math.round(p.y/cell); bins[k]=(bins[k]||0)+1; }
  for(const k in bins){
    if(bins[k]<3) continue;
    const [bx,by]=k.split(',').map(Number);
    const X=sx(bx*cell), Y=sy(by*cell), s=(10+bins[k]*3)*cam.z;
    ctx.strokeStyle='rgba(46,40,32,'+Math.min(0.10+bins[k]*0.05,0.44).toFixed(2)+')';
    ctx.lineWidth=1; ctx.strokeRect(X-s/2,Y-s/2,s,s);
  }

  // D8 indicators — a function of water state only. Never of what anything says.
  for(const p of P){
    if(p.i%3) continue;
    const h=ground(p.x,p.y);
    if(h>4 && h<40){                             // shallow, still → reeds
      const X=sx(p.x), Y=sy(p.y)+9*cam.z;
      ctx.strokeStyle='rgba(70,98,111,.34)'; ctx.lineWidth=1;
      for(let k=-1;k<2;k++){ ctx.beginPath(); ctx.moveTo(X+k*3*cam.z,Y); ctx.lineTo(X+k*3*cam.z,Y-11*cam.z); ctx.stroke(); }
    }
  }
}

let raf;
function loop(){ step(); draw(); raf=requestAnimationFrame(loop); }

/* ============================== THE HANDS ============================== */
let drag=null;
cv.addEventListener('pointerdown',e=>{ drag={x:e.clientX,y:e.clientY,cx:tgt.x,cy:tgt.y,m:0}; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{
  if(drag){ const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag.m+=Math.abs(dx)+Math.abs(dy);
    tgt.x=drag.cx-dx/cam.z; tgt.y=drag.cy-dy/cam.z; return; }
  const wx=(e.clientX-W/2)/cam.z+cam.x, wy=(e.clientY-H/2)/cam.z+cam.y;
  let best=-1,bd=40/cam.z;
  // you cannot put your hand on something that is still buried
  N.forEach((n,i)=>{ if(exposure(n)<=0.05) return;
    const d=Math.hypot(n.x-wx,n.y-wy); if(d<bd){bd=d;best=i;} });
  if(best!==hover){ hover=best;
    if(best>=0){ readout.textContent=N[best].title; readout.classList.add('on'); }
    else readout.classList.remove('on'); }
});
cv.addEventListener('pointerup',()=>{ drag=null; cv.classList.remove('drag'); });
cv.addEventListener('wheel',e=>{ e.preventDefault();
  tgt.z=Math.min(2.2,Math.max(0.20,tgt.z*(e.deltaY>0?0.9:1.111))); },{passive:false});

function setApex(i){ if(!toolsOpen()) return;
  apex=i; [...apexEl.children].forEach((el,k)=>el.classList.toggle('on',k===i));
  for(const p of P){ p.vx*=0.2; p.vy*=0.2; } }
const apexEl=document.getElementById('apex');
for(let i=0;i<4;i++){ const b=document.createElement('div'); b.className='v'+(i===1?' on':'');
  b.title=APEX[i]; b.onclick=()=>setApex(i); apexEl.appendChild(b); }
/* THE TOOLS ARRIVE WITH THE WORLD, AT 750 — "opens the whole world and tools."
   Until then the apex diamonds are not shown and the keys do nothing. They are
   not hidden from you: openStage() says, in your own words, what just opened. */
function syncTools(){ apexEl.style.display = toolsOpen() ? 'flex' : 'none'; }
function openStage(){
  syncTools();
  const s=STAGES[stage];
  if(!s) return;
  readout.textContent = s.w + ' words — ' + s.name;
  readout.classList.add('on');
  clearTimeout(openStage._t);
  openStage._t=setTimeout(()=>readout.classList.remove('on'), 4200);
}
addEventListener('keydown',e=>{
  if(e.key==='Escape'){ e.preventDefault(); if(penOpen) closePen(); else openPen(); return; }
  if(penOpen || !afloat || !toolsOpen()) return;
  if(e.key>='1'&&e.key<='4') setApex(+e.key-1);
  if(e.key.toLowerCase()==='w') weather();
});

/* ============================== THE DRAW =============================== */
/* THE PEN IS NEVER CLOSED. The four thresholds are crossed by writing more, so
   the headwaters have to stay reachable — a world that lifts you at 200 words
   and then takes the pen away can never reach 500. Escape opens and closes it,
   from anywhere, at any stage. The pen is the source, not a tool, and is the
   one thing here that is never gated. */
function depositPen(){
  const ss=sentences(pen.value);
  if(ss.length) addStones(ss);
  pen.value='';                              // deposited — the bar clears, as the Bar's does
  try{ localStorage.setItem(DRAFT,''); }catch(e){}
  PRIOR_WORDS = stoneTexts().reduce((a,t)=>a+words(t),0);
}
function reseed(){
  const all=stoneTexts();
  seed(all); level=all.reduce((a,t)=>a+words(t),0);
}
let penOpen=true;
function openPen(){
  penOpen=true; head.style.display='flex'; head.style.opacity='1';
  requestAnimationFrame(()=>{ rise(); pen.focus(); });
}
function closePen(){
  if(!penOpen) return;
  penOpen=false; depositPen(); if(afloat) reseed();
  pen.blur(); head.style.opacity='0';
  setTimeout(()=>{ if(!penOpen) head.style.display='none'; },1200);
}
function lift(){
  if(afloat) return; afloat=true;
  /* The pen's sentences become stones in the shared store BEFORE they settle —
     deposit-before-render, the same ordering decisions.py enforces. */
  penOpen=false; depositPen();
  pen.blur(); head.style.opacity='0';
  setTimeout(()=>{
    if(!penOpen) head.style.display='none';
    size();
    const all=stoneTexts();
    relax(260); seed(all); level=all.reduce((a,t)=>a+words(t),0);
    seedRock(loadQuarry());                 // the quarry face, as it stands
    world.classList.add('here'); syncTools(); loop();
  },1800);
}

(function start(){
  const all=stoneTexts();
  PRIOR_WORDS = all.reduce((a,t)=>a+words(t),0);
  let draft=''; try{ draft=localStorage.getItem(DRAFT)||''; }catch(e){}
  if(draft) pen.value=draft;
  stage = stageFor(PRIOR_WORDS + words(draft));
  if(PRIOR_WORDS + words(draft) >= DRAW){
    /* Already past the first threshold — the catchment carried over. */
    penOpen=false; head.style.display='none'; afloat=true; size();
    if(words(draft)) depositPen();
    const material = stoneTexts();
    relax(260); seed(material); level=material.reduce((a,t)=>a+words(t),0);
    seedRock(loadQuarry());
    world.classList.add('here'); syncTools(); loop(); return;
  }
  size(); rise(); pen.focus();
})();
</script>
