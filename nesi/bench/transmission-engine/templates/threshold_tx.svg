<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Transmission register: warm off-white field, dark earth geometry -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3020" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#7a6840" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7a6840" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a6840" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#3a3020" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a6840" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f5f0"/>

  <!-- Title -->
  <text x="800" y="180" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="56" font-weight="400" letter-spacing="6"
        fill="#1a1408">{{TITLE}}</text>

  <!-- Left side label -->
  <text x="380" y="430" text-anchor="middle"
        font-family="Inter, Helvetica, sans-serif"
        font-size="22" font-weight="300" letter-spacing="4"
        fill="#7a6840">{{LEFT_TERM}}</text>

  <!-- Threshold line -->
  <line x1="200" y1="500" x2="1400" y2="500"
        stroke="url(#line)" stroke-width="1.5"/>

  <!-- Luminous threshold point — earth glow on light field -->
  <circle cx="800" cy="500" r="80" fill="url(#glow)"/>
  <circle cx="800" cy="500" r="6" fill="#3a3020"/>

  <!-- Right side label -->
  <text x="1220" y="570" text-anchor="middle"
        font-family="Inter, Helvetica, sans-serif"
        font-size="22" font-weight="300" letter-spacing="4"
        fill="#7a6840">{{RIGHT_TERM}}</text>

  <!-- Subtitle -->
  <text x="800" y="780" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="22" font-style="italic" font-weight="300"
        fill="#7a6840">{{SUBTITLE}}</text>
</svg>
