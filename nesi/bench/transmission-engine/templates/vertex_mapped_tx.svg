<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Transmission register: warm off-white field, dark earth geometry -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3020" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7a6840" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f5f0"/>

  <text x="800" y="130" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="50" font-weight="400" letter-spacing="6"
        fill="#1a1408">{{TITLE}}</text>

  <!-- Equilateral triangle (N=3); extend by adding vertices as needed -->
  <!-- Apex (800, 280); base-left (520, 720); base-right (1080, 720) -->
  <polygon points="800,280 520,720 1080,720"
           fill="none" stroke="#3a3020" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Central connection lines -->
  <line x1="800" y1="280" x2="800" y2="720" stroke="#ccc5b0" stroke-width="0.8" stroke-opacity="0.7"/>
  <line x1="520" y1="720" x2="1080" y2="720" stroke="#3a3020" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Vertex 1 (apex) -->
  <circle cx="800" cy="280" r="40" fill="url(#glow)"/>
  <circle cx="800" cy="280" r="6" fill="#3a3020"/>
  <text x="800" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" letter-spacing="4" fill="#1a1408">{{VERTEX_1}}</text>

  <!-- Vertex 2 -->
  <circle cx="520" cy="720" r="40" fill="url(#glow)"/>
  <circle cx="520" cy="720" r="6" fill="#3a3020"/>
  <text x="460" y="770" text-anchor="end" font-family="Inter, sans-serif" font-size="22" letter-spacing="4" fill="#1a1408">{{VERTEX_2}}</text>

  <!-- Vertex 3 -->
  <circle cx="1080" cy="720" r="40" fill="url(#glow)"/>
  <circle cx="1080" cy="720" r="6" fill="#3a3020"/>
  <text x="1140" y="770" text-anchor="start" font-family="Inter, sans-serif" font-size="22" letter-spacing="4" fill="#1a1408">{{VERTEX_3}}</text>

  <text x="800" y="840" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="22" font-style="italic" font-weight="300"
        fill="#7a6840">{{SUBTITLE}}</text>
</svg>
