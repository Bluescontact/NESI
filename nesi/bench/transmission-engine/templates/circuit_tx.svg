<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Transmission register: warm off-white field, dark earth geometry -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3020" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7a6840" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f5f0"/>

  <text x="800" y="160" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="52" font-weight="400" letter-spacing="6"
        fill="#1a1408">{{TITLE}}</text>

  <!-- Circuit loop -->
  <ellipse cx="800" cy="500" rx="280" ry="180"
           fill="none" stroke="#3a3020" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Four luminous points around the loop -->
  <circle cx="1080" cy="500" r="40" fill="url(#glow)"/>
  <circle cx="1080" cy="500" r="5" fill="#3a3020"/>
  <text x="1180" y="508" font-family="Inter, sans-serif" font-size="18" letter-spacing="3" fill="#7a6840">{{NODE_1}}</text>

  <circle cx="800" cy="320" r="40" fill="url(#glow)"/>
  <circle cx="800" cy="320" r="5" fill="#3a3020"/>
  <text x="800" y="270" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" letter-spacing="3" fill="#7a6840">{{NODE_2}}</text>

  <circle cx="520" cy="500" r="40" fill="url(#glow)"/>
  <circle cx="520" cy="500" r="5" fill="#3a3020"/>
  <text x="420" y="508" text-anchor="end" font-family="Inter, sans-serif" font-size="18" letter-spacing="3" fill="#7a6840">{{NODE_3}}</text>

  <circle cx="800" cy="680" r="40" fill="url(#glow)"/>
  <circle cx="800" cy="680" r="5" fill="#3a3020"/>
  <text x="800" y="740" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" letter-spacing="3" fill="#7a6840">{{NODE_4}}</text>

  <!-- Subtitle -->
  <text x="800" y="820" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="22" font-style="italic" font-weight="300"
        fill="#7a6840">{{SUBTITLE}}</text>
</svg>
