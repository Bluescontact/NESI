<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Transmission register: warm off-white field, dark earth geometry -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3020" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#7a6840" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f5f0"/>

  <text x="800" y="130" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="50" font-weight="400" letter-spacing="6"
        fill="#1a1408">{{TITLE}}</text>

  <!-- Input node -->
  <circle cx="280" cy="500" r="50" fill="url(#glow)"/>
  <circle cx="280" cy="500" r="6" fill="#3a3020"/>
  <text x="280" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" letter-spacing="4" fill="#1a1408">{{INPUT}}</text>

  <!-- Flow line in -->
  <line x1="340" y1="500" x2="650" y2="500" stroke="#3a3020" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Filter / criteria (vertical band) -->
  <rect x="660" y="320" width="280" height="360" fill="none" stroke="#3a3020" stroke-width="1.5" stroke-opacity="0.8"/>
  <text x="800" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" letter-spacing="4" fill="#1a1408">{{CRITERIA}}</text>
  <text x="800" y="490" text-anchor="middle" font-family="Cormorant Garamond, Garamond, serif" font-style="italic" font-size="18" letter-spacing="2" fill="#7a6840">{{CRITERIA_NOTE_1}}</text>
  <text x="800" y="520" text-anchor="middle" font-family="Cormorant Garamond, Garamond, serif" font-style="italic" font-size="18" letter-spacing="2" fill="#7a6840">{{CRITERIA_NOTE_2}}</text>

  <!-- Flow line out -->
  <line x1="950" y1="500" x2="1260" y2="500" stroke="#3a3020" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Output node -->
  <circle cx="1320" cy="500" r="50" fill="url(#glow)"/>
  <circle cx="1320" cy="500" r="6" fill="#3a3020"/>
  <text x="1320" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" letter-spacing="4" fill="#1a1408">{{OUTPUT}}</text>

  <text x="800" y="820" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="22" font-style="italic" font-weight="300"
        fill="#7a6840">{{SUBTITLE}}</text>
</svg>
