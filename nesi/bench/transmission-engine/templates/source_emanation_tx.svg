<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Transmission register: warm off-white field, dark earth geometry -->
    <radialGradient id="source" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3020" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#7a6840" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#7a6840" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="emit" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3a3020" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7a6840" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="#f7f5f0"/>

  <text x="800" y="140" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="52" font-weight="400" letter-spacing="6"
        fill="#1a1408">{{TITLE}}</text>

  <!-- Central source -->
  <circle cx="800" cy="500" r="180" fill="url(#source)"/>
  <circle cx="800" cy="500" r="12" fill="#3a3020"/>
  <text x="800" y="490" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="28" font-weight="400" letter-spacing="5"
        fill="#1a1408">{{SOURCE_TERM}}</text>
  <text x="800" y="520" text-anchor="middle"
        font-family="Inter, sans-serif" font-size="14" font-style="italic" letter-spacing="2"
        fill="#7a6840">{{SOURCE_NOTE}}</text>

  <!-- Emanations: four radiating lines -->
  <line x1="800" y1="500" x2="400" y2="280" stroke="#ccc5b0" stroke-width="0.8" stroke-opacity="0.8"/>
  <line x1="800" y1="500" x2="1200" y2="280" stroke="#ccc5b0" stroke-width="0.8" stroke-opacity="0.8"/>
  <line x1="800" y1="500" x2="400" y2="720" stroke="#ccc5b0" stroke-width="0.8" stroke-opacity="0.8"/>
  <line x1="800" y1="500" x2="1200" y2="720" stroke="#ccc5b0" stroke-width="0.8" stroke-opacity="0.8"/>

  <circle cx="400" cy="280" r="35" fill="url(#emit)"/>
  <circle cx="400" cy="280" r="4" fill="#7a6840"/>
  <text x="400" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" letter-spacing="2" fill="#7a6840">{{EMANATION_1}}</text>

  <circle cx="1200" cy="280" r="35" fill="url(#emit)"/>
  <circle cx="1200" cy="280" r="4" fill="#7a6840"/>
  <text x="1200" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" letter-spacing="2" fill="#7a6840">{{EMANATION_2}}</text>

  <circle cx="400" cy="720" r="35" fill="url(#emit)"/>
  <circle cx="400" cy="720" r="4" fill="#7a6840"/>
  <text x="400" y="770" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" letter-spacing="2" fill="#7a6840">{{EMANATION_3}}</text>

  <circle cx="1200" cy="720" r="35" fill="url(#emit)"/>
  <circle cx="1200" cy="720" r="4" fill="#7a6840"/>
  <text x="1200" y="770" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" letter-spacing="2" fill="#7a6840">{{EMANATION_4}}</text>

  <text x="800" y="840" text-anchor="middle"
        font-family="Cormorant Garamond, Garamond, serif"
        font-size="22" font-style="italic" font-weight="300"
        fill="#7a6840">{{SUBTITLE}}</text>
</svg>
