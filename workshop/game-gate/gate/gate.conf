# gate.conf — plain text on purpose. Readable with `cat`, parseable with nothing running.

# where the build lives, for 01-motion
repo = ../../..

# 01-motion · Card 02 — how far back to look, and the share of machine
# authorship above which the graph is green and the hand has left.
motion_window_days = 3
motion_bot_ceiling = 0.85

# 02-selfuse · Card 06 — an organ not routed through in this many days,
# but built within it, is refused.
selfuse_window_days = 14

# 03-blanks · Card 03 — CANDIDATE ONLY while the fork remains open.
# This value is retained for deliberate/manual runs; gate.mjs does not enforce it.
blank_max_gap_days = 7

# 04-horizon · Card 05 — loosening waits. Tightening, refusing and
# deferring stay available now.
horizon_days = 7

# 05-subtract · Card 13 — ACTIVE since 2026-09-01: fork closed by the keeper ("build the subtraction membrane"); the quota lives here, enforced by the instrument.
# This value is retained for deliberate/manual runs; gate.mjs does not enforce it.
subtract_quota_days = 14

# 06-landed — the admission window. Nothing is refused for an empty one;
# held is lawful and a fallow season is a correct state.
landed_window_days = 30

# 07-magnitude — a proposal above this (1-10) cannot close on the sitting
# that proposed it; it needs a second, separate mark.
magnitude_threshold = 6

# 08-return — no config; reads ORGANS.txt against RETURNS.txt directly.

# 09-dispute — CANDIDATE ONLY. Mechanism records disputes against a refusal;
# whether a dispute changes anything is an open fork, so this instrument is
# always HELD, never enforced as law.
